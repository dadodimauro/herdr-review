<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
    /* Layout: sticky contents on the left, the change in topics on the right; each change = plain note + diff + threads */
    /* GitHub Primer colors: light, then dark */
    :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --fg: #1f2328;
        --muted: #59636e;
        --line: #d1d9e0;
        --accent: #0969da;
        --accent-soft: #ddf4ff;
        --accent-emphasis: #0969da;
        --add-bg: #dafbe1;
        --add-strong: #aceebb;
        --add-fg: #1a7f37;
        --del-bg: #ffebe9;
        --del-fg: #d1242f;
        --ctx-fg: #1f2328;
        --code-bg: #f6f8fa;
        --gap-bg: #eff2f5;
        --hunk-bg: #ddf4ff;
        --note-bg: #f6f8fa;
        --warn: #9a6700;
        --warn-bg: #fff8c5;
        --ok: #1a7f37;
        --ok-bg: #dafbe1;
        --sel: rgb(255 223 93 / 0.4);
        --hl-kw: #cf222e;
        --hl-str: #0a3069;
        --hl-num: #0550ae;
        --hl-com: #59636e;
        --hl-fn: #6639ba;
        --hl-cls: #953800;
        --hl-dec: #6639ba;
        --hl-bi: #0550ae;
        --sev-critical: #d1242f;
        --sev-critical-bg: #ffebe9;
        --sev-major: #bc4c00;
        --sev-major-bg: #fff1e5;
        --sev-minor: #9a6700;
        --sev-minor-bg: #fff8c5;
        --sev-nit: #59636e;
        --sev-nit-bg: #eff2f5;
        --gh: #1f2328;
        --gh-bg: #eff2f5;
        --done: #8250df;
        --fg-on-emphasis: #ffffff;
        --btn-bg: #f6f8fa;
        --btn-primary-bg: #1f883d;
        --btn-primary-hover-bg: #1c8139;
        --danger-emphasis: #cf222e;
        --state-open: #1f883d;
        --state-draft: #59636e;
        --state-merged: #8250df;
        --state-closed: #cf222e;
        --claude: #d97757;
        --backdrop: rgb(31 35 40 / 0.5);
        --shadow: 0 1px 3px rgb(31 35 40 / 0.12), 0 8px 24px rgb(66 74 83 / 0.12);
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --bg: #0d1117;
            --surface: #0d1117;
            --fg: #f0f6fc;
            --muted: #9198a1;
            --line: #3d444d;
            --accent: #4493f8;
            --accent-soft: #111d2e;
            --accent-emphasis: #1f6feb;
            --add-bg: rgb(46 160 67 / 0.15);
            --add-strong: rgb(46 160 67 / 0.4);
            --add-fg: #3fb950;
            --del-bg: rgb(248 81 73 / 0.1);
            --del-fg: #f85149;
            --ctx-fg: #f0f6fc;
            --code-bg: #151b23;
            --gap-bg: #1f232a;
            --hunk-bg: #111d2e;
            --note-bg: #151b23;
            --warn: #d29922;
            --warn-bg: #272215;
            --ok: #3fb950;
            --ok-bg: rgb(46 160 67 / 0.15);
            --sel: rgb(187 128 9 / 0.15);
            --hl-kw: #ff7b72;
            --hl-str: #a5d6ff;
            --hl-num: #79c0ff;
            --hl-com: #9198a1;
            --hl-fn: #d2a8ff;
            --hl-cls: #ffa657;
            --hl-dec: #d2a8ff;
            --hl-bi: #79c0ff;
            --sev-critical: #f85149;
            --sev-critical-bg: rgb(248 81 73 / 0.1);
            --sev-major: #db6d28;
            --sev-major-bg: rgb(219 109 40 / 0.1);
            --sev-minor: #d29922;
            --sev-minor-bg: rgb(187 128 9 / 0.15);
            --sev-nit: #9198a1;
            --sev-nit-bg: rgb(101 108 118 / 0.2);
            --gh: #f0f6fc;
            --gh-bg: rgb(101 108 118 / 0.2);
            --done: #ab7df8;
            --btn-bg: #212830;
            --btn-primary-bg: #238636;
            --btn-primary-hover-bg: #29903b;
            --danger-emphasis: #da3633;
            --state-open: #238636;
            --state-draft: #656c76;
            --state-merged: #8957e5;
            --state-closed: #da3633;
            --backdrop: rgb(1 4 9 / 0.8);
            --shadow: 0 0 0 1px #3d444d, 0 6px 12px -3px rgb(1 4 9 / 0.4), 0 6px 18px 0 rgb(1 4 9 / 0.4);
            color-scheme: dark;
        }
    }

    :root[data-theme="dark"] {
        --bg: #0d1117;
        --surface: #0d1117;
        --fg: #f0f6fc;
        --muted: #9198a1;
        --line: #3d444d;
        --accent: #4493f8;
        --accent-soft: #111d2e;
        --accent-emphasis: #1f6feb;
        --add-bg: rgb(46 160 67 / 0.15);
        --add-strong: rgb(46 160 67 / 0.4);
        --add-fg: #3fb950;
        --del-bg: rgb(248 81 73 / 0.1);
        --del-fg: #f85149;
        --ctx-fg: #f0f6fc;
        --code-bg: #151b23;
        --gap-bg: #1f232a;
        --hunk-bg: #111d2e;
        --note-bg: #151b23;
        --warn: #d29922;
        --warn-bg: #272215;
        --ok: #3fb950;
        --ok-bg: rgb(46 160 67 / 0.15);
        --sel: rgb(187 128 9 / 0.15);
        --hl-kw: #ff7b72;
        --hl-str: #a5d6ff;
        --hl-num: #79c0ff;
        --hl-com: #9198a1;
        --hl-fn: #d2a8ff;
        --hl-cls: #ffa657;
        --hl-dec: #d2a8ff;
        --hl-bi: #79c0ff;
        --sev-critical: #f85149;
        --sev-critical-bg: rgb(248 81 73 / 0.1);
        --sev-major: #db6d28;
        --sev-major-bg: rgb(219 109 40 / 0.1);
        --sev-minor: #d29922;
        --sev-minor-bg: rgb(187 128 9 / 0.15);
        --sev-nit: #9198a1;
        --sev-nit-bg: rgb(101 108 118 / 0.2);
        --gh: #f0f6fc;
        --gh-bg: rgb(101 108 118 / 0.2);
        --done: #ab7df8;
        --btn-bg: #212830;
        --btn-primary-bg: #238636;
        --btn-primary-hover-bg: #29903b;
        --danger-emphasis: #da3633;
        --state-open: #238636;
        --state-draft: #656c76;
        --state-merged: #8957e5;
        --state-closed: #da3633;
        --backdrop: rgb(1 4 9 / 0.8);
        --shadow: 0 0 0 1px #3d444d, 0 6px 12px -3px rgb(1 4 9 / 0.4), 0 6px 18px 0 rgb(1 4 9 / 0.4);
        color-scheme: dark;
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        overflow-anchor: none;
    }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.55;
    }

    /* Paints the top safe area so content that scrolls under the sticky toolbar stays hidden */
    body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto 0;
        height: env(safe-area-inset-top, 0px);
        background: var(--bg);
        z-index: 60;
    }

    h1, h2, h3, h4 {
        text-wrap: balance;
        margin: 0;
        line-height: 1.25;
    }

    h1 {
        font-size: 1.6rem;
        font-weight: 600;
    }

    h2 {
        font-size: 1.2rem;
        font-weight: 600;
    }

    p {
        margin: 0;
    }

    code, .mono {
        font-family: var(--font-mono);
        font-size: 0.88em;
    }

    a {
        color: var(--accent);
    }

    button, select {
        font: inherit;
        font-size: 0.85rem;
        background: var(--btn-bg);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
    }

    button:hover {
        border-color: var(--accent);
    }

    :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    button.primary {
        background: var(--btn-primary-bg);
        border-color: var(--btn-primary-bg);
        color: var(--fg-on-emphasis);
        font-weight: 600;
    }

    button.primary:hover:not([disabled]) {
        background: var(--btn-primary-hover-bg);
        border-color: var(--btn-primary-hover-bg);
    }

    button[disabled], button[aria-disabled="true"] {
        opacity: 0.5;
        cursor: default;
    }

    button.linkish {
        border: 0;
        background: none;
        padding: 0;
        color: var(--accent);
        text-decoration: underline;
        font-size: inherit;
    }

    button.mini {
        font-size: 0.76rem;
        padding: 1px 8px;
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
    }

    .muted {
        color: var(--muted);
    }

    .plus {
        color: var(--add-fg);
        font-weight: 500;
    }

    .minus {
        color: var(--del-fg);
        font-weight: 500;
    }

    .d {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }

    .shell {
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        overflow-x: clip;
    }

    .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
        max-width: 1500px;
        margin: 0 auto;
        padding-block: 16px 96px;
    }

    @media (min-width: 900px) {
        .layout {
            grid-template-columns: 280px minmax(0, 1fr);
            gap: 24px;
        }

        .side {
            position: sticky;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            max-height: calc(100vh - 24px - env(safe-area-inset-top, 0px));
            overflow: auto;
            align-self: start;
        }

        .contents-toggle {
            display: none !important;
        }
    }

    main {
        display: grid;
        gap: 20px;
        min-width: 0;
        align-content: start;
    }

    /* One-column grids: a long line (code, diagram) scrolls in its own box and never widens the column */
    main, .intro, .side, .side-body, .panel, .walk, .walk > section, .wsec, .stack, .tcell, .cm-main, .md, .md blockquote,
    .th-foot, .fthreads, .outdated-box, .composer, .finish, .fin-items, .notice-card {
        grid-template-columns: minmax(0, 1fr);
    }

    .side {
        display: grid;
        gap: 12px;
        align-content: start;
        min-width: 0;
    }

    .side-body {
        display: grid;
        gap: 12px;
        min-width: 0;
    }

    .contents-toggle {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 8px;
    }

    @media (max-width: 899px) {
        .side-body:not(.open) {
            display: none;
        }
    }

    .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px 16px;
        display: grid;
        gap: 10px;
        min-width: 0;
    }

    .panel h3, .walk h3 {
        font-size: 0.74rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 600;
    }

    .progress {
        height: 6px;
        border-radius: 3px;
        background: var(--gap-bg);
        overflow: hidden;
    }

    .progress > i {
        display: block;
        height: 100%;
        background: var(--accent);
        width: 0;
        transition: width 0.2s;
    }

    /* Sticky toolbar at the top of main */
    .tbar-wrap {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 30;
        background: var(--bg);
        padding: 8px 0;
        margin-top: -8px;
        border-bottom: 1px solid var(--line);
    }

    .tbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 8px;
        align-items: center;
    }

    .tbar .spacer {
        flex: 1 1 auto;
    }

    .seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
    }

    .seg button {
        border: 0;
        border-radius: 0;
        padding: 4px 10px;
    }

    .seg button + button {
        border-left: 1px solid var(--line);
    }

    .seg button[aria-pressed="true"], .tbar > button[aria-pressed="true"] {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
    }

    .tbar > button[aria-pressed="true"] {
        border-color: var(--accent);
    }

    #finish-btn .count {
        font-variant-numeric: tabular-nums;
    }

    .intro {
        display: grid;
        gap: 8px;
    }

    .eyebrow {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        align-items: center;
        font-family: var(--font-mono);
        font-size: 0.74rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
    }

    .eyebrow .sep {
        color: var(--line);
    }

    .lede {
        max-width: 78ch;
        color: var(--muted);
    }

    .lede code {
        color: var(--fg);
    }

    .newnote {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;
        font-size: 0.88rem;
    }

    /* The PR as GitHub showed it at build time: state, author, review status, reviewers and checks */
    .prwrap {
        display: grid;
        gap: 10px;
    }

    .prwrap[hidden] {
        display: none;
    }

    .prline {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 8px;
        align-items: center;
        color: var(--muted);
        font-size: 0.9rem;
    }

    .prline b {
        color: var(--fg);
    }

    .prline code {
        color: var(--accent);
        background: var(--accent-soft);
        padding: 1px 6px;
        border-radius: 6px;
        overflow-wrap: anywhere;
    }

    .prstate {
        padding: 3px 12px;
        border-radius: 999px;
        background: var(--state-open);
        color: var(--fg-on-emphasis);
        font-size: 0.86rem;
        font-weight: 500;
    }

    .prstate.draft {
        background: var(--state-draft);
    }

    .prstate.merged {
        background: var(--state-merged);
    }

    .prstate.closed {
        background: var(--state-closed);
    }

    .prbox {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
    }

    .prrow {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 12px;
        padding: 12px 16px;
    }

    .prrow + .prrow, .prfoot {
        border-top: 1px solid var(--line);
    }

    .pric {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: var(--muted);
        background: var(--gap-bg);
    }

    .pric.ok, .rst.ok {
        color: var(--ok);
    }

    .pric.ok {
        background: var(--ok-bg);
    }

    .pric.bad, .rst.bad {
        color: var(--sev-critical);
    }

    .pric.bad {
        background: var(--sev-critical-bg);
    }

    .pric.wait, .rst.wait {
        color: var(--warn);
    }

    .pric.wait {
        background: var(--sev-minor-bg);
    }

    .ic {
        width: 16px;
        height: 16px;
        flex: none;
    }

    .prtext {
        display: grid;
        gap: 2px;
        min-width: 0;
        font-size: 0.86rem;
    }

    .prtext > b {
        font-size: 0.95rem;
    }

    .revs, .checks ul {
        list-style: none;
        margin: 6px 0 0;
        padding: 0;
        display: grid;
        gap: 6px;
    }

    .revs li, .checks li {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        align-items: center;
        min-width: 0;
    }

    .rst {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        color: var(--muted);
    }

    .botmark {
        padding: 0 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.72rem;
    }

    .checks summary {
        margin-top: 4px;
        color: var(--accent);
        cursor: pointer;
    }

    .checks .wf {
        color: var(--muted);
    }

    .checks li b, .checks .wf, .revs li b, .gh-news li {
        overflow-wrap: anywhere;
    }

    .checks li a {
        margin-left: auto;
    }

    .prfoot {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px;
        border-radius: 0 0 6px 6px;
        background: var(--note-bg);
        color: var(--muted);
        font-size: 0.82rem;
    }

    .prfoot button {
        display: inline-flex;
        gap: 6px;
        align-items: center;
    }

    /* The answer of a GitHub check, when the PR has something new */
    .gh-news {
        width: min(520px, calc(100vw - 32px));
        padding: 16px 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        color: var(--fg);
        box-shadow: var(--shadow);
    }

    .gh-news::backdrop {
        background: var(--backdrop);
    }

    .gh-news ul {
        margin: 10px 0;
        padding-left: 20px;
        display: grid;
        gap: 4px;
    }

    .gh-news p {
        margin: 6px 0 0;
    }

    .gh-news-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        justify-content: flex-end;
        margin-top: 16px;
    }

    .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 0.72rem;
        font-weight: 500;
        line-height: 1.5;
        padding: 0 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
        text-decoration: none;
    }

    .pill.draft {
        color: var(--accent);
        border-color: var(--accent);
    }

    .pill.posted, .pill.ok {
        color: var(--ok);
        border-color: var(--ok);
    }

    .pill.warn, .pill.dirty {
        color: var(--warn);
        border-color: var(--warn);
        background: var(--warn-bg);
    }

    .pill.st-to_claude, .pill.st-handled {
        color: var(--accent);
        border-color: var(--accent);
        background: var(--accent-soft);
    }

    .pill.st-to_github {
        color: var(--gh);
        border-color: var(--gh);
    }

    .pill.gh {
        color: var(--gh);
        background: var(--gh-bg);
        border-color: transparent;
        font-weight: 600;
    }

    .pill.ai {
        color: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
        padding: 0 5px;
    }

    .pill.new {
        color: var(--fg-on-emphasis);
        background: var(--accent-emphasis);
        border-color: var(--accent-emphasis);
        font-weight: 600;
    }

    .pill.open-th {
        color: var(--fg);
    }

    .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 0.76rem;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 7px;
        background: var(--surface);
        text-decoration: none;
        white-space: nowrap;
    }

    a.chip:hover {
        border-color: var(--accent);
        color: var(--accent);
    }

    /* Severity: color and text */
    .sev {
        --c: var(--sev-nit);
        --b: var(--sev-nit-bg);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.72rem;
        font-weight: 600;
        line-height: 1.5;
        padding: 0 8px;
        border-radius: 999px;
        color: var(--c);
        background: var(--b);
        border: 1px solid var(--c);
        white-space: nowrap;
    }

    .sev::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--c);
    }

    .sev.critical, .sev-critical {
        --c: var(--sev-critical);
        --b: var(--sev-critical-bg);
    }

    .sev.major, .sev-major {
        --c: var(--sev-major);
        --b: var(--sev-major-bg);
    }

    .sev.minor, .sev-minor {
        --c: var(--sev-minor);
        --b: var(--sev-minor-bg);
    }

    .sev.nit, .sev-nit {
        --c: var(--sev-nit);
        --b: var(--sev-nit-bg);
    }

    /* Claude mark: an accent disc with a four-point star, drawn in CSS */
    .claude-mark {
        display: inline-block;
        position: relative;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--claude);
        flex: none;
    }

    .claude-mark::after {
        content: "";
        position: absolute;
        inset: 5px;
        background: var(--surface);
        clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
    }

    .claude-mark.sm {
        width: 16px;
        height: 16px;
    }

    .claude-mark.sm::after {
        inset: 3px;
    }

    /* Walkthrough card */
    .walk {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px 18px;
        display: grid;
        gap: 18px;
        min-width: 0;
    }

    .walk > section, .walk .wsec {
        display: grid;
        gap: 10px;
        min-width: 0;
    }

    .walk h4 {
        font-size: 0.95rem;
        font-weight: 600;
    }

    .effort {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;
        font-size: 0.9rem;
    }

    .meter {
        display: inline-flex;
        gap: 3px;
    }

    .meter i {
        width: 18px;
        height: 6px;
        border-radius: 3px;
        background: var(--gap-bg);
    }

    .meter i.on {
        background: var(--accent);
    }

    table.topics {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
    }

    table.topics th {
        text-align: left;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        font-weight: 600;
        padding: 4px 8px;
        border-bottom: 1px solid var(--line);
    }

    table.topics td {
        padding: 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
    }

    table.topics td.num {
        font-family: var(--font-mono);
        color: var(--accent);
        width: 2em;
    }

    table.topics td.tt a {
        font-weight: 600;
        color: var(--fg);
        text-decoration: none;
    }

    table.topics td.tt a:hover {
        color: var(--accent);
        text-decoration: underline;
    }

    table.topics .tf {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 10px;
        font-family: var(--font-mono);
        font-size: 0.76rem;
        color: var(--muted);
    }

    table.topics td.sum {
        color: var(--muted);
        max-width: 48ch;
    }

    @media (max-width: 640px) {
        table.topics, table.topics tbody, table.topics tr, table.topics td {
            display: block;
        }

        table.topics thead {
            display: none;
        }

        table.topics tr {
            border-bottom: 1px solid var(--line);
            padding: 6px 0;
        }

        table.topics td {
            border: 0;
            padding: 2px 0;
        }

        table.topics td.num {
            display: none;
        }
    }

    .sevrow {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        align-items: center;
        font-size: 0.84rem;
    }

    .sevrow .cnt {
        display: inline-flex;
        gap: 6px;
        align-items: center;
    }

    ul.flist {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
        font-size: 0.88rem;
    }

    ul.flist li {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        align-items: baseline;
        min-width: 0;
    }

    ul.flist a {
        color: var(--fg);
        font-weight: 500;
    }

    ul.flist .loc {
        font-family: var(--font-mono);
        font-size: 0.76rem;
        color: var(--muted);
        word-break: break-all;
    }

    .empty {
        color: var(--muted);
        font-size: 0.9rem;
    }

    .empty.ok {
        color: var(--ok);
    }

    .loading::after {
        content: "";
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-left: 8px;
        border: 2px solid var(--line);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        vertical-align: -1px;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .notice {
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        background: var(--accent-soft);
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 0.88rem;
    }

    details.diagram > summary, details.dz > summary {
        cursor: pointer;
        font-weight: 600;
        font-size: 0.95rem;
    }

    .diagram-box {
        margin: 8px 0 0;
        padding: 10px 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow-x: auto;
    }

    .diagram-box > svg {
        display: block;
        height: auto;
        margin: 0 auto;
    }

    .diagram-box > p {
        margin: 0;
    }

    .diagram-box > pre {
        margin: 8px 0 0;
        font-family: var(--font-mono);
        font-size: 12.5px;
        white-space: pre;
    }

    ul.udrafts {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
    }

    ul.udrafts .ud-head {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        align-items: center;
        justify-content: space-between;
    }

    ul.udrafts .btns {
        display: inline-flex;
        gap: 6px;
    }

    ul.udrafts .what {
        font-family: var(--font-mono);
        font-size: 0.76rem;
        color: var(--muted);
        word-break: break-all;
    }

    ul.udrafts pre {
        margin: 4px 0 0;
        padding: 6px 10px;
        background: var(--code-bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        font-family: var(--font-mono);
        font-size: 12.5px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 12em;
        overflow: auto;
    }

    ul.batches {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
        font-size: 0.86rem;
    }

    ul.batches li {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        align-items: center;
    }

    ul.batches .bnote {
        flex-basis: 100%;
        color: var(--muted);
        padding-left: 4px;
        border-left: 2px solid var(--accent);
        padding-inline-start: 8px;
    }

    .bst {
        font-size: 0.72rem;
        font-weight: 600;
        border-radius: 999px;
        padding: 0 8px;
        border: 1px solid var(--line);
    }

    .bst.done {
        color: var(--ok);
        border-color: var(--ok);
    }

    .bst.failed {
        color: var(--sev-critical);
        border-color: var(--sev-critical);
    }

    .bst.working, .bst.pending {
        color: var(--accent);
        border-color: var(--accent);
    }

    .stack {
        display: grid;
        gap: 10px;
        min-width: 0;
    }

    /* Sidebar tree */
    .tree {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
        font-size: 0.86rem;
    }

    .tree > li > a {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 8px;
        align-items: baseline;
        color: inherit;
        text-decoration: none;
        font-weight: 600;
    }

    .tree > li > a:hover {
        color: var(--accent);
    }

    .tree .ci {
        font-family: var(--font-mono);
        color: var(--accent);
    }

    .tree ul {
        list-style: none;
        margin: 4px 0 0;
        padding: 0 0 0 18px;
        display: grid;
        gap: 1px;
    }

    .tree.flat ul {
        padding: 0;
    }

    .tree ul a {
        display: grid;
        grid-template-columns: 12px minmax(0, 1fr) auto 8px;
        gap: 6px;
        align-items: baseline;
        color: var(--muted);
        text-decoration: none;
        padding: 2px 4px;
        border-radius: 4px;
    }

    .tree ul a:hover, .tree ul a.current {
        background: var(--accent-soft);
        color: var(--fg);
    }

    .tree .fn {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--font-mono);
        font-size: 0.78rem;
    }

    .tree .chk {
        color: var(--ok);
        font-size: 0.78rem;
    }

    .tree .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        align-self: center;
    }

    .tree a.viewed .fn {
        text-decoration: line-through;
        text-decoration-color: var(--line);
    }

    .keys {
        font-size: 0.8rem;
        color: var(--muted);
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3px 10px;
    }

    kbd {
        font-family: var(--font-mono);
        font-size: 0.74rem;
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 0 5px;
        background: var(--surface);
        color: var(--fg);
    }

    /* Topic sections */
    .topic-head {
        display: grid;
        gap: 6px;
        padding-top: 18px;
        margin-top: 8px;
        border-top: 2px solid var(--fg);
    }

    .topic-head .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
    }

    .topic-head .idx {
        font-family: var(--font-mono);
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--accent);
    }

    .topic-head .sum {
        max-width: 78ch;
        color: var(--fg);
    }

    .topic-head .meta .viewed-box {
        margin-left: auto;
    }

    /* File chunk */
    .file {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        min-width: 0;
    }

    .file.focused {
        box-shadow: 0 0 0 2px var(--accent);
    }

    .fhead {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: calc(env(safe-area-inset-top, 0px) + var(--tb-h, 48px));
        z-index: 5;
        background: var(--surface);
        border-radius: 8px 8px 0 0;
    }

    .file.collapsed .fhead {
        border-bottom: 0;
        border-radius: 8px;
    }

    .fhead .tog {
        border: 0;
        padding: 0 4px;
        background: none;
        color: var(--muted);
    }

    .badge {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0 6px;
        border-radius: 4px;
        border: 1px solid currentColor;
    }

    .badge.added {
        color: var(--add-fg);
        background: var(--add-bg);
    }

    .badge.deleted {
        color: var(--del-fg);
        background: var(--del-bg);
    }

    .badge.renamed {
        color: var(--hl-fn);
    }

    .badge.binary {
        color: var(--muted);
    }

    .tag {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        text-transform: lowercase;
        padding: 0 6px;
        border-radius: 4px;
        border: 1px solid var(--line);
        color: var(--muted);
    }

    .path {
        font-family: var(--font-mono);
        font-size: 0.84rem;
        font-weight: 500;
        word-break: break-all;
        min-width: 0;
        flex: 1 1 220px;
    }

    .path .from {
        display: block;
        font-weight: 400;
        color: var(--muted);
        font-size: 0.76rem;
    }

    .viewed-box {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-size: 0.82rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 8px;
        cursor: pointer;
        user-select: none;
        background: var(--surface);
    }

    .viewed-box input {
        accent-color: var(--accent);
        margin: 0;
    }

    .is-viewed .viewed-box, .topic-head.is-viewed .viewed-box {
        background: var(--accent-soft);
        border-color: var(--accent);
    }

    .kebab {
        padding: 0 8px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .file.collapsed .fbody {
        display: none;
    }

    .fbody {
        min-width: 0;
    }

    .fnote {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 14px;
        background: var(--note-bg);
        border-bottom: 1px solid var(--line);
        font-size: 14px;
    }

    .fnote .lbl, .lnote-in .lbl {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .fthreads {
        padding: 10px 12px;
        display: grid;
        gap: 8px;
        border-bottom: 1px solid var(--line);
    }

    .fthreads > .fh {
        font-size: 0.78rem;
        color: var(--muted);
        font-weight: 600;
    }

    .binary {
        padding: 14px;
        color: var(--muted);
        font-size: 0.9rem;
    }

    .code-box {
        overflow-x: auto;
        min-width: 0;
    }

    /* Diff table (create-diff) */
    table.diff {
        border-collapse: collapse;
        width: 100%;
        font-family: var(--font-mono);
        font-size: 12.5px;
        line-height: 1.6;
        tab-size: 4;
    }

    table.diff.split {
        table-layout: fixed;
    }

    .diff col.cn {
        width: 52px;
    }

    .diff col.cs {
        width: 18px;
    }

    .diff > tbody > tr > td {
        padding: 0;
        vertical-align: top;
    }

    .diff > tbody > tr > td.n {
        width: 52px;
        min-width: 52px;
        padding-inline: 6px 8px;
        text-align: right;
        color: var(--muted);
        user-select: none;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }

    .diff > tbody > tr > td.n[data-line] {
        cursor: pointer;
    }

    .diff > tbody > tr > td.n[data-line]:hover {
        color: var(--accent);
    }

    .diff > tbody > tr > td.n:focus-visible {
        outline-offset: -2px;
    }

    .diff > tbody > tr > td.s {
        width: 18px;
        text-align: center;
        user-select: none;
    }

    .diff > tbody > tr > td.c {
        position: relative;
        white-space: pre;
        padding-left: 12px;
        padding-right: 16px;
        color: var(--ctx-fg);
    }

    .diff.split > tbody > tr > td.c {
        white-space: pre-wrap;
        word-break: break-all;
    }

    .diff > tbody > tr.add > td.c, .diff > tbody > tr > td.c.add {
        background: var(--add-bg);
        color: var(--fg);
    }

    .diff > tbody > tr.add > td.s, .diff > tbody > tr.add > td.n {
        background: var(--add-bg);
        color: var(--add-fg);
    }

    .diff > tbody > tr.del > td.c, .diff > tbody > tr > td.c.del {
        background: var(--del-bg);
        color: var(--fg);
    }

    .diff > tbody > tr.del > td.s, .diff > tbody > tr.del > td.n {
        background: var(--del-bg);
        color: var(--del-fg);
    }

    .diff > tbody > tr > td.n.add {
        background: var(--add-bg);
        color: var(--add-fg);
    }

    .diff > tbody > tr > td.n.del {
        background: var(--del-bg);
        color: var(--del-fg);
    }

    .diff > tbody > tr > td.empty {
        background: var(--gap-bg);
    }

    .diff > tbody > tr.sel > td {
        background-image: linear-gradient(var(--sel), var(--sel));
    }

    .diff > tbody > tr.sel > td.n {
        box-shadow: inset 3px 0 0 var(--accent);
    }

    /* GitHub-style "+" on the code line, shown on hover or focus */
    .plus-btn {
        position: absolute;
        left: -10px;
        top: 0;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: var(--accent-emphasis);
        color: var(--fg-on-emphasis);
        font: 600 15px/20px var(--font-body);
        text-align: center;
        opacity: 0;
        transform: scale(0.85);
        transition: opacity 0.1s, transform 0.1s;
        z-index: 3;
        user-select: none;
    }

    .diff.unified tr.ln:hover .plus-btn, .diff.unified tr.ln:focus-within .plus-btn,
    .diff.split > tbody > tr > td.c:hover .plus-btn, .diff.split tr.ln:focus-within .plus-btn, .plus-btn:focus-visible {
        opacity: 1;
        transform: none;
    }

    /* Touch screens have no hover: the line number menu has "Comment on line N" */
    @media (hover: none) {
        .plus-btn {
            display: none;
        }
    }

    .diff > tbody > tr.note > td, .diff > tbody > tr.gap > td, .diff > tbody > tr.other > td, .diff > tbody > tr.lnote > td, .diff > tbody > tr.trow > td, .diff > tbody > tr.crow > td {
        font-family: var(--font-body);
        white-space: normal;
    }

    /* Rows that hold text stick to the left edge of the scroll box, so they stay readable */
    .stick {
        position: sticky;
        left: 0;
        max-width: min(900px, calc(var(--main-w, 100vw) - 24px));
    }

    .diff > tbody > tr.note > td {
        background: var(--note-bg);
        font-size: 14px;
        line-height: 1.55;
        color: var(--fg);
        border-top: 1px solid var(--line);
    }

    .note-in {
        padding: 10px 14px;
    }

    .note-in .hl {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--muted);
        margin-right: 8px;
    }

    .note-in .pill, .note-in .chip {
        margin-right: 6px;
        vertical-align: 1px;
    }

    .note-text {
        margin-top: 2px;
        max-width: 80ch;
    }

    .diff > tbody > tr.gap > td {
        background: var(--hunk-bg);
        color: var(--muted);
        font-size: 12px;
    }

    .gap-ctl {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 2px 8px;
    }

    .gap-ctl button {
        font-size: 0.74rem;
        padding: 0 8px;
        white-space: nowrap;
    }

    .gap-ctl .scope {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--font-mono);
        margin-left: 6px;
    }

    .gap-ctl .hidden-count {
        white-space: nowrap;
    }

    .diff > tbody > tr.other > td {
        background: var(--gap-bg);
        font-size: 0.8rem;
        border-top: 1px dashed var(--line);
        border-bottom: 1px dashed var(--line);
    }

    .other-in {
        padding: 4px 12px;
        color: var(--muted);
    }

    .other-in a {
        font-weight: 500;
    }

    .diff > tbody > tr.lnote > td {
        padding: 4px 10px 6px;
        background: var(--surface);
    }

    .lnote-in {
        display: grid;
        grid-template-columns: auto auto minmax(0, 1fr) auto;
        gap: 4px 8px;
        align-items: start;
        border-left: 3px solid var(--accent);
        background: var(--accent-soft);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 13.5px;
        line-height: 1.5;
    }

    .lnote-in .lbl {
        padding-top: 2px;
    }

    .diff > tbody > tr.trow > td, .diff > tbody > tr.crow > td {
        padding: 8px 10px;
        background: var(--bg);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        font-size: 14px;
    }

    .tcell {
        display: grid;
        gap: 8px;
    }

    /* Thread card (GitHub look) */
    .thread {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        min-width: 0;
        overflow: hidden;
        font-family: var(--font-body);
        font-size: 14px;
        line-height: 1.5;
        white-space: normal;
    }

    .thread.finding {
        border-left: 4px solid var(--c);
    }

    .th-head {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        align-items: center;
        padding: 6px 12px;
        background: var(--note-bg);
        border-bottom: 1px solid var(--line);
        font-size: 0.8rem;
        color: var(--muted);
    }

    .thread.collapsed .th-head {
        border-bottom: 0;
    }

    .th-head .th-title {
        color: var(--fg);
        font-weight: 600;
    }

    .th-head .excerpt {
        min-width: 0;
        flex: 1 1 160px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .th-head a {
        font-size: 0.78rem;
    }

    .th-head .push {
        margin-left: auto;
    }

    .th-loc {
        padding: 6px 12px 0;
        font-family: var(--font-mono);
        font-size: 0.76rem;
        color: var(--muted);
        word-break: break-all;
    }

    .snip {
        margin: 6px 12px 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow-x: auto;
        background: var(--code-bg);
    }

    .snip table {
        border-collapse: collapse;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.55;
        width: 100%;
    }

    .snip td.n {
        width: 44px;
        text-align: right;
        padding: 0 8px 0 4px;
        color: var(--muted);
        user-select: none;
    }

    .snip td.c {
        white-space: pre;
        padding-right: 10px;
    }

    .snip tr.on td {
        background: var(--sel);
    }

    .cm {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        gap: 4px 10px;
        padding: 10px 12px;
    }

    .cm + .cm {
        border-top: 1px solid var(--line);
    }

    .cm.editing {
        display: block;
    }

    .av {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        object-fit: cover;
    }

    .av.blank {
        display: inline-block;
        background: var(--gap-bg);
    }

    .av.gh-av {
        display: inline-grid;
        place-items: center;
        background: var(--gh-bg);
        color: var(--gh);
        font-size: 0.72rem;
        font-weight: 600;
    }

    .cm-main {
        min-width: 0;
        display: grid;
        gap: 4px;
    }

    .cm-head {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 8px;
        align-items: center;
        font-size: 0.82rem;
        color: var(--muted);
        min-height: 24px;
    }

    .cm-head .nm {
        color: var(--fg);
        font-weight: 600;
    }

    .cm-actions {
        display: inline-flex;
        gap: 4px;
        margin-left: auto;
    }

    .confirm {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-left: auto;
        color: var(--fg);
        font-weight: 500;
    }

    .confirm .danger {
        background: var(--danger-emphasis);
        border-color: var(--danger-emphasis);
        color: var(--fg-on-emphasis);
    }

    .fd-head {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        align-items: center;
    }

    .fd-head .cat {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 6px;
    }

    .fd-title {
        flex-basis: 100%;
        font-size: 0.95rem;
    }

    /* Markdown */
    .md {
        overflow-wrap: anywhere;
        display: grid;
        gap: 6px;
    }

    .md p {
        margin: 0;
    }

    .md ul, .md ol {
        margin: 0;
        padding-left: 22px;
    }

    .md blockquote {
        margin: 0;
        padding: 0 10px;
        border-left: 3px solid var(--line);
        color: var(--muted);
        display: grid;
        gap: 6px;
    }

    .md code {
        background: var(--gap-bg);
        border-radius: 4px;
        padding: 0 4px;
    }

    .md pre {
        margin: 0;
        padding: 8px 10px;
        background: var(--code-bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow-x: auto;
        font-family: var(--font-mono);
        font-size: 12.5px;
        line-height: 1.5;
    }

    .md pre code {
        background: none;
        padding: 0;
        font-size: inherit;
    }

    .md .md-h {
        font-weight: 600;
    }

    .md .md-label {
        font-size: 0.74rem;
        color: var(--muted);
    }

    /* Suggested change */
    .sugg {
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        min-width: 0;
    }

    .sugg-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 3px 8px;
        background: var(--note-bg);
        border-bottom: 1px solid var(--line);
        font-size: 0.76rem;
        color: var(--muted);
        font-weight: 600;
    }

    .sugg-box {
        overflow-x: auto;
    }

    .sugg table {
        border-collapse: collapse;
        width: 100%;
        font-family: var(--font-mono);
        font-size: 12.5px;
        line-height: 1.55;
    }

    .sugg td.s {
        width: 20px;
        text-align: center;
        user-select: none;
    }

    .sugg td.c {
        white-space: pre;
        padding-right: 10px;
    }

    .sugg tr.del td {
        background: var(--del-bg);
    }

    .sugg tr.del td.s {
        color: var(--del-fg);
    }

    .sugg tr.add td {
        background: var(--add-bg);
    }

    .sugg tr.add td.s {
        color: var(--add-fg);
    }

    .th-foot {
        display: grid;
        gap: 8px;
        padding: 8px 12px 10px;
        border-top: 1px solid var(--line);
        background: var(--surface);
    }

    .reply-box {
        text-align: left;
        width: 100%;
        color: var(--muted);
        background: var(--bg);
        padding: 6px 10px;
        cursor: text;
    }

    .th-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
    }

    .claude-btn {

        gap: 6px;
        align-items: center;
    }

    .claude-btn .claude-mark {
        width: 14px;
        height: 14px;
    }

    .claude-btn .claude-mark::after {

    .outdated-box {
        padding: 10px 12px;

        background: var(--bg);

    .outdated-box h4 {

    /* Composer */

    }

    .cp-target {

        font-size: 0.78rem;
        color: var(--muted);
        font-weight: 600;
    }

    .cp-tabs {

        align-items: center;

    .composer textarea {

        font-size: 14px;

        color: var(--fg);

    }

    .composer textarea:focus-visible {
        outline: 2px solid var(--accent);

    }

    .cp-preview {
        padding: 8px 10px;
        min-height: 92px;
    }

    .cp-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 8px;
        align-items: center;
        justify-content: space-between;
        padding: 6px 8px;
        border-top: 1px solid var(--line);
    }

    .cp-foot .hint {
        font-size: 0.76rem;
        color: var(--muted);
    }

    .cp-foot .btns {
        display: inline-flex;

    .menu {

    .hover-card pre {

        white-space: pre-wrap;
        word-break: break-word;
        background: var(--code-bg);
        max-height: 220px;
        overflow: auto;
    }

    .hover-card .doc {
        padding: 8px 12px;
        white-space: pre-wrap;

        overflow: auto;
        border-top: 1px solid var(--line);

    .hover-card .foot {
        padding: 5px 12px;
        color: var(--muted);

    .peek {
        position: absolute;
        z-index: 36;

    .peek .ph {

        flex-wrap: wrap;
        gap: 8px;

        padding: 8px 12px;

    .peek .ph .p {
        font-family: var(--font-mono);
        font-weight: 500;
        flex: 1 1 220px;

    .peek .pb {
        max-height: 320px;
        overflow: auto;

    .peek table {
        border-collapse: collapse;

        line-height: 1.6;

    .peek td.n {
        width: 52px;
        text-align: right;
        padding-inline: 6px 10px;
        color: var(--muted);
        user-select: none;
    }

    .peek td.c {
        white-space: pre;
        padding-right: 12px;
    }

    .peek pre.sig {
        margin: 0;
        padding: 8px 12px;
        font-family: var(--font-mono);
        font-size: 12.5px;
        white-space: pre-wrap;
    }

    .peek tr.first td {
        background: var(--sel);
    }

    .usages {
        list-style: none;
        margin: 0;
        padding: 4px 0;
    }

    .usages button {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 1px;
        width: 100%;
        text-align: left;
        border: 0;
        border-radius: 0;
        background: none;
        padding: 5px 12px;
    }

    .usages button:hover, .usages button:focus-visible {
        background: var(--accent-soft);
    }

    .usages .where {
        font-family: var(--font-mono);
        font-size: 0.76rem;
        color: var(--muted);
    }

    .usages .code {
        font-family: var(--font-mono);
        font-size: 12.5px;
        white-space: pre;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .flash, tr.flash td {
        animation: flash 1.4s ease-out;
    }

    @keyframes flash {
        from {
            background-color: var(--sel);
            box-shadow: 0 0 0 2px var(--accent);
        }
    }

    /* Finish review: popover on desktop, sheet on phones */
    .finish {
        position: fixed;
        z-index: 45;
        top: calc(env(safe-area-inset-top, 0px) + var(--tb-h, 48px) + 6px);
        right: max(16px, env(safe-area-inset-right, 0px));
        width: min(540px, calc(100vw - 32px));
        max-height: calc(100vh - var(--tb-h, 48px) - 32px - env(safe-area-inset-top, 0px));
        overflow: auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        display: grid;
        gap: 12px;
        padding: 14px 16px 16px;
    }

    .finish[hidden] {
        display: none;
    }

    @media (max-width: 599px) {
        .finish {
            left: 0;
            right: 0;
            bottom: 0;
            top: auto;
            width: 100%;
            max-height: 88vh;
            border-radius: 14px 14px 0 0;
            padding-left: max(16px, env(safe-area-inset-left, 0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px));
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));

    .fin-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
    }

    .fin-head h2 {
        font-size: 1.05rem;
    }

    .fin-head button {
        border: 0;
        background: none;
        font-size: 1rem;
        padding: 2px 6px;
    }

    fieldset {
        border: 0;
        margin: 0;
        padding: 0;
        min-width: 0;
    }

    .opts {
        display: grid;
        gap: 6px;
    }

    .opt {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 2px 10px;
        align-items: start;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        cursor: pointer;
    }

    .opt:has(input:checked) {
        border-color: var(--accent);
        background: var(--accent-soft);
    }

    .opt.off {

    }

    .opt input {
        margin-top: 4px;
        accent-color: var(--accent);
    }

    .opt small {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
    }

    .events {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        font-size: 0.88rem;
    }

    .events label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        cursor: pointer;
    }

    .fin-body textarea {
        font: inherit;
        font-size: 14px;
        width: 100%;
        min-height: 64px;
        resize: vertical;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
    }

    .fin-body label {
        font-size: 0.82rem;
        font-weight: 600;
        display: grid;
        gap: 4px;
    }

    .fin-items {
        display: grid;
        gap: 10px;
    }

    .fin-items h3 {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        font-weight: 600;
    }

    .fin-items ul {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
        display: grid;
        gap: 4px;
    }

    .fin-items li label {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 0 8px;
        align-items: start;
        font-size: 0.86rem;
        cursor: pointer;
        padding: 3px 4px;
        border-radius: 5px;
    }

    .fin-items li label:hover {
        background: var(--note-bg);
    }

    .fin-items input {
        margin-top: 4px;
        accent-color: var(--accent);
    }

    .fin-items .what {
        font-family: var(--font-mono);
        font-size: 0.74rem;
        color: var(--muted);

    }

    .fin-items .txt {

        overflow: hidden;

    }

    .fin-channel {

    }

    .fin-foot {

        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
        align-items: center;

    /* Notice card and toasts */
    .notice-card {
        position: fixed;
        z-index: 46;
        right: max(16px, env(safe-area-inset-right, 0px));
        bottom: calc(env(safe-area-inset-bottom, 0px) + 64px);
        width: min(440px, calc(100vw - 32px));

    .toast {

    .toast.error {

    .about {

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {

</style>

<div class="shell">
    <div class="layout">
        <aside class="side" aria-label="Review navigator">
            <button type="button" class="contents-toggle" data-act="contents-toggle" aria-expanded="false"
                    aria-controls="side-body">Contents <span aria-hidden="true">▾</span></button>
            <div class="side-body" id="side-body"></div>
        </aside>

        <main id="main">
            <div class="tbar-wrap" id="tbar-wrap">
                <div class="tbar" role="toolbar" aria-label="Review controls">
                    <div class="seg" role="group" aria-label="View">
                        <button type="button" data-act="view" data-v="topic" aria-pressed="true">By topic</button>
                        <button type="button" data-act="view" data-v="file" aria-pressed="false">By file</button>
                    </div>
                    <div class="seg" role="group" aria-label="Diff layout">
                        <button type="button" data-act="mode" data-m="unified" aria-pressed="true">Unified</button>
                        <button type="button" data-act="mode" data-m="split" aria-pressed="false">Split</button>
                    </div>
                    <button type="button" data-act="hide-resolved" aria-pressed="false">Hide resolved</button>
                    <button type="button" data-act="only-new" aria-pressed="false" hidden>Only new</button>
                    <span class="spacer"></span>
                    <button type="button" class="primary" id="finish-btn" data-act="finish" aria-haspopup="dialog"
                            aria-expanded="false" aria-controls="finish">Finish review <span class="count">(0)</span>
                    </button>
                </div>
            </div>

            <header class="intro">
                <div class="eyebrow" id="eyebrow"></div>
                <h1 id="heading"></h1>
                <p class="lede" id="lede"></p>
                <div class="prwrap" id="prbox" hidden></div>
                <p class="newnote" id="newnote" hidden></p>
            </header>

            <section class="walk" id="walkthrough" aria-labelledby="walk-title">
                <h3 id="walk-title">Walkthrough</h3>
                <div id="w-static" class="stack"></div>
                <div id="w-dyn" class="stack"></div>
            </section>

            <div id="content" class="stack"></div>

            <footer class="about">
                <p><b>About this page.</b> A review of one branch, grouped in topics. Claude explains each change and
                    marks the problems it found. Comment on a line with the <b>+</b> button or the line number, reply,
                    resolve, then use <b>Finish review</b> to send the comments to Claude or to post them on GitHub.</p>
            </footer>
        </main>
    </div>
</div>
<div id="menu" class="menu" role="menu" hidden></div>
<div id="hover-card" class="hover-card" hidden></div>
<div id="peek" class="peek" hidden></div>
<div id="finish" class="finish" role="dialog" aria-modal="false" aria-labelledby="finish-title" hidden></div>
<div id="notice" class="notice-card" role="status" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<dialog id="gh-news" class="gh-news" aria-labelledby="gh-news-title"></dialog>

<script type="application/json" id="review-data">{{DATA}}</script>
<script>
    (() => {
        "use strict";
        const DATA = JSON.parse(document.getElementById("review-data").textContent);
        const GH = `https://github.com/${DATA.repo}`;
        const EXPAND_STEP = 10;
        const SMALL_GAP = 30;
        const AROUND = 2;
        const SEEN_CAP = 5000;
        const FIND_WINDOW = 200;
        const PAYLOAD_BYTES = 3900;
        const PAYLOAD_ITEMS = 12;
        const ITEM_TEXT = 200;
        const WRITE_GROUP = 5;
        const ANCHOR_REFRESH = 20000;
        const SEVERITIES = ["critical", "major", "minor", "nit"];
        const SEVERITY_LABEL = {critical: "Critical", major: "Major", minor: "Minor", nit: "Nit"};
        // Only a conversation beside the page. The other answers can go to a new chat that does not have the code,
        // and can leave the page before the database writes end.
        const ROOM_READY = ["available"];
        const SYNC_COMMAND = "/code-review-diff sync";
        const GITHUB_URL = /^https:\/\/github\.com\//;
        const MOD = /Mac|iPhone|iPad/.test(navigator.platform || "") ? "⌘" : "Ctrl";
        const files = DATA.files || [];
        const groups = DATA.groups || [];
        const blobs = DATA.blobs || {};
        const github = DATA.github || null;
        const $ = (id) => document.getElementById(id);

        const store = {
            get(key, fallback) {
                try {
                    const v = localStorage.getItem(key);
                    return v === null ? fallback : JSON.parse(v);
                } catch {
                    return fallback;
                }
            },
            set(key, value) {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                } catch {
                    // Storage can be off (private window, blocked site data): the page works without it
                }
            },
        };
        const KEY = (name) => `${name}:${DATA.repo}:${DATA.branch}`;
        const asList = (v) => (Array.isArray(v) ? v.filter((x) => typeof x === "string") : []);

        const ESC = {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"};
        const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ESC[c]);
        const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
        const basename = (p) => String(p).split("/").pop();
        const short = (sha) => String(sha || "").slice(0, 9);
        const encodePath = (p) => String(p).split("/").map(encodeURIComponent).join("/");
        const nowIso = () => new Date().toISOString();

        // ---- the change, derived once from DATA ----
        files.forEach((f, fi) => {
            f.fi = fi;
            f.hunks = Array.isArray(f.hunks) ? f.hunks : [];
            f.hunks.forEach((h, hi) => {
                let oc = 0, nc = 0, adds = 0, dels = 0;
                for (const [kind] of h.lines) {
                    if (kind !== "add") oc++;
                    if (kind !== "del") nc++;
                    if (kind === "add") adds++;
                    if (kind === "del") dels++;
                }
                // A side with no lines sits after line N of that side (git writes "+N,0")
                Object.assign(h, {
                    hi, oldCount: oc, newCount: nc, adds, dels,
                    oldFirst: oc ? h.oldStart : h.oldStart + 1, oldLast: oc ? h.oldStart + oc - 1 : h.oldStart,
                    newFirst: nc ? h.newStart : h.newStart + 1, newLast: nc ? h.newStart + nc - 1 : h.newStart,
                    unit: `${f.path}:${h.hash}`,
                });
                h.lineNotes = h.lineNotes || {};
            });
            f.units = f.hunks.length ? f.hunks.map((h) => h.unit) : [`file:${f.path}:${f.status}`];
        });
        const fileByPath = new Map(files.map((f) => [f.path, f]));
        const groupById = new Map(groups.map((g, gi) => [g.id, Object.assign(g, {gi})]));
        const allUnits = files.flatMap((f) => f.units);
        const prevSeen = new Set(asList(store.get(KEY("seen"), [])));
        const newUnits = new Set(prevSeen.size ? allUnits.filter((u) => !prevSeen.has(u)) : []);

        // Topic plan: files of each topic in display order, then hunk-less files without a topic
        const topicPlan = groups.map((g) => ({g, fis: []}));
        const otherFis = [];
        (() => {
            const add = (gid, fi) => {
                const plan = topicPlan[groupById.get(gid).gi];
                if (!plan.fis.includes(fi)) plan.fis.push(fi);
            };
            for (const g of groups) {
                for (const fi of g.files || []) {
                    const f = files[fi];
                    if (f && (f.hunks.some((h) => h.group === g.id) || (!f.hunks.length && f.group === g.id))) add(g.id, fi);
                }
            }
            for (const f of files) {
                for (const h of f.hunks) if (groupById.has(h.group)) add(h.group, f.fi);
                const homeless = f.hunks.length ? f.hunks.some((h) => !groupById.has(h.group)) : !groupById.has(f.group);
                if (homeless) otherFis.push(f.fi);
                else if (!f.hunks.length) add(f.group, f.fi);
            }
        })();

        const blobLines = (id) => (id && Array.isArray(blobs[id]) ? blobs[id] : null);
        const sideBlob = (f, side) => blobLines(side === "LEFT" ? f.oldBlob : f.newBlob);

        function lineText(f, side, n) {
            const b = sideBlob(f, side);
            if (b) return b[n - 1] ?? null;
            for (const h of f.hunks) {
                let o = h.oldStart, w = h.newStart;
                for (const [kind, text] of h.lines) {
                    if (side === "LEFT" && kind !== "add" && o === n) return text;
                    if (side === "RIGHT" && kind !== "del" && w === n) return text;
                    if (kind !== "add") o++;
                    if (kind !== "del") w++;
                }
            }
            return null;
        }

        function hunkForLine(f, side, n) {
            let best = null, bestDistance = Infinity;
            for (const h of f.hunks) {
                const [first, last, count] = side === "LEFT" ? [h.oldFirst, h.oldLast, h.oldCount] : [h.newFirst, h.newLast, h.newCount];
                const distance = count && n >= first && n <= last ? 0 : n < first ? first - n : n - last;
                if (distance < bestDistance) {
                    best = h;
                    bestDistance = distance;
                }
            }
            return best;
        }

        // ---- state ----
        const prefs = store.get(KEY("review-prefs"), {}) || {};
        const state = {
            view: prefs.view === "file" ? "file" : "topic",
            mode: prefs.mode === "split" ? "split" : "unified",
            hideResolved: prefs.hideResolved === true,
            onlyNew: false,
            viewed: new Set(asList(store.get(KEY("viewed"), []))),
            open: new Set(),
            closed: new Set(),
            expanded: {},
            reveals: {},
            showResolved: new Set(),
            details: new Set(),
            composers: new Map(),
            savedDrafts: store.get(KEY("review-drafts"), {}) || {},
            unplaced: new Map(),
            selected: null,
            confirmDelete: null,
            busy: new Set(),
            menu: null,
            contentsOpen: false,
            dbState: "loading",
            db: null,
            user: null,
            room: null,
            comments: null,
            me: null,
            canWrite: null,
            canComment: false,
            profiles: {},
            docs: [],
            batches: [],
            ghdocs: new Map(),
            loaded: {comments: false, batches: false, ghthreads: false},
            channel: null,
            ghWaiting: null,
            ghRecovered: false,
            ghNews: null,
            threads: [],
            lineIndex: new Map(),
            fileIndex: new Map(),
            outdatedIndex: new Map(),
            general: [],
            lost: [],
            ghconv: [],
            chunks: [],
            chunkById: new Map(),
            openCount: new Map(),
            forced: new Map(),
            composerAt: new Map(),
            shown: new Map(),
            finish: {open: false, target: "claude", event: "COMMENT", body: "", sel: new Map(), busy: false, anchor: null, anchorTimer: null},
        };
        const narrow = matchMedia("(max-width: 899px)");
        const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
        const effectiveMode = () => (narrow.matches ? "unified" : state.mode);
        const savePrefs = () => store.set(KEY("review-prefs"), {view: state.view, mode: state.mode, hideResolved: state.hideResolved});

        // ---- time ----
        function ago(iso) {
            const t = Date.parse(iso);
            if (!t) return "";
            const s = Math.round((Date.now() - t) / 1000);
            if (s < 45) return "just now";
            const m = Math.round(s / 60);
            if (m < 60) return `${m} min ago`;
            const h = Math.round(m / 60);
            if (h < 24) return `${h} h ago`;
            const d = Math.round(h / 24);
            if (d < 30) return `${plural(d, "day")} ago`;
            return new Date(t).toLocaleDateString(undefined, {year: "numeric", month: "short", day: "numeric"});
        }

        const fullDate = (iso) => (Date.parse(iso) ? new Date(iso).toLocaleString(undefined, {dateStyle: "medium", timeStyle: "short"}) : "");

        // ---- markdown, safe subset: HTML is escaped first, then a few marks become tags ----
        function md(src, ctx) {
            const lines = String(src ?? "").replace(/\u0000/g, "").replace(/\r\n?/g, "\n").split("\n");
            let out = "", para = [], i = 0;
            const flush = () => {
                if (para.length) out += `<p>${para.map(inline).join("<br>")}</p>`;
                para = [];
            };
            while (i < lines.length) {
                const line = lines[i];
                const fence = /^\s*```\s*([\w+.-]*)\s*$/.exec(line);
                if (fence) {
                    flush();
                    const body = [];
                    i++;
                    while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) body.push(lines[i++]);
                    i++;
                    if (fence[1] === "suggestion") out += ctx && ctx.inLine ? suggestionBlock(body, ctx.current) : `<p class="md-label">Suggested change</p><pre><code>${esc(body.join("\n"))}</code></pre>`;
                    else out += `<pre><code>${esc(body.join("\n"))}</code></pre>`;
                    continue;
                }
                if (!line.trim()) {
                    flush();
                    i++;
                    continue;
                }
                const heading = /^\s{0,3}#{1,6}\s+(.*)$/.exec(line);
                if (heading) {
                    flush();
                    out += `<p class="md-h">${inline(heading[1].replace(/\s+#+\s*$/, ""))}</p>`;
                    i++;
                    continue;
                }
                if (/^\s{0,3}>/.test(line)) {
                    flush();
                    const quote = [];
                    while (i < lines.length && /^\s{0,3}>/.test(lines[i])) quote.push(lines[i++].replace(/^\s{0,3}>\s?/, ""));
                    // A GitHub alert ("> [!NOTE]") starts with its label in bold, as GitHub shows it
                    const alert = /^\[!(note|tip|important|warning|caution)\]\s*$/i.exec(quote[0]);
                    if (alert) quote[0] = `**${alert[1][0].toUpperCase()}${alert[1].slice(1).toLowerCase()}**`;
                    out += `<blockquote>${md(quote.join("\n"), ctx)}</blockquote>`;
                    continue;
                }
                const bullet = /^\s{0,3}[-*+]\s+/, number = /^\s{0,3}\d{1,9}[.)]\s+/;
                if (bullet.test(line) || number.test(line)) {
                    flush();
                    const ordered = number.test(line);
                    const marker = ordered ? number : bullet;
                    const items = [];
                    while (i < lines.length && lines[i].trim()) {
                        if (marker.test(lines[i])) items.push(lines[i].replace(marker, ""));
                        else if (/^\s+\S/.test(lines[i]) && items.length) items[items.length - 1] += `\n${lines[i].trim()}`;
                        else break;
                        i++;
                    }
                    out += `<${ordered ? "ol" : "ul"}>${items.map((item) => `<li>${item.split("\n").map(inline).join("<br>")}</li>`).join("")}</${ordered ? "ol" : "ul"}>`;
                    continue;
                }
                para.push(line);
                i++;
            }
            flush();
            return out;
        }

        // Each render builds the thread cards again: keep the HTML of each body, a long one costs time
        const mdCache = new Map();

        function mdOnce(src, ctx) {
            const key = `${ctx.inLine ? 1 : 0}\u0001${ctx.current ? ctx.current.join("\n") : ""}\u0001${src}`;
            let html = mdCache.get(key);
            if (html === undefined) {
                if (mdCache.size >= 1000) mdCache.clear();
                mdCache.set(key, (html = md(src, ctx)));
            }
            return html;
        }

        function inline(text) {
            // Code spans first, so nothing inside them becomes markup. A link label can still hold one: [`name`](https://…)
            const slots = [];
            return marks(text.replace(/`([^`]+)`/g, (_, code) => `\u0000${slots.push(`<code>${esc(code)}</code>`) - 1}\u0000`), slots);
        }

        function marks(text, slots) {
            const keep = (html) => `\u0000${slots.push(html) - 1}\u0000`;
            const link = (url, label) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`;
            let t = esc(text);
            // No "[" or "]" inside the label or the URL: each try then stops at the next "[", so a long text with many
            // unclosed links does not make this regex slow
            t = t.replace(/\[([^[\]]+)\]\((https?:\/\/[^\s)[\]\u0000]+)\)/g, (_, label, url) => keep(link(url, emphasis(label))));
            t = t.replace(/https?:\/\/[^\s<\u0000]+/g, (url) => {
                const trail = /[.,;:!?)]+$/.exec(url)?.[0] || "";
                const clean = trail ? url.slice(0, -trail.length) : url;
                return keep(link(clean, clean)) + trail;
            });
            t = emphasis(t);
            const restore = (s) => s.replace(/\u0000(\d+)\u0000/g, (_, n) => restore(slots[Number(n)]));
            return restore(t);
        }

        function emphasis(t) {
            return t
                .replace(/\*\*(?=\S)([^*]*?\S)\*\*/g, "<b>$1</b>")
                .replace(/~~(?=\S)([^~]*?\S)~~/g, "<s>$1</s>")
                .replace(/(^|[^\w*])\*(?=\S)([^*]*?\S)\*(?![\w*])/g, "$1<i>$2</i>")
                .replace(/(^|[^\w])_(?=\S)([^_]*?\S)_(?!\w)/g, "$1<i>$2</i>");
        }

        function suggestionBlock(newLines, oldLines) {
            const rows = (oldLines || []).map((l) => `<tr class="del"><td class="s">−</td><td class="c">${esc(l) || " "}</td></tr>`).join("")
                + newLines.map((l) => `<tr class="add"><td class="s">+</td><td class="c">${esc(l) || " "}</td></tr>`).join("");
            return `<div class="sugg"><div class="sugg-head"><span>Suggested change</span><button type="button" class="mini" data-act="copy" data-copy="${esc(newLines.join("\n"))}">Copy</button></div><div class="sugg-box"><table>${rows}</table></div></div>`;
        }

        // ---- syntax: Pygments spans from DATA.syntax, plus pyright tokens for hover and peek ----
        const TOKEN_KIND = [["(function)", "fn"], ["(method)", "fn"], ["(class)", "cls"]];

        function renderCode(text, blobId, line) {
            const syntax = (blobId && DATA.syntax && DATA.syntax[blobId] && DATA.syntax[blobId][line]) || [];
            const tokens = (blobId && DATA.tokens && DATA.tokens[blobId] && DATA.tokens[blobId][line]) || [];
            if (!syntax.length && !tokens.length) return esc(text) || " ";
            const kinds = new Array(text.length).fill("");
            for (const [col, len, kind] of syntax) {
                if (!/^[a-z]$/.test(kind)) continue;
                for (let i = Math.max(0, col); i < Math.min(col + len, text.length); i++) kinds[i] = kind;
            }
            const owner = new Array(text.length).fill(-1);
            tokens.forEach(([col, len], ti) => {
                if (!/^\w+$/.test(text.slice(col, col + len))) return;
                for (let i = col; i < col + len; i++) if (owner[i] === -1) owner[i] = ti;
            });
            let out = "", i = 0;
            while (i < text.length) {
                const kind = kinds[i], ti = owner[i];
                let j = i + 1;
                while (j < text.length && kinds[j] === kind && owner[j] === ti) j++;
                const piece = esc(text.slice(i, j));
                if (ti >= 0) {
                    const [, , h, d, r] = tokens[ti];
                    const hover = h >= 0 ? DATA.hovers[h] || "" : "";
                    const tk = (TOKEN_KIND.find(([prefix]) => hover.startsWith(prefix)) || [])[1] || "";
                    const attrs = `${h >= 0 ? ` data-h="${h}"` : ""}${d >= 0 ? ` data-d="${d}"` : ""}${r >= 0 ? ` data-r="${r}"` : ""}`;
                    // The Pygments color wins: "str" stays a builtin, though pyright calls it a class
                    out += `<span class="tok${kind ? ` hl-${kind}` : tk ? ` ${tk}` : ""}"${attrs}>${piece}</span>`;
                } else out += kind ? `<span class="hl-${kind}">${piece}</span>` : piece;
                i = j;
            }
            return out || " ";
        }

        const DEFINITION = /^(\s*)(?:(?:export\s+)?(?:async\s+)?(?:def|class|function)\b)/;

        // Like GitHub's hunk header: the innermost def/class the first line below the gap sits in
        function enclosingDefinition(textAt, line, total) {
            let i = line;
            while (i <= total && !(textAt(i) || "").trim()) i++;
            if (i > total) return "";
            const indent = (textAt(i) || "").match(/^\s*/)[0].length;
            for (let j = Math.min(line - 1, total); j >= 1; j--) {
                const text = textAt(j) || "";
                const m = DEFINITION.exec(text);
                if (m && m[1].length < indent) return text.trim();
            }
            return "";
        }

        // ---- chunks: one file inside one topic (By topic) or one whole file (By file) ----
        function buildChunks() {
            const list = [];
            if (state.view === "file") {
                for (const f of files) list.push({id: `ch-all-${f.fi}`, fi: f.fi, gid: "", hunks: new Set(f.hunks.map((h) => h.hi))});
            } else {
                for (const plan of topicPlan) {
                    for (const fi of plan.fis) {
                        list.push({id: `ch-${plan.g.id}-${fi}`, fi, gid: plan.g.id, hunks: new Set(files[fi].hunks.filter((h) => h.group === plan.g.id).map((h) => h.hi))});
                    }
                }
                for (const fi of otherFis) {
                    list.push({id: `ch-other-${fi}`, fi, gid: "", hunks: new Set(files[fi].hunks.filter((h) => !groupById.has(h.group)).map((h) => h.hi))});
                }
            }
            for (const ch of list) {
                const f = files[ch.fi];
                ch.units = f.hunks.length ? [...ch.hunks].map((hi) => f.hunks[hi].unit) : f.units;
                ch.isNew = ch.units.some((u) => newUnits.has(u));
            }
            state.chunks = list;
            state.chunkById = new Map(list.map((ch) => [ch.id, ch]));
        }

        const chunkHidden = (ch) => state.onlyNew && !ch.isNew;
        const shownHunks = (ch) => (state.onlyNew ? new Set([...ch.hunks].filter((hi) => newUnits.has(files[ch.fi].hunks[hi].unit))) : ch.hunks);

        function chunkIdForLine(fi, side, line) {
            if (state.view === "file") return `ch-all-${fi}`;
            const f = files[fi];
            const h = hunkForLine(f, side, line);
            const gid = h ? h.group : f.group;
            return groupById.has(gid) && !(h === null && otherFis.includes(fi)) ? `ch-${gid}-${fi}` : `ch-other-${fi}`;
        }

        const firstChunkId = (fi) => state.chunks.find((ch) => ch.fi === fi)?.id || null;

        // ---- threads: db roots and GitHub threads, placed on the lines of this build ----
        function validDoc(d) {
            if (!d || d.v !== 1 || typeof d.body !== "string" || typeof d.author !== "string" || !d.author) return false;
            if (typeof d.replyTo === "string") return d.replyTo.length > 0;
            if (d.kind !== "comment" && d.kind !== "finding") return false;
            const a = d.anchor;
            if (!a || typeof a !== "object") return false;
            if (a.type === "general") return true;
            if (typeof a.path !== "string" || !a.path) return false;
            if (a.type === "file") return true;
            if (a.type !== "line" || (a.side !== "LEFT" && a.side !== "RIGHT") || !Number.isInteger(a.line) || a.line < 1) return false;
            return a.startLine == null || (Number.isInteger(a.startLine) && a.startLine >= 1 && a.startLine <= a.line);
        }

        const severityOf = (d) => (SEVERITIES.includes(d?.severity) ? d.severity : "minor");
        const docById = (id) => state.docs.find((d) => d.id === id) || null;

        function findNear(blob, text, line) {
            if (typeof text !== "string") return null;
            for (let delta = 1; delta <= FIND_WINDOW; delta++) {
                if (blob[line - 1 + delta] === text) return line + delta;
                if (line - 1 - delta >= 0 && blob[line - 1 - delta] === text) return line - delta;
            }
            return null;
        }

        function placeLine(f, d) {
            const a = d.anchor;
            const blob = sideBlob(f, a.side);
            const base = {fi: f.fi, path: f.path, side: a.side, storedLine: a.line};
            if (!blob) return {...base, place: "outdated"};
