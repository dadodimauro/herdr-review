            const fileLink = (ch) => {
                const f = files[ch.fi];
                const viewed = ch.units.length > 0 && ch.units.every((u) => state.viewed.has(u));
                let a = 0, d = 0;
                for (const hi of ch.hunks) {
                    a += f.hunks[hi].adds;
                    d += f.hunks[hi].dels;
                }
                const counts = f.hunks.length ? `+${a} −${d}` : f.status;
                return `<li><a href="#${ch.id}" data-act="goto" data-target="${ch.id}" class="${viewed ? "viewed" : ""}"><span class="chk">${viewed ? "✓" : ""}</span><span class="fn" title="${esc(f.path)}">${esc(state.view === "file" ? f.path : basename(f.path))}</span><span class="d">${esc(counts)}</span><span class="${state.openCount.get(ch.id) ? "dot" : ""}" title="${state.openCount.get(ch.id) ? "Open threads" : ""}"></span></a></li>`;
            };
            let tree;
            if (state.view === "topic") {
                tree = topicPlan.map((plan) => `<li><a href="#topic-${plan.g.id}" data-act="goto" data-target="topic-${plan.g.id}"><span class="ci">${plan.g.gi + 1}</span><span>${esc(plan.g.title)}</span></a><ul>${state.chunks.filter((ch) => ch.gid === plan.g.id).map(fileLink).join("")}</ul></li>`).join("");
                const others = state.chunks.filter((ch) => ch.id.startsWith("ch-other-"));
                if (others.length) tree += `<li><a href="#topic-other" data-act="goto" data-target="topic-other"><span class="ci">·</span><span>Files without a topic</span></a><ul>${others.map(fileLink).join("")}</ul></li>`;
            } else tree = `<li><ul>${state.chunks.map(fileLink).join("")}</ul></li>`;
            const contents = `<nav class="panel" id="s-tree" aria-label="Contents"><h3>Contents</h3><ul class="tree${state.view === "file" ? " flat" : ""}">${tree}</ul></nav>`;
            let findings = "";
            if (state.dbState === "ready" && state.loaded.comments) {
                const open = openFindings();
                findings = `<div class="panel" id="s-findings"><h3>Open findings</h3>${open.length ? `<ul class="flist">${open.map(findingLink).join("")}</ul>` : `<p class="empty">No open findings.</p>`}</div>`;
            }
            const keys = `<div class="panel" id="s-keys"><h3>Keyboard</h3><div class="keys">
                <span><kbd>j</kbd> <kbd>k</kbd></span><span>Next / previous change</span>
                <span><kbd>n</kbd> <kbd>p</kbd></span><span>Next / previous file</span>
                <span><kbd>]</kbd> <kbd>[</kbd></span><span>Next / previous open thread</span>
                <span><kbd>v</kbd></span><span>Mark the current file viewed</span>
                <span><kbd>u</kbd> <kbd>s</kbd></span><span>Unified / split</span>
                <span><kbd>t</kbd></span><span>By topic / by file</span>
                <span><kbd>${MOD}</kbd>+<kbd>Enter</kbd></span><span>Save the comment</span>
                <span>Hover</span><span>Type and docs, when the page has them</span>
                <span><kbd>${MOD}</kbd> + click</span><span>Peek the definition or list usages</span>
                <span><kbd>Esc</kbd></span><span>Close a menu or panel</span></div></div>`;
            reconcile($("side-body"), [{id: "s-progress", html: progress}, {id: "s-tree", html: contents}, ...(findings ? [{id: "s-findings", html: findings}] : []), {id: "s-keys", html: keys}]);
            $("side-body").classList.toggle("open", state.contentsOpen);
            document.querySelector(".contents-toggle").setAttribute("aria-expanded", String(state.contentsOpen));
            markCurrent();
        }

        function myDrafts() {
            return state.docs.filter((d) => d.author === state.me && d.status === "draft" && d.kind !== "finding");
        }

        // GitHub thread changes that no pending or working batch carries yet
        function pendingResolves() {
            return state.threads.filter((t) => t.source === "gh" && t.ghPending && !t.ghQueued);
        }

        function renderToolbar() {
            document.querySelectorAll('[data-act="view"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === state.view)));
            document.querySelectorAll('[data-act="mode"]').forEach((b) => {
                b.setAttribute("aria-pressed", String(b.dataset.m === effectiveMode()));
                b.disabled = narrow.matches && b.dataset.m === "split";
                b.title = b.disabled ? "Split needs a wider screen" : "";
            });
            const hide = document.querySelector('.tbar [data-act="hide-resolved"]');
            hide.setAttribute("aria-pressed", String(state.hideResolved));
            document.querySelectorAll('[data-act="only-new"]').forEach((b) => {
                if (b.closest(".tbar")) b.hidden = newUnits.size === 0;
                b.setAttribute("aria-pressed", String(state.onlyNew));
            });
            const n = state.canComment ? myDrafts().length + pendingResolves().length : 0;
            const btn = $("finish-btn");
            btn.querySelector(".count").textContent = `(${n})`;
            btn.disabled = !state.canComment;
            btn.title = state.canComment ? "Send your comments to Claude or post them on GitHub" : "Sign in to claude.ai to comment";
            btn.setAttribute("aria-expanded", String(state.finish.open));
        }

        // ---- render all, keeping focus, composer text and the reading position ----
        let renderTimer = null;

        function scheduleRender() {
            if (renderTimer) return;
            renderTimer = setTimeout(() => {
                renderTimer = null;
                renderAll();
            }, 16);
        }

        function renderAll() {
            clearTimeout(renderTimer);
            renderTimer = null;
            const active = document.activeElement;
            const focus = active && active !== document.body ? {
                ck: active.matches("textarea[data-ck]") ? active.dataset.ck : null,
                id: active.id || null,
                start: active.selectionStart,
                end: active.selectionEnd,
            } : null;
            const anchor = scrollAnchor();
            updateCanComment();
            placeThreads();
            buildChunks();
            computeOwners();
            renderToolbar();
            renderContent();
            renderWalkDynamic();
            renderSidebar();
            renderPrFoot();
            if (state.finish.open) renderFinish();
            document.querySelectorAll("textarea[data-ck]").forEach((ta) => {
                const cp = state.composers.get(ta.dataset.ck);
                if (cp && ta.value !== cp.text) ta.value = cp.text;
            });
            fillTimes();
            restoreAnchor(anchor);
            if (focus && (!document.activeElement || document.activeElement === document.body)) {
                const el = focus.ck ? document.querySelector(`textarea[data-ck="${CSS.escape(focus.ck)}"]`) : focus.id ? $(focus.id) : null;
                if (el) {
                    el.focus({preventScroll: true});
                    if (typeof focus.start === "number" && el.setSelectionRange) {
                        try {
                            el.setSelectionRange(focus.start, focus.end);
                        } catch {
                            // Not a text control
                        }
                    }
                }
            }
            applySelection();
        }

        // Relative times are not in the compared HTML: a block would change each minute and lose the reader's selection
        function fillTimes() {
            for (const el of document.querySelectorAll("time.ago")) {
                const text = ago(el.getAttribute("datetime"));
                if (el.textContent !== text) el.textContent = text;
            }
        }

        // The line under the toolbar stays where it is when content above it changes, in its block or in a block above
        function scrollAnchor() {
            if (scrollY < 1) return null;
            const y = stickyOffset();
            for (const root of [$("w-dyn"), $("content")]) {
                for (const el of root.children) {
                    const r = el.getBoundingClientRect();
                    if (r.bottom <= y) continue;
                    if (r.top > y + 40) return null;
                    const row = root.id === "content" ? rowAt(el, y) : null;
                    return {id: el.id, top: r.top, ...row};
                }
            }
            return null;
        }

        // The first code row of a block whose bottom is below y, found by halves: rows are in page order
        function rowAt(block, y) {
            const rows = block.querySelectorAll("tr.ln");
            let lo = 0, hi = rows.length - 1, found = null;
            while (lo <= hi) {
                const mid = (lo + hi) >> 1;
                if (rows[mid].getBoundingClientRect().bottom > y) {
                    found = rows[mid];
                    hi = mid - 1;
                } else lo = mid + 1;
            }
            const attr = found && (found.dataset.new != null ? `data-new="${found.dataset.new}"` : found.dataset.old != null ? `data-old="${found.dataset.old}"` : "");
            return attr ? {row: `tr.ln[${attr}]`, rowTop: found.getBoundingClientRect().top} : null;
        }

        function restoreAnchor(anchor) {
            const el = anchor && $(anchor.id);
            if (!el) return;
            const row = anchor.row && el.querySelector(anchor.row);
            const shift = row ? row.getBoundingClientRect().top - anchor.rowTop : el.getBoundingClientRect().top - anchor.top;
            if (Math.abs(shift) > 1) window.scrollBy(0, shift);
        }

        function stickyOffset() {
            return ($("tbar-wrap")?.getBoundingClientRect().height || 0) + 8;
        }

        // ---- selection, menus, navigation ----
        function applySelection() {
            document.querySelectorAll("tr.sel").forEach((tr) => tr.classList.remove("sel"));
            const s = state.selected;
            const sec = s && $(s.cid);
            if (!sec) return;
            const attr = s.side === "LEFT" ? "old" : "new";
            for (let n = s.startLine; n <= s.line && n - s.startLine < 500; n++) sec.querySelector(`tr.ln[data-${attr}="${n}"]`)?.classList.add("sel");
        }

        function selectLines(cid, side, n, extend) {
            const prev = state.selected;
            const range = extend && prev && prev.cid === cid && prev.side === side;
            const from = range ? prev.anchor : n;
            state.selected = {cid, side, startLine: Math.min(from, n), line: Math.max(from, n), anchor: from};
            applySelection();
            schedulePresence();
            return state.selected;
        }

        function rangeShown(cid, side, a, b) {
            const shown = state.shown.get(cid)?.[side];
            if (!shown) return false;
            for (let n = a; n <= b; n++) if (!shown.has(n)) return false;
            return true;
        }

        function githubLineUrl(f, side, a, b) {
            const rev = side === "LEFT" ? DATA.baseSha : DATA.headSha;
            const path = side === "LEFT" ? f.oldPath || f.path : f.path;
            return `${GH}/blob/${rev}/${encodePath(path)}#L${a}${b > a ? `-L${b}` : ""}`;
        }

        const menu = $("menu");
        // The control that opened the menu, found again by its chunk and a selector: a render can replace it
        let menuOpener = null;

        function closeMenu() {
            const back = menu.contains(document.activeElement) && menuOpener;
            menu.hidden = true;
            menu.innerHTML = "";
            state.menu = null;
            menuOpener = null;
            // Keyboard focus goes back to the line number or the file menu button, not to the top of the page
            if (back) $(back.cid)?.querySelector(back.sel)?.focus({preventScroll: true});
        }

        function showMenu(html, rect, opener) {
            menuOpener = opener;
            menu.innerHTML = html;
            menu.hidden = false;
            const width = menu.offsetWidth;
            menu.style.left = `${Math.max(8, Math.min(scrollX + rect.left, scrollX + document.documentElement.clientWidth - width - 8))}px`;
            menu.style.top = `${scrollY + rect.bottom + 4}px`;
            menu.querySelector("button, a")?.focus();
        }

        function commentHint() {
            if (!state.db) return `<span class="hint">Sign in to claude.ai to comment</span>`;
            if (!state.canComment) return `<span class="hint">You can read this review but not comment</span>`;
            return "";
        }

        function openLineMenu(td, extend) {
            const sec = td.closest(".file");
            const fi = Number(sec.dataset.fi);
            const f = files[fi];
            const side = td.dataset.side, n = Number(td.dataset.line);
            const sel = selectLines(sec.id, side, n, extend);
            const label = sel.startLine === sel.line ? `line ${sel.line}` : `lines ${sel.startLine}–${sel.line}`;
            const url = githubLineUrl(f, side, sel.startLine, sel.line);
            state.menu = {type: "line", cid: sec.id, fi, side, startLine: sel.startLine, line: sel.line, url};
            const comment = commentHint() || (rangeShown(sec.id, side, sel.startLine, sel.line) ? `<button type="button" role="menuitem" data-act="menu-comment">Comment on ${label}</button>` : `<span class="hint">Show the hidden lines in this range to comment on it</span>`);
            showMenu(`${comment}${sel.startLine === sel.line ? `<span class="hint">Shift-click another line number to select a range</span>` : ""}<button type="button" role="menuitem" data-act="menu-copy-link">Copy link</button><a role="menuitem" href="${esc(url)}" target="_blank" rel="noopener" data-act="menu-close">Open on GitHub${DATA.dirty ? " (may not be pushed yet)" : ""}</a>`, td.getBoundingClientRect(), {cid: sec.id, sel: `td.n[data-side="${side}"][data-line="${n}"]`});
        }

        function openFileMenu(btn) {
            const sec = btn.closest(".file");
            const f = files[Number(sec.dataset.fi)];
            const url = f.status === "deleted" ? `${GH}/blob/${DATA.baseSha}/${encodePath(f.oldPath || f.path)}` : `${GH}/blob/${DATA.headSha}/${encodePath(f.path)}`;
            state.menu = {type: "file", fi: f.fi, url};
            showMenu(`${commentHint() || `<button type="button" role="menuitem" data-act="menu-file-comment">Comment on file</button>`}<button type="button" role="menuitem" data-act="menu-copy-path">Copy path</button><a role="menuitem" href="${esc(url)}" target="_blank" rel="noopener" data-act="menu-close">Open on GitHub${DATA.dirty ? " (may not be pushed yet)" : ""}</a>`, btn.getBoundingClientRect(), {cid: sec.id, sel: ".kebab"});
        }

        function flash(el) {
            if (!el) return;
            el.classList.remove("flash");
            void el.offsetWidth;
            el.classList.add("flash");
            setTimeout(() => el.classList.remove("flash"), 1500);
        }

        function scrollToEl(el, extra = 0, smooth = !reduceMotion()) {
            if (!el) return;
            const top = el.getBoundingClientRect().top + scrollY - stickyOffset() - extra;
            window.scrollTo({top: Math.max(0, top), behavior: smooth ? "smooth" : "auto"});
        }

        const FHEAD_EXTRA = 46;

        function ensureChunkOpen(cid) {
            const ch = state.chunkById.get(cid);
            if (!ch) return false;
            let changed = false;
            if (chunkHidden(ch)) {
                state.onlyNew = false;
                changed = true;
            }
            const viewed = ch.units.length > 0 && ch.units.every((u) => state.viewed.has(u));
            if (viewed && !state.open.has(cid)) {
                state.open.add(cid);
                changed = true;
            }
            if (!viewed && state.closed.has(cid)) {
                state.closed.delete(cid);
                changed = true;
            }
            return changed;
        }

        function gotoHunk(cid, hi, view) {
            if (view && view !== state.view) {
                state.view = view;
                savePrefs();
                buildChunks();
            }
            if (!state.chunkById.has(cid)) buildChunks();
            ensureChunkOpen(cid);
            if (state.onlyNew) {
                const ch = state.chunkById.get(cid);
                if (ch && !shownHunks(ch).has(hi)) state.onlyNew = false;
            }
            renderAll();
            const row = $(`hk-${cid}-${hi}`);
            scrollToEl(row || $(cid), row ? FHEAD_EXTRA : 0, false);
            flash(row);
        }

        function gotoThread(key) {
            let t = state.threads.find((x) => x.key === key);
            if (!t) return;
            if (t.resolved && state.hideResolved) {
                state.hideResolved = false;
                savePrefs();
            }
            if (t.resolved) state.showResolved.add(t.key);
            if (t.chunk) ensureChunkOpen(t.chunk);
            renderAll();
            const find = () => {
                t = state.threads.find((x) => x.key === key);
                const root = t && t.chunk ? $(t.chunk) : document;
                return (root || document).querySelector(`[data-thread="${CSS.escape(key)}"]`) || document.querySelector(`[data-thread="${CSS.escape(key)}"]`);
            };
            let el = find();
            if (!el && state.onlyNew) {
                // "Only new" folds the changes seen before, and the thread can be on one of them
                state.onlyNew = false;
                renderAll();
                el = find();
            }
            if (el) {
                scrollToEl(el, el.closest(".file") ? FHEAD_EXTRA : 0, false);
                flash(el);
            }
        }

        function gotoTarget(id) {
            if (!$(id) && state.onlyNew) {
                state.onlyNew = false;
                renderAll();
            }
            const el = $(id);
            if (!el) return;
            scrollToEl(el, 0, false);
            if (el.classList.contains("file")) {
                document.querySelectorAll(".file.focused").forEach((x) => x.classList.remove("focused"));
                el.classList.add("focused");
            }
            if (narrow.matches && state.contentsOpen) {
                state.contentsOpen = false;
                renderSidebar();
            }
        }

        function jumpToLine(fi, line, side = "RIGHT") {
            const cid = chunkIdForLine(fi, side, line);
            if (!state.chunkById.has(cid)) return false;
            ensureChunkOpen(cid);
            (state.reveals[cid] ||= []).push({side, line});
            renderAll();
            const sec = $(cid);
            const row = sec && sec.querySelector(`tr.ln[data-${side === "LEFT" ? "old" : "new"}="${line}"]`);
            if (!row) return false;
            peek.hidden = true;
            scrollToEl(row, FHEAD_EXTRA + 40, false);
            flash(row);
            return true;
        }

        function stepTo(selector, dir, extra) {
            const els = [...document.querySelectorAll(selector)].filter((el) => el.offsetParent !== null);
            const y = stickyOffset() + extra;
            const target = dir > 0 ? els.find((el) => el.getBoundingClientRect().top > y + 2) : els.reverse().find((el) => el.getBoundingClientRect().top < y - 2);
            if (!target) return;
            scrollToEl(target, extra, false);
            flash(target);
        }

        function currentChunkEl() {
            const y = stickyOffset();
            return [...document.querySelectorAll("#content .file")].find((el) => el.getBoundingClientRect().bottom > y + 4) || null;
        }

        function markCurrent() {
            const cur = currentChunkEl();
            document.querySelectorAll("#s-tree a.current").forEach((a) => a.classList.remove("current"));
            if (cur) document.querySelector(`#s-tree a[data-target="${CSS.escape(cur.id)}"]`)?.classList.add("current");
        }

        // ---- viewed and seen ----
        function setViewed(units, on, cids) {
            for (const u of units) {
                if (on) state.viewed.add(u);
                else state.viewed.delete(u);
            }
            for (const cid of cids) {
                state.open.delete(cid);
                state.closed.delete(cid);
            }
            store.set(KEY("viewed"), [...state.viewed]);
            renderAll();
        }

        setTimeout(() => {
            const merged = [...new Set([...allUnits, ...prevSeen])].slice(0, SEEN_CAP);
            store.set(KEY("seen"), merged);
        }, 3000);

        // ---- presence: what the viewer looks at, never comment text ----
        let presenceTimer = null, lastPresence = "";

        function schedulePresence() {
            if (!state.room) return;
            clearTimeout(presenceTimer);
            presenceTimer = setTimeout(() => {
                const cur = currentChunkEl();
                const sel = state.selected;
                const fi = cur ? Number(cur.dataset.fi) : null;
                const patch = {
                    view: state.view,
                    topic: cur && cur.dataset.gid ? cur.dataset.gid : null,
                    path: fi !== null && files[fi] ? files[fi].path : null,
                    line: sel && cur && sel.cid === cur.id ? sel.line : null,
                };
                const json = JSON.stringify(patch);
                if (json === lastPresence) return;
                lastPresence = json;
                Promise.resolve().then(() => state.room.presence(patch)).catch(() => {
                    // Presence is best effort
                });
            }, 500);
        }

        let scrollQueued = false;
        addEventListener("scroll", () => {
            if (scrollQueued) return;
            scrollQueued = true;
            setTimeout(() => {
                scrollQueued = false;
                markCurrent();
                schedulePresence();
            }, 120);
        }, {passive: true});

        // ---- toasts, notice, clipboard ----
        function toast(message, kind = "") {
            const el = document.createElement("div");
            el.className = `toast${kind ? ` ${kind}` : ""}`;
            el.textContent = message;
            $("toasts").appendChild(el);
            setTimeout(() => el.remove(), kind === "error" ? 5000 : 3200);
        }

        function showNotice(text, value, reason) {
            const el = $("notice");
            el.innerHTML = `<div class="nc-text"></div>${reason ? `<div class="muted nc-reason"></div>` : ""}<textarea readonly rows="${value.includes("\n") ? 5 : 1}" aria-label="Text to copy"></textarea><div class="nc-btns"><button type="button" data-act="notice-copy">Copy</button><button type="button" data-act="notice-close">Close</button></div>`;
            el.querySelector(".nc-text").textContent = text;
            if (reason) el.querySelector(".nc-reason").textContent = reason;
            el.querySelector("textarea").value = value;
            el.hidden = false;
        }

        function manualNotice(reason) {
            showNotice("Claude does not listen to this page now. In your Claude chat, type:", SYNC_COMMAND, reason);
        }

        function copyText(text, done = "Copied") {
            const fallback = () => {
                showNotice("The browser blocked the copy. Select the text and press " + MOD + "+C.", text);
                const ta = $("notice").querySelector("textarea");
                ta.focus();
                ta.select();
            };
            try {
                if (!navigator.clipboard || !navigator.clipboard.writeText) {
                    fallback();
                    return;
                }
                navigator.clipboard.writeText(text).then(() => toast(done), fallback);
            } catch {
                fallback();
            }
        }

        // ---- send to Claude or GitHub: a batch doc, comment status updates, one signal to Claude ----
        const clean = (s) => String(s ?? "").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F]/g, " ").replace(/[\p{Cf}\p{Co}︀-️]/gu, "");
        const cut = (s, n) => Array.from(clean(s)).slice(0, n).join("");
        const jsonBytes = (x) => new TextEncoder().encode(JSON.stringify(x)).length;

        function itemFor(d) {
            let path = null, line = null;
            const root = d.replyTo ? (d.replyTo.startsWith("gh:") ? null : docById(d.replyTo)) : d;
            const gh = d.replyTo && d.replyTo.startsWith("gh:") ? (github?.threads || []).find((g) => `gh:${g.id}` === d.replyTo) : null;
            if (root && root.anchor && root.anchor.type !== "general") {
                path = root.anchor.path;
                line = root.anchor.type === "line" ? root.anchor.line : null;
            } else if (gh) {
                path = gh.path;
                line = Number.isInteger(gh.line) ? gh.line : null;
            }
            const text = d.kind === "finding" ? `${d.title || ""}: ${d.body}` : d.body;
            return {id: d.id, path, line, text};
        }

        function buildPayload(target, batchId, items) {
            const count = items.length;
            const label = target === "github" ? `Review: ${plural(count, "comment")} to post on GitHub` : target === "refresh" ? "Review: compare the PR on GitHub with this page" : `Review: ${plural(count, "comment")} for Claude`;
            const payload = {label, kind: "code-review-diff", target, batch: batchId, artifact: cut(DATA.title, 200), branch: cut(DATA.branch, 200), count, items: []};
            let list = items.slice(0, PAYLOAD_ITEMS), limit = ITEM_TEXT;
            for (;;) {
                payload.items = list.map((it) => ({id: it.id, path: it.path ? cut(it.path, 240) : null, line: it.line, text: cut(it.text, limit)}));
                if (jsonBytes(payload) <= PAYLOAD_BYTES || (!list.length)) return payload;
                if (limit > 24) limit = Math.floor(limit / 2);
                else list = list.slice(0, -1);
            }
        }

        function roomReason(err) {
            const code = err && err.code;
            if (code === "rate_limited") return "Sends to Claude are limited. Wait a moment.";
            if (code === "claude_unavailable") return "";
            if (code === "invalid_argument") return "The page could not package the comments for Claude.";
            return "Claude could not be reached from this page.";
        }

        function commentsReason(err) {
            const code = err && err.code;
            return {
                consent_required: "The note to Claude was not posted: you did not allow this page to comment for you.",
                forbidden: "Commenting from this page is off here.",
                rate_limited: "Sends to Claude are limited. Wait a moment.",
                invalid: "The note to Claude was not valid.",
                not_found: "The comment thread was not found.",
                claude_unavailable: "",
            }[code] ?? "Comments are not available from this page now.";
        }

        // Call from a click handler: the room send must happen before any await
        function startBatch({ref = state.db.collection("batches").doc(), target, ids, items, event, body, resolveGithub, unresolveGithub, done}) {
            const batchId = ref.id;
            const channel = state.channel || "manual";
            let sent = null, anchor = null;
            if (channel === "room" && state.room) {
                const payload = buildPayload(target, batchId, items);
                try {
                    sent = state.room.sendToClaudeSession(payload, {
                        deliver: "send",
                        attachPresence: false,
                        onStatus: (s) => {
                            if (s && s.state === "failed") manualNotice("The send to Claude failed.");
                            else if (s && s.state === "sent") toast(target === "refresh" ? "Claude has the request." : "Claude has the review.");
                        },
                    });
                } catch (err) {
                    sent = Promise.reject(err);
                }
                Promise.resolve(sent).catch(() => {
                    // Handled below, after the writes
                });
            } else if (channel === "comments" && state.comments) {
                // The open Finish panel took the anchor already; else read the layout now, in the click
                anchor = state.finish.anchor ? Promise.resolve(state.finish.anchor) : state.comments.anchorFor($("walkthrough"));
                anchor.catch(() => {
                    // Handled below, after the writes
                });
            }
            return finishBatch({ref, batchId, target, ids, items, event, body, resolveGithub, unresolveGithub, channel, sent, anchor, done});
        }

        async function finishBatch({ref, batchId, target, ids, items, event, body, resolveGithub, unresolveGithub, channel, sent, anchor, done}) {
            const at = nowIso();
            const doc = {v: 1, target, author: state.me, createdAt: at, ids, status: "pending"};
            if (target === "github") {
                doc.event = event || "COMMENT";
                doc.body = body || "";
                if (resolveGithub && resolveGithub.length) doc.resolveGithub = resolveGithub;
                if (unresolveGithub && unresolveGithub.length) doc.unresolveGithub = unresolveGithub;
            }
            // A write that fails gets one more try after a short random wait: "unavailable" passes (db.d.ts)
            const write = (run) => run().catch(() => new Promise((resolve) => setTimeout(resolve, 200 + Math.random() * 600)).then(run));
            try {
                await write(() => ref.set(doc));
            } catch (err) {
                writeFailed(err, false);
                return false;
            }
            // The comments channel needs a recent click, so the updates go in groups: one write at a time per document
            const status = target === "github" ? "to_github" : "to_claude";
            const docs = [...new Set(ids)];
            const missed = [];
            let lastError = null;
            for (let i = 0; i < docs.length; i += WRITE_GROUP) {
                const group = docs.slice(i, i + WRITE_GROUP);
                const results = await Promise.allSettled(group.map((id) => write(() => state.db.doc(`comments/${id}`).update({status, batch: batchId}))));
                results.forEach((r, k) => {
                    if (r.status === "rejected") {
                        missed.push(group[k]);
                        lastError = r.reason;
                    }
                });
            }
            if (docs.length && missed.length === docs.length) {
                writeFailed(lastError, false);
                return false;
            }
            // Claude still gets the comments that went in. The others stay drafts, so the batch lists only the sent ones.
            if (missed.length) await write(() => ref.update({ids: docs.filter((id) => !missed.includes(id))})).catch(() => {});
            if (done) done();
            if (missed.length) toast(`${plural(missed.length, "comment")} could not be sent and ${missed.length === 1 ? "stays a draft" : "stay drafts"}. Send ${missed.length === 1 ? "it" : "them"} again.`, "error");
            const n = target === "refresh" ? "a GitHub check" : plural(docs.length - missed.length, "comment");
            const sentText = target === "github" ? `Sent the review with ${n} to Claude, to post on GitHub` : target === "refresh" ? "Asked Claude to check GitHub" : `Sent ${n} to Claude`;
            const savedText = target === "github" ? `The review with ${n} is saved for Claude to post.` : target === "refresh" ? "The GitHub check is saved for Claude." : `${n} saved for Claude.`;
            if (channel === "room" && sent) {
                try {
                    const result = await sent;
                    toast(result && result.to === "pane" ? `${sentText}. Check the conversation beside this page.` : `${sentText}.`);
                } catch (err) {
                    toast(savedText);
                    manualNotice(roomReason(err));
                }
            } else if (channel === "comments" && state.comments) {
                try {
                    await state.comments.sendToClaude({anchor: await anchor, text: `Review batch ${batchId}: ${n} for Claude (target ${target}). The page's database has it: batches/${batchId}.`});
                    toast(`${sentText}, as a comment on this page.`);
                } catch (err) {
                    toast(savedText);
                    manualNotice(commentsReason(err));
                }
            } else {
                toast(savedText);
                manualNotice("");
            }
            refreshChannel();
            return true;
        }

        async function refreshChannel() {
            let channel = "manual";
            try {
                if (state.room && ROOM_READY.includes(await state.room.canSendToClaudeSession())) channel = "room";
            } catch {
                // An older platform rejects: use the next channel
            }
            if (channel === "manual") {
                try {
                    if (state.comments && (await state.comments.canSendToClaude()) === "available") channel = "comments";
                } catch {
                    // Same: fall back
                }
            }
            state.channel = channel;
            if (state.finish.open) renderFinish();
            if (channel === "comments") refreshAnchor();
            return channel;
        }

        // comments.anchorFor reads the layout when it runs. Take the anchor while the Finish panel is open, so the
        // submit does not wait for it before the send to Claude
        async function refreshAnchor() {
            if (!state.finish.open || state.channel !== "comments" || !state.comments) return;
            try {
                const anchor = await state.comments.anchorFor($("walkthrough"));
                if (state.finish.open) state.finish.anchor = anchor;
            } catch {
                state.finish.anchor = null;
            }
        }

        function sendThread(t) {
            const drafts = threadDocs(t).filter((d) => d.author === state.me && d.status === "draft");
            let ids = drafts.map((d) => d.id);
            if (!ids.length && sendsAlone(t)) ids = [t.id];
            if (!ids.length) {
                toast("Write a reply first, then send it to Claude.");
                return;
            }
            const docs = ids.map(docById).filter(Boolean);
            if (!docs.length) return;
            state.busy.add(t.key);
            startBatch({target: "claude", ids: docs.map((d) => d.id), items: docs.map(itemFor)}).finally(() => {
                state.busy.delete(t.key);
                scheduleRender();
            });
            renderAll();
        }

        // ---- Finish review panel ----
        function finishItems() {
            const mine = [], others = [], findings = [], gh = [];
            for (const d of state.docs) {
                if (d.status !== "draft" || d.kind === "finding" || d.author === "claude") continue;
                (d.author === state.me ? mine : others).push(d);
            }
            if (state.finish.target === "github") {
                for (const t of state.threads) {
                    if (t.kind === "finding" && !t.resolved && t.doc.status !== "to_github" && !onGithub(t.doc)) findings.push(t.doc);
                }
                gh.push(...pendingResolves());
            }
            return {mine, others, findings, gh};
        }

        const finishDefault = (key, group) => (group === "mine" || group === "gh");
        const isPicked = (key, group) => (state.finish.sel.has(key) ? state.finish.sel.get(key) : finishDefault(key, group));

        function docWhere(d) {
            if (d.replyTo) {
                if (d.replyTo.startsWith("gh:")) {
                    const g = (github?.threads || []).find((x) => `gh:${x.id}` === d.replyTo);
                    return `Reply · ${g ? `${basename(g.path)}${Number.isInteger(g.line) ? `:${g.line}` : ""} (GitHub)` : "GitHub thread"}`;
                }
                const root = docById(d.replyTo);
                return `Reply · ${root ? docWhere(root) : "deleted thread"}`;
            }
            const a = d.anchor;
            if (a.type === "general") return "General";
            if (a.type === "file") return `${basename(a.path)} · file`;
            return `${basename(a.path)}:${a.startLine ? `${a.startLine}–` : ""}${a.line}`;
        }

        function pickedDocs() {
            const {mine, others, findings} = finishItems();
            return [...mine.filter((d) => isPicked(d.id, "mine")), ...others.filter((d) => isPicked(d.id, "others")), ...findings.filter((d) => isPicked(d.id, "findings"))];
        }

        function renderFinish() {
            const el = $("finish");
            if (!state.finish.open) {
                el.hidden = true;
                return;
            }
            const F = state.finish;
            const noPr = !DATA.pr;
            if (noPr && F.target === "github") F.target = "claude";
            const {mine, others, findings, gh} = finishItems();
            const row = (key, group, what, text, extra = "") => `<li><label><input type="checkbox" id="fin-i-${esc(key)}" data-fin-item="${esc(key)}" data-group="${group}"${isPicked(key, group) ? " checked" : ""}><span><span class="what">${esc(what)}${extra}</span><span class="txt">${esc(text)}</span></span></label></li>`;
            const section = (title, list) => (list.length ? `<div><h3>${title}</h3><ul>${list.join("")}</ul></div>` : "");
            const items = [
                section("Your drafts", mine.map((d) => row(d.id, "mine", docWhere(d), d.body))),
                section("Drafts by others", others.map((d) => row(d.id, "others", docWhere(d), d.body, ` · ${esc(nameOf(d.author))}`))),
                section("Claude's open findings, not on GitHub yet", findings.map((d) => row(d.id, "findings", docWhere(d), `${SEVERITY_LABEL[severityOf(d)]}: ${d.title || ""}`))),
                section("GitHub thread changes", gh.map((t) => row(`gh:${t.id}`, "gh", `${basename(t.path || "")}${t.line ? `:${t.line}` : ""}`, `${t.resolved ? "Resolve" : "Unresolve"} the thread by ${t.gh.comments?.[0]?.author || "someone"}`))),
            ].join("");
            const picked = pickedDocs();
            const ghPicked = gh.filter((t) => isPicked(`gh:${t.id}`, "gh"));
            const n = picked.length;
            const label = F.target === "github" ? (n ? `Post review with ${plural(n, "comment")}` : "Post review") : `Send ${plural(n, "comment")} to Claude`;
            const ready = F.target === "github" ? Boolean(DATA.pr) && (n > 0 || F.event !== "COMMENT" || F.body.trim() !== "" || ghPicked.length > 0) : n > 0;
            const channelText = {
                room: "Claude gets it in the conversation beside this page.",
                comments: "Claude gets it as a comment on this page.",
                manual: `Claude does not listen to this page now. After you send, type ${SYNC_COMMAND} in your Claude chat.`,
            }[state.channel] || "Checking how to reach Claude…";
            const events = [["COMMENT", "Comment"], ["APPROVE", "Approve"], ["REQUEST_CHANGES", "Request changes"]];
            const ghOptions = F.target === "github" ? `<div class="fin-body"><label for="fin-body">Review summary<textarea id="fin-body" data-fin="body" rows="3" placeholder="Optional. Shows at the top of the review on GitHub."></textarea></label></div><fieldset class="events"><legend class="sr-only">Review type</legend>${events.map(([v, t]) => `<label><input type="radio" name="fin-event" id="fin-e-${v}" value="${v}"${F.event === v ? " checked" : ""}> ${t}</label>`).join("")}</fieldset>` : "";
            const html = `<div class="fin-head"><h2 id="finish-title">Finish your review</h2><button type="button" id="fin-close" data-act="finish-close" aria-label="Close">✕</button></div>
                <fieldset class="opts"><legend class="sr-only">Where the comments go</legend>
                <label class="opt"><input type="radio" name="fin-target" id="fin-t-claude" value="claude"${F.target === "claude" ? " checked" : ""}><span><b>Send to Claude</b><small>Claude changes the code and replies in each thread.</small></span></label>
                <label class="opt${noPr ? " off" : ""}"><input type="radio" name="fin-target" id="fin-t-github" value="github"${F.target === "github" ? " checked" : ""}${noPr ? " disabled" : ""}><span><b>Post to GitHub as a review</b><small>${noPr ? "Open a PR first, then ask Claude to rebuild this page with the PR number." : `Claude posts the comments as one review on PR #${esc(DATA.pr)}.`}</small></span></label></fieldset>
                ${ghOptions}
                <div class="fin-items">${items || `<p class="empty">No drafts to send. Write a comment on a line first.</p>`}</div>
                <p class="fin-channel">${esc(channelText)}</p>
                <div class="fin-foot"><button type="button" data-act="finish-close">Cancel</button><button type="button" class="primary" id="fin-submit" data-act="finish-submit"${ready && state.channel && !F.busy ? "" : " disabled"}>${esc(label)}</button></div>`;
            if (el.dataset.html !== html) {
                const active = el.contains(document.activeElement) ? document.activeElement : null;
                const focus = active && {id: active.id, start: active.selectionStart, end: active.selectionEnd};
                el.innerHTML = html;
                el.dataset.html = html;
                const ta = $("fin-body");
                if (ta) ta.value = F.body;
                const again = focus && focus.id && $(focus.id);
                if (again && !again.disabled) {
                    again.focus({preventScroll: true});
                    if (again === ta && typeof focus.start === "number") ta.setSelectionRange(focus.start, focus.end);
                } else if (focus) focusFinish();
            }
            el.hidden = false;
        }

        // The first control: the checked choice of where the comments go
        const focusFinish = () => ($(`fin-t-${state.finish.target}`) || $("fin-close"))?.focus({preventScroll: true});

        function openFinish() {
            if (!state.canComment) return;
            state.finish.open = true;
            state.channel = null;
            state.finish.anchor = null;
            clearInterval(state.finish.anchorTimer);
            state.finish.anchorTimer = setInterval(refreshAnchor, ANCHOR_REFRESH);
            renderAll();
            focusFinish();
            refreshChannel();
        }

        function closeFinish(restoreFocus = true) {
            if (!state.finish.open) return;
            state.finish.open = false;
            clearInterval(state.finish.anchorTimer);
            state.finish.anchor = null;
            $("finish").hidden = true;
            delete $("finish").dataset.html;
            renderToolbar();
            if (restoreFocus) $("finish-btn").focus();
        }

        function submitFinish() {
            const F = state.finish;
            if (F.busy || !state.channel) return;
            const target = F.target === "github" && DATA.pr ? "github" : "claude";
            const docs = pickedDocs();
            const {gh} = finishItems();
            const ghPicked = target === "github" ? gh.filter((t) => isPicked(`gh:${t.id}`, "gh")) : [];
            if (target === "claude" && !docs.length) return;
            F.busy = true;
            renderFinish();
            startBatch({
                target,
                ids: docs.map((d) => d.id),
                items: docs.map(itemFor),
                event: F.event,
                body: F.body.trim(),
                resolveGithub: ghPicked.filter((t) => t.resolved).map((t) => t.id),
                unresolveGithub: ghPicked.filter((t) => !t.resolved).map((t) => t.id),
                done: () => {
                    F.body = "";
                    F.event = "COMMENT";
                    F.sel = new Map();
                    closeFinish(false);
                },
            }).finally(() => {
                F.busy = false;
                scheduleRender();
            });
        }

        // ---- hover, peek and usages (create-diff) ----
        const hoverCard = $("hover-card");
        const peek = $("peek");
        let hoverTimer = null;

        function placeBelow(el, rect) {
            el.style.left = `${Math.max(8, Math.min(scrollX + rect.left, scrollX + document.documentElement.clientWidth - el.offsetWidth - 8))}px`;
            el.style.top = `${scrollY + rect.bottom + 4}px`;
        }

        function showHover(tok) {
            const h = tok.dataset.h, d = tok.dataset.d;
            if (h === undefined && d === undefined) return;
            const text = h !== undefined ? DATA.hovers[Number(h)] || "" : "";
            const split = text.indexOf("\n\n");
            const sig = split === -1 ? text : text.slice(0, split);
            const doc = split === -1 ? "" : text.slice(split + 2);
            const def = d !== undefined ? DATA.definitions[Number(d)] : null;
            const usages = tok.dataset.r !== undefined ? DATA.references[Number(tok.dataset.r)] : null;
            hoverCard.innerHTML = `${sig ? "<pre></pre>" : ""}${doc ? `<div class="doc"></div>` : ""}${def || usages ? `<div class="foot"></div>` : ""}`;
            if (sig) hoverCard.querySelector("pre").textContent = sig;
            if (doc) hoverCard.querySelector(".doc").textContent = doc;
            if (usages) hoverCard.querySelector(".foot").textContent = `${MOD}+click to see ${plural(usages.length, "usage")}`;
            else if (def) hoverCard.querySelector(".foot").textContent = `${def.path}:${def.line} · ${MOD}+click to peek`;
            if (!hoverCard.innerHTML) return;
            hoverCard.hidden = false;
            placeBelow(hoverCard, tok.getBoundingClientRect());
        }

        document.addEventListener("mouseover", (e) => {
            const tok = e.target.closest?.(".tok");
            clearTimeout(hoverTimer);
            if (!tok) {
                if (!e.target.closest?.("#hover-card")) hoverCard.hidden = true;
                return;
            }
            hoverTimer = setTimeout(() => showHover(tok), 250);
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Meta" || e.key === "Control") document.body.classList.add("mod");
        });
        document.addEventListener("keyup", (e) => {
            if (e.key === "Meta" || e.key === "Control") document.body.classList.remove("mod");
        });
        addEventListener("blur", () => document.body.classList.remove("mod"));

        const isOldSide = (tok) => Boolean(tok.closest("tr")?.classList.contains("del") || (effectiveMode() === "split" && tok.closest("td.c")?.previousElementSibling?.dataset.side === "LEFT"));

        function definitionFile(path) {
            const f = fileByPath.get(path);
            return f && f.newBlob ? f : null;
        }

        function openUsages(tok) {
            const usages = DATA.references[Number(tok.dataset.r)] || [];
            const fi = Number(tok.closest(".file")?.dataset.fi);
            const usageSide = isOldSide(tok) ? "LEFT" : "RIGHT";
            peek.innerHTML = `<div class="ph"><span class="p"></span><button type="button" data-peek="close" aria-label="Close">✕</button></div><div class="pb"><ul class="usages">${usages.map((u, i) => `<li><button type="button" data-usage="${i}"><span class="where"></span><span class="code"></span></button></li>`).join("")}</ul></div>`;
            peek.querySelector(".p").textContent = `${plural(usages.length, "usage")} of ${tok.textContent}`;
            peek.querySelectorAll("[data-usage]").forEach((btn) => {
                const u = usages[Number(btn.dataset.usage)];
                btn.querySelector(".where").textContent = `${u.path}:${u.line}${u.sameDoc ? " (this file)" : ""}`;
                btn.querySelector(".code").textContent = u.text;
            });
            peek.hidden = false;
            hoverCard.hidden = true;
            placeBelow(peek, tok.getBoundingClientRect());
            peek.onclick = (e) => {
                if (e.target.closest("[data-peek]")?.dataset.peek === "close") {
                    peek.hidden = true;
                    return;
                }
                const btn = e.target.closest("[data-usage]");
                if (!btn) return;
                const u = usages[Number(btn.dataset.usage)];
                if (u.sameDoc && Number.isInteger(fi) && jumpToLine(fi, u.line, usageSide)) return;
                const f = definitionFile(u.path);
                if (f && jumpToLine(f.fi, u.line)) return;
                window.open(`${GH}/blob/${DATA.headSha}/${encodePath(u.path)}#L${u.line}`, "_blank", "noopener");
            };
        }

        const PEEK_LINES = 14;

        function openPeek(tok) {
            const def = DATA.definitions[Number(tok.dataset.d)];
            if (!def) return;
            const fi = Number(tok.closest(".file")?.dataset.fi);
            const onOld = isOldSide(tok);
            const target = def.sameDoc && Number.isInteger(fi) ? {fi, side: onOld ? "LEFT" : "RIGHT"} : def.inRepo && definitionFile(def.path) ? {fi: definitionFile(def.path).fi, side: "RIGHT"} : null;
            const snippetBlob = def.blob || definitionFile(def.path)?.newBlob;
            const snippet = snippetBlob && blobLines(snippetBlob) ? blobLines(snippetBlob).slice(def.line - 1, def.line - 1 + PEEK_LINES) : [];
            const rev = def.sameDoc && onOld ? DATA.baseSha : DATA.headSha;
            const link = def.inRepo ? `<a href="${GH}/blob/${rev}/${esc(encodePath(def.path))}#L${def.line}" target="_blank" rel="noopener">Open on GitHub</a>` : `<span class="d">outside the repo</span>`;
            peek.innerHTML = `<div class="ph"><span class="p"></span>${target ? `<button type="button" data-peek="jump">Go to line</button>` : ""}${link}<button type="button" data-peek="close" aria-label="Close">✕</button></div><div class="pb">${snippet.length ? `<table>${snippet.map((line, i) => `<tr class="${i === 0 ? "first" : ""}"><td class="n">${def.line + i}</td><td class="c">${esc(line) || " "}</td></tr>`).join("")}</table>` : `<pre class="sig"></pre>`}</div>`;
            if (!snippet.length) peek.querySelector(".sig").textContent = tok.dataset.h !== undefined ? DATA.hovers[Number(tok.dataset.h)] : "This file is not part of the page.";
            peek.querySelector(".p").textContent = `${def.path}:${def.line}`;
            peek.hidden = false;
            hoverCard.hidden = true;
            placeBelow(peek, tok.getBoundingClientRect());
            peek.onclick = (e) => {
                const act = e.target.closest("[data-peek]")?.dataset.peek;
                if (act === "close") peek.hidden = true;
                if (act === "jump" && target) jumpToLine(target.fi, def.line, target.side);
            };
        }

        // ---- events ----
        function threadOf(el) {
            const key = el.closest("[data-thread]")?.dataset.thread;
            return key ? state.threads.find((t) => t.key === key) : null;
        }

        function replyQuote(html) {
            const text = String(html).replace(/<code>(.*?)<\/code>/g, "`$1`").replace(/<b>(.*?)<\/b>/g, "**$1**").replace(/<[^>]+>/g, "")
                .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#x27;|&#39;/g, "'").replace(/&amp;/g, "&");
            return `${text.split("\n").map((l) => `> ${l}`).join("\n")}\n\n`;
        }

        document.addEventListener("click", (e) => {
            const t = e.target;
            if (!(t instanceof Element)) return;
            const tok = t.closest(".tok[data-d], .tok[data-r]");
            if (tok && (e.metaKey || e.ctrlKey)) {
                e.preventDefault();
                if (tok.dataset.r !== undefined) openUsages(tok);
                else openPeek(tok);
                return;
            }
            // A click in the GitHub popup does not close the panels behind it
            if (!t.closest("#gh-news")) {
                if (!peek.hidden && !peek.contains(t)) peek.hidden = true;
                if (!menu.hidden && !menu.contains(t)) closeMenu();
                if (state.finish.open && !t.closest("#finish") && !t.closest("#finish-btn") && t.isConnected) closeFinish(false);
            }
            const num = t.closest("td.n[data-line]");
            if (num) {
                e.preventDefault();
                openLineMenu(num, e.shiftKey);
                return;
            }
            const el = t.closest("[data-act]");
            if (!el) return;
            const act = el.dataset.act;
            if (el.tagName === "A" && act !== "menu-close") e.preventDefault();
            onAction(act, el, e);
        });

        function onAction(act, el, e) {
            const sec = el.closest(".file");
            const cid = sec ? sec.id : null;
            switch (act) {
                case "view":
                    if (state.view !== el.dataset.v) {
                        state.view = el.dataset.v;
                        state.selected = null;
                        savePrefs();
                        renderAll();
                        scrollTo({top: Math.min(scrollY, $("content").offsetTop)});
                    }
                    return;
                case "mode":
                    state.mode = el.dataset.m;
                    savePrefs();
                    renderAll();
                    return;
                case "hide-resolved":
                    state.hideResolved = !state.hideResolved;
                    savePrefs();
                    renderAll();
                    return;
                case "only-new":
                    state.onlyNew = newUnits.size > 0 && !state.onlyNew;
                    renderAll();
                    return;
                case "finish":
                    if (state.finish.open) closeFinish();
                    else openFinish();
                    return;
                case "finish-close":
                    closeFinish();
                    return;
                case "finish-submit":
                    submitFinish();
                    return;
                case "gh-check":
                    startGithubCheck();
                    return;
                case "gh-news-close":
                    $("gh-news").close();
                    return;
                case "contents-toggle":
                    state.contentsOpen = !state.contentsOpen;
                    renderSidebar();
                    return;
                case "goto":
                    gotoTarget(el.dataset.target);
                    return;
                case "goto-topic":
                    if (state.view !== "topic") {
                        state.view = "topic";
                        savePrefs();
                        renderAll();
                    }
                    gotoTarget(`topic-${el.dataset.gid}`);
                    return;
                case "goto-thread":
                    gotoThread(el.dataset.key);
                    return;
                case "goto-hunk":
                    gotoHunk(el.dataset.chunk, Number(el.dataset.hi), el.dataset.view);
                    return;
                case "toggle-chunk": {
                    const ch = state.chunkById.get(cid);
                    const viewed = ch && ch.units.length > 0 && ch.units.every((u) => state.viewed.has(u));
                    const set = viewed ? state.open : state.closed;
                    if (set.has(cid)) set.delete(cid);
                    else set.add(cid);
                    renderAll();
                    return;
                }
                case "chunk-viewed": {
                    const ch = state.chunkById.get(cid);
                    if (ch) setViewed(ch.units, el.checked, [cid]);
                    return;
                }
                case "topic-viewed": {
                    const gid = el.closest("[data-gid]").dataset.gid;
                    const chunks = state.chunks.filter((ch) => ch.gid === gid);
                    setViewed(chunks.flatMap((ch) => ch.units), el.checked, chunks.map((ch) => ch.id));
                    return;
                }
                case "file-menu":
                    openFileMenu(el);
                    return;
                case "gap": {
                    const a = Number(el.dataset.start), b = Number(el.dataset.end);
                    const range = el.dataset.dir === "down" ? [a, Math.min(b, a + EXPAND_STEP - 1)] : el.dataset.dir === "up" ? [Math.max(a, b - EXPAND_STEP + 1), b] : [a, b];
                    ((state.expanded[cid] ||= {})[el.dataset.gi] ||= []).push(range);
                    renderAll();
                    return;
                }
                case "plus": {
                    const fi = Number(sec.dataset.fi), side = el.dataset.side, n = Number(el.dataset.line);
                    const prev = state.selected;
                    const sel = selectLines(cid, side, n, e.shiftKey);
                    if (!rangeShown(cid, side, sel.startLine, sel.line)) {
                        toast("Show the hidden lines in this range first.");
                        return;
                    }
                    if (e.shiftKey && prev && prev.cid === cid && prev.side === side) {
                        const oldKey = composerKey({type: "line", path: files[fi].path, side, startLine: prev.startLine === prev.line ? null : prev.startLine, line: prev.line});
                        const old = state.composers.get(oldKey);
                        if (old && !old.text.trim() && old.chunkId === cid) state.composers.delete(oldKey);
                    }
                    openComposer({type: "line", chunkId: cid, fi, path: files[fi].path, side, line: sel.line, startLine: sel.startLine === sel.line ? null : sel.startLine});
                    return;
                }
                case "reply-note": {
                    const fi = Number(sec.dataset.fi), side = el.dataset.side, n = Number(el.dataset.line);
                    const note = files[fi].hunks[Number(el.dataset.hi)]?.lineNotes[`${side === "LEFT" ? "L" : "R"}${n}`] || "";
                    selectLines(cid, side, n, false);
                    openComposer({type: "line", chunkId: cid, fi, path: files[fi].path, side, line: n, startLine: null}, replyQuote(note));
                    return;
                }
                case "menu-comment": {
                    const m = state.menu;
                    closeMenu();
                    if (m && m.type === "line") openComposer({type: "line", chunkId: m.cid, fi: m.fi, path: files[m.fi].path, side: m.side, line: m.line, startLine: m.startLine === m.line ? null : m.startLine});
                    return;
                }
                case "menu-copy-link": {
                    const m = state.menu;
                    closeMenu();
                    if (m) copyText(m.url, "Link copied");
                    return;
                }
                case "menu-copy-path": {
                    const m = state.menu;
                    closeMenu();
                    if (m) copyText(files[m.fi].path, "Path copied");
                    return;
                }
                case "menu-file-comment": {
                    const m = state.menu;
                    closeMenu();
                    if (m) {
                        const cidFirst = firstChunkId(m.fi);
                        if (cidFirst) ensureChunkOpen(cidFirst);
                        openComposer({type: "file", fi: m.fi, path: files[m.fi].path});
                    }
                    return;
                }
                case "menu-close":
                    closeMenu();
                    return;
                case "open-general":
                    openComposer({type: "general"});
                    return;
                case "th-show":
                case "th-hide": {
                    const th = threadOf(el);
                    if (!th) return;
                    if (act === "th-show") state.showResolved.add(th.key);
                    else state.showResolved.delete(th.key);
                    renderAll();
                    return;
                }
                case "th-reply": {
                    const th = threadOf(el);
                    if (th && th.replyIds.length) openComposer({type: "reply", replyTo: th.replyIds[0]});
                    return;
                }
                case "th-resolve":
                case "th-unresolve": {
                    const th = threadOf(el);
                    if (th) setResolved(th, act === "th-resolve");
                    return;
                }
                case "th-send": {
                    const th = threadOf(el);
                    if (th && state.canComment) sendThread(th);
                    return;
                }
                case "cm-edit": {
                    const id = el.closest("[data-doc]").dataset.doc;
                    const d = docById(id);
                    if (d) openComposer({type: "edit", docId: id}, d.body);
                    const cp = state.composers.get(`edit|${id}`);
                    if (cp && !cp.text) cp.text = d.body;
                    return;
                }
                case "cm-delete":
                    state.confirmDelete = el.closest("[data-doc]").dataset.doc;
                    renderAll();
                    document.querySelector(`[data-doc="${CSS.escape(state.confirmDelete)}"] [data-act="cm-delete-no"]`)?.focus();
                    return;
                case "cm-delete-no":
                    state.confirmDelete = null;
                    renderAll();
                    return;
                case "cm-delete-yes":
                    deleteDoc(el.closest("[data-doc]").dataset.doc);
                    return;
                case "cp-tab":
                case "cp-suggest":
                case "cp-cancel":
                case "cp-save": {
                    const key = el.closest(".composer")?.dataset.ck;
                    const cp = key && state.composers.get(key);
                    if (!cp) return;
                    if (act === "cp-tab") {
                        cp.tab = el.dataset.tab;
                        renderAll();
                        if (cp.tab === "write") focusComposer(key);
                    } else if (act === "cp-suggest") insertSuggestion(cp);
                    else if (act === "cp-cancel") closeComposer(key);
                    else saveComposer(key);
                    return;
                }
                case "copy":
                    copyText(el.dataset.copy || "", "Suggestion copied");
                    return;
                case "draft-copy":
                case "draft-discard": {
                    const key = el.closest("[data-draft]")?.dataset.draft;
                    const saved = key && state.unplaced.get(key);
                    if (!saved) return;
                    if (act === "draft-copy") copyText(saved.text, "Draft copied");
                    else {
                        state.unplaced.delete(key);
                        persistDrafts();
                        renderAll();
                    }
                    return;
                }
                case "notice-copy":
                    copyText($("notice").querySelector("textarea").value);
                    return;
                case "notice-close":
                    $("notice").hidden = true;
                    return;
                default:
            }
        }

        function insertSuggestion(cp) {
            const lines = anchorLines(composerAnchor(cp));
            if (!lines) return;
            const block = `\`\`\`suggestion\n${lines.join("\n")}\n\`\`\`\n`;
            const ta = document.querySelector(`textarea[data-ck="${CSS.escape(cp.key)}"]`);
            if (cp.tab !== "write" || !ta) {
                cp.text += `${cp.text && !cp.text.endsWith("\n") ? "\n" : ""}${block}`;
                cp.tab = "write";
                renderAll();
                focusComposer(cp.key);
            } else {
                const at = ta.selectionStart ?? ta.value.length;
                const before = ta.value.slice(0, at), after = ta.value.slice(ta.selectionEnd ?? at);
                const insert = `${before && !before.endsWith("\n") ? "\n" : ""}${block}`;
                ta.value = before + insert + after;
                cp.text = ta.value;
                ta.focus();
                ta.setSelectionRange(before.length + insert.length, before.length + insert.length);
            }
            persistDrafts();
        }

        async function setResolved(t, resolved) {
            if (!state.db || state.busy.has(t.key)) return;
            state.busy.add(t.key);
            renderAll();
            const at = nowIso();
            try {
                if (t.source === "db") await state.db.doc(`comments/${t.id}`).update(resolved ? {resolved: true, resolvedBy: state.me, resolvedAt: at} : {resolved: false, resolvedBy: null, resolvedAt: null});
                else await state.db.doc(`ghthreads/${t.id}`).set({v: 1, resolved, by: state.me, at, synced: false});
                if (resolved) state.showResolved.delete(t.key);
                toast(resolved ? "Conversation resolved" : "Conversation reopened");
            } catch (err) {
                writeFailed(err, false);
            }
            state.busy.delete(t.key);
            renderAll();
        }

        async function deleteDoc(id) {
            const d = docById(id);
            state.confirmDelete = null;
            if (!d) return renderAll();
            try {
                if (!d.replyTo) {
                    for (const r of state.docs) if (r.replyTo === id && r.author === state.me && r.status === "draft") await state.db.doc(`comments/${r.id}`).delete();
                }
                await state.db.doc(`comments/${id}`).delete();
                state.composers.delete(`edit|${id}`);
                persistDrafts();
                toast("Comment deleted");
            } catch {
                toast("Could not delete. Try again.", "error");
            }
            renderAll();
        }

        document.addEventListener("input", (e) => {
            const t = e.target;
            if (t.matches?.("textarea[data-ck]")) {
                const cp = state.composers.get(t.dataset.ck);
                if (cp) {
                    cp.text = t.value;
                    persistDrafts();
                }
            } else if (t.id === "fin-body") state.finish.body = t.value;
        });

        document.addEventListener("change", (e) => {
            const t = e.target;
            if (t.name === "fin-target") {
                state.finish.target = t.value;
                renderFinish();
                $(`fin-t-${t.value}`)?.focus();
            } else if (t.name === "fin-event") state.finish.event = t.value;
            else if (t.dataset?.finItem) {
                state.finish.sel.set(t.dataset.finItem, t.checked);
                renderFinish();
                $(t.id)?.focus();
            }
        });

        document.addEventListener("toggle", (e) => {
            const key = e.target?.dataset?.dkey;
            if (!key || e.target.open === state.details.has(key)) return;
            if (e.target.open) state.details.add(key);
            else state.details.delete(key);
            // The reader changed it, not render: drop the cached HTML so the next render keeps this state
            blockHtml.delete("w-conv");
        }, true);

        function closeOverlays() {
            if (!menu.hidden) {
                closeMenu();
                return true;
            }
            if (!peek.hidden) {
                peek.hidden = true;
                return true;
            }
            if (state.finish.open) {
                closeFinish();
                return true;
            }
            if (!hoverCard.hidden) {
                hoverCard.hidden = true;
                return true;
            }
            if (!$("notice").hidden) {
                $("notice").hidden = true;
                return true;
            }
            const ta = document.activeElement?.closest?.("textarea[data-ck]");
            if (ta) {
                const cp = state.composers.get(ta.dataset.ck);
                if (cp && !cp.text.trim()) {
                    closeComposer(cp.key);
                    return true;
                }
                ta.blur();
                return true;
            }
            if (state.selected) {
                state.selected = null;
                applySelection();
                return true;
            }
            if (narrow.matches && state.contentsOpen) {
                state.contentsOpen = false;
                renderSidebar();
                return true;
            }
            return false;
        }

        document.addEventListener("keydown", (e) => {
            const t = e.target instanceof Element ? e.target : null;
            // The open GitHub popup is modal: Esc closes it, and no page shortcut runs behind it
            if ($("gh-news").open) return;
            if (e.key === "Escape") {
                if (closeOverlays()) e.preventDefault();
                return;
            }
            const ta = t && t.closest("textarea[data-ck]");
            if (ta && e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
                e.preventDefault();
                saveComposer(ta.dataset.ck);
                return;
            }
            if ((t && t.closest("textarea, input, select, [contenteditable]")) || e.metaKey || e.ctrlKey || e.altKey) return;
            if (e.key === "Enter" && t && t.matches("td.n[data-line]")) {
                e.preventDefault();
                openLineMenu(t, e.shiftKey);
                return;
            }
            switch (e.key) {
                case "j":
                case "k":
                    stepTo("#content tr.note", e.key === "j" ? 1 : -1, FHEAD_EXTRA);
                    break;
                case "n":
                case "p":
                    stepTo("#content .file", e.key === "n" ? 1 : -1, 0);
                    break;
                case "]":
                case "[":
                    stepTo("#content .thread.is-open, #w-dyn .thread.is-open", e.key === "]" ? 1 : -1, FHEAD_EXTRA);
                    break;
                case "v": {
                    const cur = currentChunkEl();
                    const ch = cur && state.chunkById.get(cur.id);
                    if (!ch) break;
                    const on = !(ch.units.length > 0 && ch.units.every((u) => state.viewed.has(u)));
                    setViewed(ch.units, on, [ch.id]);
                    if (on) {
                        const list = [...document.querySelectorAll("#content .file")];
                        const next = list[list.findIndex((x) => x.id === ch.id) + 1];
                        if (next) scrollToEl(next, 0, false);
                    }
                    break;
                }
                case "u":
                case "s":
                    state.mode = e.key === "u" ? "unified" : "split";
                    savePrefs();
                    renderAll();
                    break;
                case "t":
                    state.view = state.view === "topic" ? "file" : "topic";
                    savePrefs();
                    renderAll();
                    break;
                default:
                    return;
            }
            e.preventDefault();
        });

        narrow.addEventListener("change", () => renderAll());
        const mainEl = $("main");
        const syncSizes = () => {
            document.documentElement.style.setProperty("--main-w", `${mainEl.clientWidth}px`);
            document.documentElement.style.setProperty("--tb-h", `${$("tbar-wrap").offsetHeight}px`);
        };
        if (window.ResizeObserver) {
            const ro = new ResizeObserver(syncSizes);
            ro.observe(mainEl);
            ro.observe($("tbar-wrap"));
        }
        addEventListener("resize", syncSizes);

        // ---- start: everything from DATA first, then the capabilities light up ----
        renderHeader();
        renderWalkStatic();
        if (DATA.diagram) {
            drawDiagram();
            matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawDiagram);
            new MutationObserver(drawDiagram).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
        }
        if (typeof window.claude?.use !== "function") state.dbState = "none";
        renderAll();
        syncSizes();

        (async () => {
            if (state.dbState === "none") return;
            const use = (name) => Promise.resolve().then(() => window.claude.use(name)).catch(() => null);
            use("room").then((room) => {
                state.room = room;
                if (room) {
                    refreshChannel();
                    schedulePresence();
                }
            });
            use("comments").then((comments) => {
                state.comments = comments;
                if (comments) refreshChannel();
            });
            const [db, user] = await Promise.all([use("db"), use("user")]);
            state.user = user;
            if (!db) {
                state.dbState = "none";
                renderAll();
                return;
            }
            state.db = db;
            if (user) {
                const [me, canWrite] = await Promise.all([
                    Promise.resolve().then(() => user.id()).catch(() => null),
                    Promise.resolve().then(() => user.can("data.write")).catch(() => null),
                ]);
                state.me = me;
                state.canWrite = canWrite;
            }
            state.dbState = "ready";
            subscribe();
            renderAll();
        })();

        function refreshProfiles() {
            if (!state.user) return;
            const ids = new Set(state.me ? [state.me] : []);
            for (const d of state.docs) if (d.author !== "claude") ids.add(d.author);
            for (const b of state.batches) if (typeof b.author === "string" && b.author !== "claude") ids.add(b.author);
            for (const g of state.ghdocs.values()) if (typeof g.by === "string" && g.by !== "claude") ids.add(g.by);
            const list = [...ids];
            if (!list.length) return;
            Promise.resolve().then(() => state.user.profiles(list)).then((found) => {
                let changed = false;
                for (const [id, p] of Object.entries(found || {})) {
                    const old = state.profiles[id];
                    if (!old || old.name !== p.name || old.avatarUrl !== p.avatarUrl) {
                        state.profiles[id] = p;
                        changed = true;
                    }
                }
                if (changed) scheduleRender();
            }).catch(() => {
                // Names are optional: "Someone" is shown
            });
        }

        // Codes that end a listener for good. "unavailable" and unknown codes mean the platform bridge stopped:
        // only a new subscription recovers, so the page subscribes once more (db.d.ts)
        const FINAL_DB_CODES = ["invalid_argument", "resource_exhausted", "quota_exceeded", "revoked", "not_granted", "capability_disabled", "capability_removed", "transform_error"];

        function listen(query, next) {
            let retried = false;
            const start = () => query().onSnapshot((snap) => {
                retried = false;
                next(snap);
            }, (err) => {
                if (!retried && !FINAL_DB_CODES.includes(err && err.code)) {
                    retried = true;
                    setTimeout(start, 500 + Math.random() * 1000);
                    return;
                }
                state.dbState = "error";
                updateCanComment();
                scheduleRender();
            });
            start();
        }

        function subscribe() {
            const db = state.db;
            listen(() => db.collection("comments").orderBy("createdAt"), (snap) => {
                state.docs = snap.docs.map((d) => ({...d.data(), id: d.id})).filter(validDoc);
                state.loaded.comments = true;
                if (state.confirmDelete && !docById(state.confirmDelete)) state.confirmDelete = null;
                updateCanComment();
                restoreComposers();
                refreshProfiles();
                scheduleRender();
            });
            listen(() => db.collection("batches").orderBy("createdAt", "desc").limit(20), (snap) => {
                state.batches = snap.docs.map((d) => ({...d.data(), id: d.id})).filter((b) => b && b.v === 1);
                state.loaded.batches = true;
                followGithubCheck();
                refreshProfiles();
                scheduleRender();
            });
            listen(() => db.collection("ghthreads"), (snap) => {
                state.ghdocs = new Map(snap.docs.map((d) => [d.id, d.data()]).filter(([, g]) => g && g.v === 1));
                state.loaded.ghthreads = true;
                scheduleRender();
            });
        }

        document.addEventListener("visibilitychange", () => {
            if (!document.hidden && (state.room || state.comments)) refreshChannel();
        });
    })();
</script>
