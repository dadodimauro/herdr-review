            let line = a.line, start = a.startLine ?? null;
            if (d.buildId !== DATA.buildId && blob[line - 1] !== d.lineText) {
                const found = findNear(blob, d.lineText, line);
                if (found === null) return {...base, place: "outdated"};
                if (start !== null) start += found - line;
                line = found;
            }
            if (line > blob.length) return {...base, place: "outdated"};
            if (start !== null && (start < 1 || start >= line)) start = null;
            return {...base, place: "line", line, startLine: start};
        }

        function ghResolved(g, doc) {
            if (!doc) return Boolean(g.resolved);
            if (doc.synced === false) return Boolean(doc.resolved);
            // A synced doc is older than a page built after it: the build has the newer state
            return Date.parse(DATA.builtAt) > Date.parse(doc.at) ? Boolean(g.resolved) : Boolean(doc.resolved);
        }

        function placeThreads() {
            const roots = [], replies = new Map();
            for (const d of state.docs) {
                if (d.replyTo) {
                    if (!replies.has(d.replyTo)) replies.set(d.replyTo, []);
                    replies.get(d.replyTo).push(d);
                } else roots.push(d);
            }
            const byTime = (a, b) => String(a.createdAt).localeCompare(String(b.createdAt));
            for (const list of replies.values()) list.sort(byTime);
            const threads = [];
            const queued = new Set();
            for (const b of state.batches) {
                if (b.status === "pending" || b.status === "working") for (const id of [...asList(b.resolveGithub), ...asList(b.unresolveGithub)]) queued.add(id);
            }
            // A page comment that Claude posted comes back from GitHub after a rebuild: it shows once, as that GitHub thread
            const ghIds = new Set((github?.threads || []).map((g) => String(g.id)));
            const posted = new Map();
            for (const d of roots) {
                const gid = d.githubId == null ? "" : String(d.githubId);
                if (gid && ghIds.has(gid) && !posted.has(gid)) {
                    posted.set(gid, d);
                    continue;
                }
                const t = {key: `db:${d.id}`, source: "db", id: d.id, doc: d, kind: d.kind, anchorType: d.anchor.type, replies: replies.get(d.id) || [], replyIds: [d.id], resolved: Boolean(d.resolved), createdAt: d.createdAt || ""};
                replies.delete(d.id);
                if (d.anchor.type === "general") t.place = "general";
                else {
                    const f = fileByPath.get(d.anchor.path);
                    if (!f) Object.assign(t, {place: "lost", path: d.anchor.path, side: d.anchor.side, storedLine: d.anchor.line});
                    else if (d.anchor.type === "file") Object.assign(t, {place: "file", fi: f.fi, path: f.path});
                    else Object.assign(t, placeLine(f, d));
                }
                threads.push(t);
            }
            for (const g of github?.threads || []) {
                const id = String(g.id);
                const doc = state.ghdocs.get(id) || null;
                const root = posted.get(id) || null;
                // Page replies to the GitHub thread and to the posted root. A reply that Claude posted is a GitHub comment now.
                const ghCommentIds = new Set((g.comments || []).map((c) => String(c.id)));
                const own = [...(replies.get(`gh:${id}`) || []), ...(root ? replies.get(root.id) || [] : [])]
                    .filter((r) => r.githubId == null || !ghCommentIds.has(String(r.githubId))).sort(byTime);
                const t = {key: `gh:${id}`, source: "gh", id, gh: g, doc: root, kind: root && root.kind === "finding" ? "finding" : "github", anchorType: g.file ? "file" : "line", replies: own, replyIds: [`gh:${id}`, ...(root ? [root.id] : [])], createdAt: g.comments?.[0]?.at || ""};
                replies.delete(`gh:${id}`);
                if (root) replies.delete(root.id);
                t.resolved = ghResolved(g, doc);
                t.ghPending = Boolean(doc && doc.synced === false && Boolean(doc.resolved) !== Boolean(g.resolved));
                t.ghQueued = t.ghPending && queued.has(id);
                const f = fileByPath.get(g.path);
                const blob = f && sideBlob(f, g.side);
                if (f && g.file) Object.assign(t, {place: "file", fi: f.fi, path: f.path});
                else if (f && blob && Number.isInteger(g.line) && g.line >= 1 && g.line <= blob.length) {
                    const start = Number.isInteger(g.startLine) && g.startLine >= 1 && g.startLine < g.line ? g.startLine : null;
                    Object.assign(t, {place: "line", fi: f.fi, path: f.path, side: g.side === "LEFT" ? "LEFT" : "RIGHT", line: g.line, startLine: start});
                } else Object.assign(t, {place: "ghconv", path: g.path, side: g.side, storedLine: g.line});
                threads.push(t);
            }
            // Replies whose thread is gone still show, so no comment is lost
            for (const [to, list] of replies) {
                threads.push({key: `orphan:${to}`, source: "orphan", id: to, kind: "comment", anchorType: "general", replies: list, replyIds: [], resolved: false, place: "lost", createdAt: list[0].createdAt || ""});
            }
            state.threads = threads;
            state.lineIndex = new Map();
            state.fileIndex = new Map();
            state.outdatedIndex = new Map();
            state.general = [];
            state.lost = [];
            state.ghconv = [];
            const push = (map, key, t) => {
                if (!map.has(key)) map.set(key, []);
                map.get(key).push(t);
            };
            for (const t of threads) {
                if (t.place === "line") push(state.lineIndex, `${t.fi}|${t.side}|${t.line}`, t);
                else if (t.place === "file") push(state.fileIndex, t.fi, t);
                else if (t.place === "outdated") push(state.outdatedIndex, t.fi, t);
                else if (t.place === "general") state.general.push(t);
                else if (t.place === "ghconv") state.ghconv.push(t);
                else state.lost.push(t);
            }
        }

        // A thread with an open reply or edit box stays open and in view, also when someone resolves it meanwhile
        const hasComposer = (t) => t.replyIds.some((to) => state.composers.has(`reply|${to}`)) || threadDocs(t).some((d) => state.composers.has(`edit|${d.id}`));
        const visibleThread = (t) => !(t.resolved && state.hideResolved) || hasComposer(t);

        function ownerChunk(t) {
            if (t.place === "line") return chunkIdForLine(t.fi, t.side, t.line);
            if (t.place === "file") return firstChunkId(t.fi);
            if (t.place === "outdated") return chunkIdForLine(t.fi, t.side, t.storedLine);
            return null;
        }

        // Which chunk owns each thread, which lines must be shown, open thread counts
        function computeOwners() {
            const forced = new Map(), open = new Map(), composerAt = new Map();
            const force = (cid, side, from, to) => {
                if (!forced.has(cid)) forced.set(cid, []);
                // A long range shows its last lines: the card hangs under the last one
                for (let n = Math.max(from, to - 60); n <= to; n++) forced.get(cid).push({side, line: n});
            };
            for (const t of state.threads) {
                if (t.place !== "line" && t.place !== "file" && t.place !== "outdated") continue;
                t.chunk = ownerChunk(t);
                if (!t.chunk || !state.chunkById.has(t.chunk)) {
                    // Never drop a thread: without a chunk it shows with the outdated comments
                    t.chunk = null;
                    state.lost.push(t);
                    continue;
                }
                if (!t.resolved) open.set(t.chunk, (open.get(t.chunk) || 0) + 1);
                if (t.place === "line" && visibleThread(t)) force(t.chunk, t.side, t.startLine ?? t.line, t.line);
            }
            for (const cp of state.composers.values()) {
                if (cp.type !== "line") continue;
                // A composer opened in the other view goes to the chunk of its line in this view
                const cid = state.chunkById.has(cp.chunkId) ? cp.chunkId : chunkIdForLine(cp.fi, cp.side, cp.line);
                if (!state.chunkById.has(cid)) continue;
                force(cid, cp.side, cp.startLine ?? cp.line, cp.line);
                const key = `${cid}|${cp.side}|${cp.line}`;
                if (!composerAt.has(key)) composerAt.set(key, []);
                composerAt.get(key).push(cp);
            }
            for (const [cid, list] of Object.entries(state.reveals)) for (const r of list) force(cid, r.side, r.line, r.line);
            state.forced = forced;
            state.openCount = open;
            state.composerAt = composerAt;
        }

        // ---- diff rows (create-diff buildRows/pushGap, per chunk) ----
        function buildRows(ch) {
            const f = files[ch.fi];
            const rows = [];
            const exp = state.expanded[ch.id] || {};
            const forced = state.forced.get(ch.id) || [];
            const shown = shownHunks(ch);
            const H = f.hunks;
            let prevNew = 0, prevOld = 0, i = 0;
            while (i < H.length) {
                const h = H[i];
                pushGap(rows, f, i, prevNew + 1, h.newFirst - 1, h.newFirst - h.oldFirst, i === 0 ? "top" : "mid", exp, forced);
                if (shown.has(i)) {
                    rows.push({type: "note", hi: i});
                    let o = h.oldStart, w = h.newStart;
                    for (const [kind, text] of h.lines) {
                        if (kind === "add") rows.push({type: "line", kind, text, old: null, neu: w++, hi: i});
                        else if (kind === "del") rows.push({type: "line", kind, text, old: o++, neu: null, hi: i});
                        else rows.push({type: "line", kind: "ctx", text, old: o++, neu: w++, hi: i});
                    }
                    prevNew = h.newLast;
                    prevOld = h.oldLast;
                    i++;
                    continue;
                }
                // Hunks not shown here: one row per run, "1 change here is in topic 4: Tests"
                const why = ch.hunks.has(i) ? "seen" : "topic";
                let j = i;
                while (j + 1 < H.length && !shown.has(j + 1) && (ch.hunks.has(j + 1) ? "seen" : "topic") === why && (why === "seen" || H[j + 1].group === h.group)) j++;
                rows.push({type: "other", from: i, to: j, why, gid: h.group});
                prevNew = H[j].newLast;
                prevOld = H[j].oldLast;
                i = j + 1;
            }
            const nb = blobLines(f.newBlob), ob = blobLines(f.oldBlob);
            const total = nb ? nb.length : ob ? ob.length + (prevNew - prevOld) : 0;
            pushGap(rows, f, H.length, prevNew + 1, total, prevNew - prevOld, H.length ? "bottom" : "whole", exp, forced);
            return rows;
        }

        // A gap is in new-side numbers. It opens by ranges the reader asked for, and around lines that hold threads.
        function pushGap(rows, f, gi, start, end, delta, where, exp, forced) {
            if (end < start) return;
            const size = end - start + 1;
            const visible = new Uint8Array(size);
            for (const [a, b] of exp[gi] || []) for (let n = Math.max(a, start); n <= Math.min(b, end); n++) visible[n - start] = 1;
            const wanted = forced.map(({side, line}) => (side === "LEFT" ? line + delta : line)).filter((n) => n >= start && n <= end);
            if (wanted.length) {
                if (size <= SMALL_GAP) visible.fill(1);
                else for (const n of wanted) for (let k = n - AROUND; k <= n + AROUND; k++) if (k >= start && k <= end) visible[k - start] = 1;
            }
            const nb = blobLines(f.newBlob), ob = blobLines(f.oldBlob);
            const textAt = (n) => (nb ? nb[n - 1] : ob ? ob[n - delta - 1] : "") ?? "";
            const total = nb ? nb.length : ob ? ob.length + delta : end;
            let n = start;
            while (n <= end) {
                if (visible[n - start]) {
                    rows.push({type: "line", kind: "ctx", text: textAt(n), old: n - delta, neu: n, gap: true});
                    n++;
                    continue;
                }
                let m = n;
                while (m < end && !visible[m + 1 - start]) m++;
                const below = m < end || where === "top" || where === "mid";
                const above = n > start || where === "mid" || where === "bottom" || where === "whole";
                rows.push({type: "gap", gi, start: n, end: m, hidden: m - n + 1, down: above, up: below, scope: below ? enclosingDefinition(textAt, m + 1, total) : ""});
                n = m + 1;
            }
        }

        function numCell(side, n, cls) {
            return `<td class="n ${cls}" data-side="${side}" data-line="${n}" tabindex="0">${n}</td>`;
        }

        function plusBtn(side, n) {
            return state.canComment ? `<button type="button" class="plus-btn" data-act="plus" data-side="${side}" data-line="${n}" tabindex="-1" aria-label="Comment on line ${n}">+</button>` : "";
        }

        function codeCell(f, r, side, cls, withPlus = true) {
            let blobId, line;
            if (r.gap) [blobId, line] = f.newBlob ? [f.newBlob, r.neu] : [f.oldBlob, r.old];
            else [blobId, line] = side === "LEFT" ? [f.oldBlob, r.old] : [f.newBlob, r.neu];
            return `<td class="c ${cls}">${withPlus ? plusBtn(side, side === "LEFT" ? r.old : r.neu) : ""}${renderCode(r.text, blobId, line)}</td>`;
        }

        function rowAttrs(f, oldRow, newRow) {
            const hi = (oldRow || newRow).hi;
            return ` data-path="${esc(f.path)}"${oldRow && oldRow.old != null ? ` data-old="${oldRow.old}"` : ""}${newRow && newRow.neu != null ? ` data-new="${newRow.neu}"` : ""}${hi != null ? ` data-hi="${hi}"` : ""}`;
        }

        const EMPTY_CELLS = `<td class="n empty"></td><td class="c empty"></td>`;

        function unifiedRow(f, r) {
            const cls = r.kind === "ctx" ? "" : r.kind;
            const side = r.kind === "del" ? "LEFT" : "RIGHT";
            const left = r.old == null ? `<td class="n ${cls}"></td>` : side === "LEFT" ? numCell("LEFT", r.old, cls) : `<td class="n ${cls}">${r.old}</td>`;
            const right = r.neu == null ? `<td class="n ${cls}"></td>` : numCell("RIGHT", r.neu, cls);
            const sign = {add: "+", del: "−", ctx: ""}[r.kind];
            return `<tr class="ln ${cls}"${rowAttrs(f, r, r)}>${left}${right}<td class="s">${sign}</td>${codeCell(f, r, side, cls)}</tr>`;
        }

        function splitCtxRow(f, r) {
            const oldCell = r.gap ? codeCell(f, r, "RIGHT", "", false) : `<td class="c">${renderCode(r.text, f.oldBlob || f.newBlob, f.oldBlob ? r.old : r.neu)}</td>`;
            return `<tr class="ln"${rowAttrs(f, r, r)}><td class="n">${r.old}</td>${oldCell}${numCell("RIGHT", r.neu, "")}${codeCell(f, r, "RIGHT", "")}</tr>`;
        }

        function splitPairRow(f, d, a) {
            const left = d ? numCell("LEFT", d.old, "del") + codeCell(f, d, "LEFT", "del") : EMPTY_CELLS;
            const right = a ? numCell("RIGHT", a.neu, "add") + codeCell(f, a, "RIGHT", "add") : EMPTY_CELLS;
            return `<tr class="ln pair"${rowAttrs(f, d, a)}>${left}${right}</tr>`;
        }

        const rowKeys = (r) => (r.kind === "del" ? [["LEFT", r.old]] : r.kind === "add" ? [["RIGHT", r.neu]] : [["RIGHT", r.neu], ["LEFT", r.old]]);

        function noteRow(ch, f, hi) {
            const h = f.hunks[hi];
            const g = groupById.get(h.group);
            const chip = state.view === "file" && g ? `<a class="chip" href="#hk-ch-${g.id}-${f.fi}-${hi}" data-act="goto-hunk" data-view="topic" data-chunk="ch-${g.id}-${f.fi}" data-hi="${hi}">Topic: ${esc(g.title)}</a>` : "";
            const text = h.note || (f.note ? `<span class="muted">The file note above covers this change.</span>` : "");
            return `<tr class="note" id="hk-${ch.id}-${hi}" data-hi="${hi}"><td colspan="4"><div class="note-in stick"><span class="hl">Change ${hi + 1} of ${f.hunks.length} in this file</span>${newUnits.has(h.unit) ? `<span class="pill new">New</span>` : ""}${chip}<div class="note-text">${text}</div></div></td></tr>`;
        }

        function gapRow(r) {
            const btn = (dir, label, title) => `<button type="button" data-act="gap" data-gi="${r.gi}" data-start="${r.start}" data-end="${r.end}" data-dir="${dir}" title="${title}">${label}</button>`;
            const controls = r.hidden <= EXPAND_STEP
                ? btn("all", `Show ${plural(r.hidden, "line")}`, "Show every hidden line")
                : [
                    r.down ? btn("down", `↓ ${EXPAND_STEP} lines`, `Show ${EXPAND_STEP} more lines below`) : "",
                    r.up ? btn("up", `↑ ${EXPAND_STEP} lines`, `Show ${EXPAND_STEP} more lines above`) : "",
                    btn("all", `Show all ${r.hidden}`, "Show every hidden line"),
                ].join("");
            return `<tr class="gap"><td colspan="4"><div class="gap-ctl stick">${controls}<span class="scope" title="${esc(r.scope)}">${esc(r.scope)}</span><span class="hidden-count">${plural(r.hidden, "hidden line")} (${r.start}–${r.end})</span></div></td></tr>`;
        }

        function otherRow(f, r) {
            const n = r.to - r.from + 1;
            if (r.why === "seen") {
                return `<tr class="other"><td colspan="4"><div class="other-in stick">${plural(n, "change")} you saw before · <button type="button" class="linkish" data-act="only-new">Show all changes</button></div></td></tr>`;
            }
            const g = groupById.get(r.gid);
            const target = g ? `ch-${g.id}-${f.fi}` : `ch-other-${f.fi}`;
            const where = g ? `topic ${g.gi + 1}: ${esc(g.title)}` : "Other files";
            return `<tr class="other"><td colspan="4"><div class="other-in stick"><a href="#hk-${target}-${r.from}" data-act="goto-hunk" data-chunk="${target}" data-hi="${r.from}">${n} change${n === 1 ? " here is" : "s here are"} in ${where} ↗</a></div></td></tr>`;
        }

        function lineNoteRow(side, line, hi, html) {
            const reply = state.canComment ? `<button type="button" class="mini" data-act="reply-note" data-side="${side}" data-line="${line}" data-hi="${hi}">Reply</button>` : "";
            return `<tr class="lnote"><td colspan="4"><div class="lnote-in stick"><span class="claude-mark sm" aria-hidden="true"></span><span class="lbl">Note</span><div class="t">${html}</div>${reply}</div></td></tr>`;
        }

        // Rows under a line: Claude's line notes, then threads, then open composers
        function afterRows(ch, f, keys, hi) {
            const h = hi != null ? f.hunks[hi] : null;
            let html = "";
            const cards = [], composers = [];
            for (const [side, line] of keys) {
                const note = h && h.lineNotes[`${side === "LEFT" ? "L" : "R"}${line}`];
                if (note) html += lineNoteRow(side, line, hi, note);
                for (const t of state.lineIndex.get(`${f.fi}|${side}|${line}`) || []) if (visibleThread(t)) cards.push(t);
                composers.push(...(state.composerAt.get(`${ch.id}|${side}|${line}`) || []));
            }
            if (cards.length) html += `<tr class="trow"><td colspan="4"><div class="tcell stick">${cards.map((t) => threadCard(t, "line")).join("")}</div></td></tr>`;
            if (composers.length) html += `<tr class="crow"><td colspan="4"><div class="tcell stick">${composers.map(composerHtml).join("")}</div></td></tr>`;
            return html;
        }

        function renderTable(ch) {
            const f = files[ch.fi];
            const rows = buildRows(ch);
            const split = effectiveMode() === "split";
            const shown = {LEFT: new Set(), RIGHT: new Set()};
            let html = `<table class="diff ${split ? "split" : "unified"}"><colgroup>${split ? `<col class="cn"><col><col class="cn"><col>` : `<col class="cn"><col class="cn"><col class="cs"><col>`}</colgroup>`;
            let i = 0;
            while (i < rows.length) {
                const r = rows[i];
                if (r.type === "note") html += noteRow(ch, f, r.hi);
                else if (r.type === "gap") html += gapRow(r);
                else if (r.type === "other") html += otherRow(f, r);
                if (r.type !== "line") {
                    i++;
                    continue;
                }
                if (!split || r.kind === "ctx") {
                    if (r.old != null) shown.LEFT.add(r.old);
                    if (r.neu != null) shown.RIGHT.add(r.neu);
                    html += (split ? splitCtxRow(f, r) : unifiedRow(f, r)) + afterRows(ch, f, rowKeys(r), r.hi);
                    i++;
                    continue;
                }
                const dels = [], adds = [];
                while (i < rows.length && rows[i].type === "line" && rows[i].kind === "del") dels.push(rows[i++]);
                while (i < rows.length && rows[i].type === "line" && rows[i].kind === "add") adds.push(rows[i++]);
                for (const d of dels) shown.LEFT.add(d.old);
                for (const a of adds) shown.RIGHT.add(a.neu);
                for (let j = 0; j < Math.max(dels.length, adds.length); j++) {
                    const d = dels[j], a = adds[j];
                    const keys = [...(d ? [["LEFT", d.old]] : []), ...(a ? [["RIGHT", a.neu]] : [])];
                    html += splitPairRow(f, d, a) + afterRows(ch, f, keys, (d || a).hi);
                }
            }
            state.shown.set(ch.id, shown);
            return `${html}</table>`;
        }

        // ---- thread cards ----
        function nameOf(id) {
            if (id === "claude") return "Claude";
            const p = state.profiles[id];
            return (p && p.name) || (id && id === state.me ? "You" : "Someone");
        }

        function avatarHtml(id) {
            if (id === "claude") return `<span class="av claude-mark" aria-hidden="true"></span>`;
            const url = state.profiles[id]?.avatarUrl;
            return url ? `<img class="av" alt="" src="${esc(url)}">` : `<span class="av blank" aria-hidden="true"></span>`;
        }

        function statusPill(d, isRoot) {
            const claude = d.author === "claude";
            if (d.status === "draft") return claude ? "" : `<span class="pill draft">Draft · not sent</span>`;
            if (d.status === "handled" && claude && !isRoot) return "";
            if (d.status === "posted") {
                return GITHUB_URL.test(d.githubUrl || "") ? `<a class="pill posted" href="${esc(d.githubUrl)}" target="_blank" rel="noopener">On GitHub ↗</a>` : `<span class="pill posted">On GitHub</span>`;
            }
            const label = {to_claude: "Sent to Claude", handled: "Handled by Claude", to_github: "Waiting for GitHub"}[d.status];
            return label ? `<span class="pill st-${d.status}">${label}</span>` : "";
        }

        function currentLines(t) {
            if (t.side !== "RIGHT") return null;
            if (t.place === "line") {
                const blob = blobLines(files[t.fi].newBlob);
                return blob ? blob.slice((t.startLine ?? t.line) - 1, t.line) : null;
            }
            const sn = t.doc?.snippet, a = t.doc?.anchor;
            if (sn && a && Array.isArray(sn.lines) && Number.isInteger(sn.start)) {
                const from = (a.startLine ?? a.line) - sn.start, to = a.line - sn.start + 1;
                if (from >= 0 && to <= sn.lines.length) return sn.lines.slice(from, to).map(String);
            }
            return null;
        }

        function threadDocs(t) {
            return [...(t.source === "db" ? [t.doc] : []), ...t.replies];
        }

        const SENT = ["to_claude", "to_github"];
        const onGithub = (d) => d.status === "posted" || Boolean(d.githubUrl) || d.githubId != null;
        // Without a draft of the viewer, a thread goes to Claude by itself only when it is a finding not sent and not on GitHub
        const sendsAlone = (t) => t.source === "db" && t.kind === "finding" && !SENT.includes(t.doc.status) && !onGithub(t.doc);

        function dbComment(d, t, isRoot) {
            const editing = state.composers.get(`edit|${d.id}`);
            if (editing) return `<div class="cm editing" data-doc="${esc(d.id)}">${composerHtml(editing)}</div>`;
            const mine = d.author !== "claude" && d.author === state.me;
            let actions = "";
            if (mine && d.status === "draft" && state.canComment) {
                if (state.confirmDelete === d.id) {
                    actions = `<span class="confirm" role="group" aria-label="Confirm delete">Delete this comment? <button type="button" class="mini danger" data-act="cm-delete-yes">Delete</button><button type="button" class="mini" data-act="cm-delete-no">Keep</button></span>`;
                } else {
                    const othersReplied = isRoot && t.replies.some((r) => r.author !== state.me);
                    actions = `<span class="cm-actions"><button type="button" class="mini" data-act="cm-edit">Edit</button><button type="button" class="mini" data-act="cm-delete"${othersReplied ? ` disabled title="Others replied to this comment"` : ""}>Delete</button></span>`;
                }
            }
            const finding = isRoot && d.kind === "finding"
                ? `<div class="fd-head"><span class="sev ${severityOf(d)}">${SEVERITY_LABEL[severityOf(d)]}</span>${d.category ? `<span class="cat">${esc(d.category)}</span>` : ""}<b class="fd-title">${esc(d.title || "")}</b></div>` : "";
            const ctx = {inLine: t.place === "line" || t.place === "outdated", current: currentLines(t)};
            const suggestion = isRoot && d.kind === "finding" && typeof d.suggestion === "string" && d.suggestion !== "" ? suggestionBlock(d.suggestion.split("\n"), ctx.current) : "";
            return `<div class="cm" data-doc="${esc(d.id)}">${avatarHtml(d.author)}<div class="cm-main"><div class="cm-head"><b class="nm">${esc(nameOf(d.author))}</b>${d.author === "claude" ? `<span class="pill ai">AI</span>` : ""}<time class="ago" datetime="${esc(d.createdAt || "")}" title="${esc(fullDate(d.createdAt))}"></time>${d.updatedAt ? `<span class="muted" title="${esc(fullDate(d.updatedAt))}">edited</span>` : ""}${statusPill(d, isRoot)}${actions}</div>${finding}<div class="cm-body md">${mdOnce(d.body, ctx)}</div>${suggestion}</div></div>`;
        }

        function ghComment(c) {
            const login = String(c.author || "?");
            return `<div class="cm gh"><span class="av gh-av" aria-hidden="true">${esc(login.slice(0, 1).toUpperCase())}</span><div class="cm-main"><div class="cm-head"><b class="nm">${esc(login)}</b>${c.bot ? `<span class="pill">bot</span>` : ""}<time class="ago" datetime="${esc(c.at || "")}" title="${esc(fullDate(c.at))}"></time>${GITHUB_URL.test(c.url || "") ? `<a href="${esc(c.url)}" target="_blank" rel="noopener" aria-label="Open this comment on GitHub">↗</a>` : ""}</div><div class="cm-body md">${mdOnce(c.body || "", {inLine: false})}</div></div></div>`;
        }

        function threadTitle(t) {
            const p = t.side === "LEFT" ? "L" : "R";
            if (t.source === "orphan") return "Replies to a deleted comment";
            if (t.anchorType === "general") return "General comment";
            if (t.anchorType === "file") return "Comment on the file";
            if (t.place === "line") return t.startLine ? `Comment on lines ${p}${t.startLine}–${p}${t.line}` : `Comment on line ${p}${t.line}`;
            const a = t.doc?.anchor;
            if (a?.startLine) return `Comment on lines ${p}${a.startLine}–${p}${a.line}`;
            return t.storedLine ? `Comment on line ${p}${t.storedLine}` : "Comment on a line";
        }

        function snippetBox(t) {
            const sn = t.doc?.snippet, a = t.doc?.anchor;
            if (sn && a && Array.isArray(sn.lines) && Number.isInteger(sn.start)) {
                const first = a.startLine ?? a.line;
                return `<div class="snip"><table>${sn.lines.map((l, i) => {
                    const n = sn.start + i;
                    return `<tr class="${n >= first && n <= a.line ? "on" : ""}"><td class="n">${n}</td><td class="c">${esc(l) || " "}</td></tr>`;
                }).join("")}</table></div>`;
            }
            const text = t.doc?.lineText ?? t.gh?.lineText;
            return typeof text === "string" ? `<div class="snip"><table><tr class="on"><td class="n">${esc(t.storedLine ?? "")}</td><td class="c">${esc(text) || " "}</td></tr></table></div>` : "";
        }

        function threadCard(t, where) {
            const collapsed = t.resolved && !state.showResolved.has(t.key) && !hasComposer(t);
            const finding = t.kind === "finding";
            const cls = `thread${finding ? ` finding sev-${severityOf(t.doc)}` : ""}${t.resolved ? " resolved" : " is-open"}${collapsed ? " collapsed" : ""}`;
            // A GitHub thread that was posted from the page shows its first comment from the page: severity, title and suggestion stay
            const ghList = t.source === "gh" ? t.gh.comments || [] : [];
            const first = t.doc || ghList[0] || t.replies[0];
            const firstName = t.doc || t.source !== "gh" ? nameOf(first?.author) : first?.author || "";
            const excerpt = first ? `${firstName}: ${finding ? t.doc.title || "" : String(first.body || "").replace(/\s+/g, " ").slice(0, 120)}` : "";
            const ghLink = t.source === "gh" && GITHUB_URL.test(t.gh.url || "") ? `<a href="${esc(t.gh.url)}" target="_blank" rel="noopener">View on GitHub ↗</a>` : "";
            const head = `<div class="th-head"><span class="th-title">${esc(threadTitle(t))}</span>`
                + (t.source === "gh" ? `<span class="pill gh">GitHub</span>` : "")
                + (t.place === "outdated" || t.gh?.outdated ? `<span class="pill">Outdated</span>` : "")
                + (t.resolved ? `<span class="pill ok">Resolved</span>` : "")
                + (t.ghPending ? (t.ghQueued ? `<span class="pill st-to_github">Waiting for GitHub</span>` : `<span class="pill warn">Syncs to GitHub on the next post</span>`) : "")
                + (collapsed ? `<span class="excerpt">${esc(excerpt)}</span>` : "")
                + `<span class="push"></span>${ghLink}`
                + (t.resolved ? `<button type="button" class="linkish" data-act="${collapsed ? "th-show" : "th-hide"}">${collapsed ? "Show" : "Hide"}</button>` : "")
                + `</div>`;
            if (collapsed) return `<div class="${cls}" data-thread="${esc(t.key)}">${head}</div>`;
            let loc = "";
            if (where !== "line") {
                const line = t.place === "line" ? `${t.startLine ? `${t.startLine}–` : ""}${t.line}` : t.storedLine ?? "";
                if (t.path) loc = `<div class="th-loc">${esc(t.path)}${line !== "" ? `:${esc(line)}` : ""}${t.place === "outdated" || t.place === "lost" ? " · was here when the comment was written" : ""}</div>`;
                if (t.place === "outdated" || t.place === "lost" || t.place === "ghconv") loc += snippetBox(t);
            }
            const comments = [...(t.doc ? [dbComment(t.doc, t, true)] : []), ...ghList.slice(t.doc ? 1 : 0).map(ghComment), ...t.replies.map((d) => dbComment(d, t, false))].join("");
            let foot = "";
            if (state.canComment && t.source !== "orphan") {
                const composer = t.replyIds.map((to) => state.composers.get(`reply|${to}`)).find(Boolean);
                const drafts = threadDocs(t).filter((d) => d.author === state.me && d.status === "draft");
                const canSend = drafts.length > 0 || sendsAlone(t);
                const why = canSend ? "Claude reads this thread now and answers in it" : t.source === "db" && SENT.includes(t.doc.status) ? "Claude has this thread already" : "Write a reply first, then send it";
                const busy = state.busy.has(t.key);
                foot = `<div class="th-foot">${composer ? composerHtml(composer) : `<button type="button" class="reply-box" data-act="th-reply">Reply…</button>`}<div class="th-actions"><button type="button" data-act="${t.resolved ? "th-unresolve" : "th-resolve"}"${busy ? " disabled" : ""}>${t.resolved ? "Unresolve" : "Resolve conversation"}</button><button type="button" class="claude-btn" data-act="th-send" title="${esc(why)}"${canSend && !busy ? "" : " disabled"}><span class="claude-mark" aria-hidden="true"></span>Send to Claude</button></div></div>`;
            }
            return `<div class="${cls}" data-thread="${esc(t.key)}">${head}${loc}${comments}${foot}</div>`;
        }

        // ---- composers ----
        function composerKey(c) {
            if (c.type === "line") return `line|${c.path}|${c.side}|${c.startLine ?? c.line}|${c.line}`;
            if (c.type === "file") return `file|${c.path}`;
            if (c.type === "general") return "general";
            if (c.type === "reply") return `reply|${c.replyTo}`;
            return `edit|${c.docId}`;
        }

        function composerAnchor(cp) {
            if (cp.type === "line") return {side: cp.side, fi: cp.fi, startLine: cp.startLine, line: cp.line};
            const t = cp.type === "reply" ? state.threads.find((x) => x.replyIds.includes(cp.replyTo)) : cp.type === "edit" ? state.threads.find((x) => x.source === "db" && (x.id === cp.docId || x.replies.some((r) => r.id === cp.docId))) : null;
            return t && t.place === "line" ? {side: t.side, fi: t.fi, startLine: t.startLine, line: t.line} : null;
        }

        function anchorLines(a) {
            if (!a || a.side !== "RIGHT") return null;
            const f = files[a.fi];
            const lines = [];
            for (let n = a.startLine ?? a.line; n <= a.line; n++) lines.push(lineText(f, "RIGHT", n) ?? "");
            return lines;
        }

        function composerHtml(cp) {
            const ck = esc(cp.key);
            const primary = cp.type === "edit" ? "Save" : cp.type === "reply" ? "Reply" : "Add comment";
            const anchor = composerAnchor(cp);
            const suggest = anchor && anchor.side === "RIGHT" ? `<button type="button" class="mini" data-act="cp-suggest" title="Put the current lines in a suggestion block that you can edit">Suggest change</button>` : "";
            const p = cp.side === "LEFT" ? "L" : "R";
            const target = cp.type === "line" ? (cp.startLine ? `Comment on lines ${p}${cp.startLine}–${p}${cp.line}` : `Comment on line ${p}${cp.line}`)
                : cp.type === "file" ? `Comment on ${cp.path}` : cp.type === "general" ? "General comment" : "";
            const body = cp.tab === "preview"
                ? `<div class="cp-preview md">${cp.text.trim() ? md(cp.text, {inLine: Boolean(anchor), current: anchorLines(anchor)}) : `<p class="muted">Nothing to preview.</p>`}</div>`
                : `<textarea data-ck="${ck}" rows="4" placeholder="${cp.type === "reply" ? "Write a reply" : "Leave a comment"}" aria-label="${esc(target || primary)}"></textarea>`;
            return `<div class="composer" data-ck="${ck}">${target ? `<div class="cp-target">${esc(target)}</div>` : ""}<div class="cp-tabs" role="tablist"><button type="button" role="tab" data-act="cp-tab" data-tab="write" aria-selected="${cp.tab !== "preview"}">Write</button><button type="button" role="tab" data-act="cp-tab" data-tab="preview" aria-selected="${cp.tab === "preview"}">Preview</button>${suggest}</div>${body}<div class="cp-foot"><span class="hint">Markdown works · ${MOD}+Enter to ${primary.toLowerCase()}</span><span class="btns"><button type="button" data-act="cp-cancel">Cancel</button><button type="button" class="primary" data-act="cp-save"${cp.busy ? " disabled" : ""}>${primary}</button></span></div></div>`;
        }

        // Unsaved composer text, per anchor, so a reload brings it back
        let draftTimer = null;

        function persistDrafts() {
            // A draft that has no place on the page now (see restoreComposers) stays saved until the reader discards it
            const out = Object.fromEntries(state.unplaced);
            for (const cp of state.composers.values()) {
                if (!cp.text.trim()) continue;
                const {busy, tab, ...keep} = cp;
                out[cp.key] = {...keep, buildId: DATA.buildId, lineTextAt: cp.type === "line" ? lineText(files[cp.fi], cp.side, cp.line) : null};
            }
            state.savedDrafts = out;
            clearTimeout(draftTimer);
            draftTimer = setTimeout(() => store.set(KEY("review-drafts"), state.savedDrafts), 300);
        }

        // Runs on each comments snapshot: a reply or an edit waits until its document is there
        function restoreComposers() {
            if (!state.canComment) return;
            for (const [key, saved] of Object.entries(state.savedDrafts || {})) {
                if (!saved || typeof saved.text !== "string" || !saved.text.trim() || state.composers.has(key)) continue;
                let desc = null;
                if (saved.type === "general") desc = {type: "general"};
                else if (saved.type === "file" && fileByPath.has(saved.path)) desc = {type: "file", path: saved.path, fi: fileByPath.get(saved.path).fi};
                else if (saved.type === "reply" && typeof saved.replyTo === "string" && (saved.replyTo.startsWith("gh:") ? (github?.threads || []).some((g) => `gh:${g.id}` === saved.replyTo) : docById(saved.replyTo))) desc = {type: "reply", replyTo: saved.replyTo};
                else if (saved.type === "edit") {
                    const d = docById(saved.docId);
                    if (d && d.author === state.me && d.status === "draft") desc = {type: "edit", docId: saved.docId};
                } else if (saved.type === "line" && fileByPath.has(saved.path) && (saved.side === "LEFT" || saved.side === "RIGHT") && Number.isInteger(saved.line)) {
                    const f = fileByPath.get(saved.path);
                    const blob = sideBlob(f, saved.side);
                    let line = saved.line, start = saved.startLine ?? null;
                    if (saved.buildId !== DATA.buildId && blob && blob[line - 1] !== saved.lineTextAt) {
                        const found = findNear(blob, saved.lineTextAt, line);
                        if (found !== null && start !== null) start += found - line;
                        line = found;
                    }
                    if (line && blob && line <= blob.length) desc = {type: "line", fi: f.fi, path: f.path, side: saved.side, line, startLine: start && start >= 1 && start < line ? start : null, chunkId: chunkIdForLine(f.fi, saved.side, line)};
                }
                if (!desc) {
                    state.unplaced.set(key, saved);
                    continue;
                }
                state.unplaced.delete(key);
                desc.key = composerKey(desc);
                state.composers.set(desc.key, {...desc, text: saved.text, tab: "write", busy: false});
            }
            persistDrafts();
        }

        function openComposer(desc, initialText) {
            const key = composerKey(desc);
            let cp = state.composers.get(key);
            if (!cp) {
                cp = {...desc, key, text: state.savedDrafts[key]?.text || initialText || "", tab: "write", busy: false};
                state.composers.set(key, cp);
                // A saved draft with this key goes into the composer, not in two places
                state.unplaced.delete(key);
            } else {
                // The view can change after the composer opened: it goes where the reader clicked now
                if (desc.chunkId) cp.chunkId = desc.chunkId;
                if (initialText && !cp.text.trim()) cp.text = initialText;
            }
            cp.tab = "write";
            renderAll();
            focusComposer(key);
            persistDrafts();
        }

        function focusComposer(key) {
            const ta = document.querySelector(`textarea[data-ck="${CSS.escape(key)}"]`);
            if (!ta) return;
            ta.focus({preventScroll: true});
            ta.setSelectionRange(ta.value.length, ta.value.length);
            const r = ta.getBoundingClientRect();
            if (r.top < stickyOffset() || r.bottom > innerHeight) ta.scrollIntoView({block: "center", behavior: "auto"});
        }

        function closeComposer(key) {
            const cp = state.composers.get(key);
            state.composers.delete(key);
            if (cp && cp.type === "line") state.selected = null;
            persistDrafts();
            renderAll();
        }

        function rootDoc(cp, body, at) {
            const base = {v: 1, kind: "comment", author: state.me, body, createdAt: at, buildId: DATA.buildId, headSha: DATA.headSha, resolved: false, status: "draft"};
            if (cp.type === "general") return {...base, anchor: {type: "general"}};
            if (cp.type === "file") return {...base, anchor: {type: "file", path: cp.path}};
            const f = files[cp.fi];
            const start = cp.startLine ?? cp.line;
            const first = Math.max(1, start - 3);
            const lines = [];
            for (let n = first; n <= cp.line; n++) lines.push(lineText(f, cp.side, n) ?? "");
            const anchor = {type: "line", path: f.path, side: cp.side, line: cp.line, ...(start < cp.line ? {startLine: start} : {})};
            return {...base, anchor, lineText: lineText(f, cp.side, cp.line) ?? "", snippet: {start: first, lines}};
        }

        async function saveComposer(key) {
            const cp = state.composers.get(key);
            if (!cp || cp.busy || !state.db) return;
            const body = cp.text.trim();
            if (!body) {
                focusComposer(key);
                return;
            }
            cp.busy = true;
            renderAll();
            const at = nowIso();
            try {
                if (cp.type === "edit") await state.db.doc(`comments/${cp.docId}`).update({body, updatedAt: at});
                else if (cp.type === "reply") await state.db.collection("comments").add({v: 1, replyTo: cp.replyTo, author: state.me, body, createdAt: at, status: "draft"});
                else await state.db.collection("comments").add(rootDoc(cp, body, at));
                state.composers.delete(key);
                if (cp.type === "line") state.selected = null;
                persistDrafts();
                toast(cp.type === "edit" ? "Comment saved" : "Draft saved. Send it with Finish review.");
            } catch (err) {
                cp.busy = false;
                writeFailed(err, cp.type !== "edit");
            }
            renderAll();
        }

        function writeFailed(err, creating) {
            if (err && err.code === "invalid_argument" && creating && state.canWrite === null) {
                state.canWrite = false;
                updateCanComment();
                toast("You can read this review but not comment.", "error");
                return;
            }
            toast(err && err.code === "quota_exceeded" ? "The comment store is full." : "Could not save. Try again.", "error");
        }

        function updateCanComment() {
            state.canComment = Boolean(state.db && state.me && state.canWrite !== false && state.dbState === "ready");
        }

        // ---- render: content in blocks, a block is replaced only when its HTML changed ----
        const blockHtml = new Map();

        function reconcile(root, blocks) {
            const old = new Map([...root.children].map((el) => [el.id, el]));
            let cursor = root.firstElementChild;
            for (const {id, html} of blocks) {
                let el = old.get(id);
                if (!el || blockHtml.get(id) !== html) {
                    const tpl = document.createElement("template");
                    tpl.innerHTML = html;
                    const fresh = tpl.content.firstElementChild;
                    if (el) {
                        const scrollLeft = el.querySelector(".code-box")?.scrollLeft || 0;
                        el.replaceWith(fresh);
                        if (cursor === el) cursor = fresh;
                        const box = fresh.querySelector(".code-box");
                        if (box && scrollLeft) box.scrollLeft = scrollLeft;
                    }
                    el = fresh;
                    blockHtml.set(id, html);
                }
                old.delete(id);
                if (el === cursor) cursor = cursor.nextElementSibling;
                else root.insertBefore(el, cursor);
            }
            for (const [id, el] of old) {
                el.remove();
                blockHtml.delete(id);
            }
        }

        function chunkHtml(ch) {
            const f = files[ch.fi];
            const viewed = ch.units.length > 0 && ch.units.every((u) => state.viewed.has(u));
            const collapsed = viewed ? !state.open.has(ch.id) : state.closed.has(ch.id);
            const status = {added: "Added", deleted: "Deleted", renamed: "Renamed", binary: "Binary"}[f.status];
            const open = state.openCount.get(ch.id) || 0;
            const head = `<div class="fhead"><button type="button" class="tog" data-act="toggle-chunk" aria-expanded="${!collapsed}" aria-label="${collapsed ? "Show" : "Hide"} ${esc(f.path)}">${collapsed ? "▸" : "▾"}</button>`
                + (status ? `<span class="badge ${esc(f.status)}">${status}</span>` : "")
                + `<span class="path">${esc(f.path)}${f.status === "renamed" && f.oldPath ? `<span class="from">from ${esc(f.oldPath)}</span>` : ""}</span>`
                + (f.lang ? `<span class="tag">${esc(f.lang)}</span>` : "")
                + `<span class="d"><b class="plus">+${f.adds ?? 0}</b> <b class="minus">−${f.dels ?? 0}</b></span>`
                + (open ? `<span class="pill open-th">${plural(open, "open thread")}</span>` : "")
                + (ch.isNew && !f.hunks.length ? `<span class="pill new">New</span>` : "")
                + `<label class="viewed-box"><input type="checkbox" data-act="chunk-viewed"${viewed ? " checked" : ""}> Viewed</label>`
                + `<button type="button" class="kebab" data-act="file-menu" aria-haspopup="menu" aria-label="Actions for ${esc(f.path)}">⋯</button></div>`;
            return `<section class="file ${esc(f.kind || "code")}${viewed ? " is-viewed" : ""}${collapsed ? " collapsed" : ""}" id="${ch.id}" data-fi="${ch.fi}" data-gid="${esc(ch.gid)}" aria-label="${esc(f.path)}">${head}<div class="fbody">${collapsed ? "" : chunkBody(ch, f)}</div></section>`;
        }

        function chunkBody(ch, f) {
            let html = "";
            if (f.note) html += `<div class="fnote"><span class="claude-mark sm" aria-hidden="true"></span><div><span class="lbl">About this file</span><div>${f.note}</div></div></div>`;
            const fileThreads = (state.fileIndex.get(f.fi) || []).filter((t) => t.chunk === ch.id && visibleThread(t));
            const composer = state.composers.get(`file|${f.path}`);
            const showComposer = composer && firstChunkId(f.fi) === ch.id;
            if (fileThreads.length || showComposer) html += `<div class="fthreads"><span class="fh">On the whole file</span>${fileThreads.map((t) => threadCard(t, "file")).join("")}${showComposer ? composerHtml(composer) : ""}</div>`;
            if (f.status === "binary" || (!f.hunks.length && !f.newBlob && !f.oldBlob)) html += `<p class="binary">${f.status === "binary" ? "Binary file. The page does not show its content." : "No text content to show."}</p>`;
            else html += `<div class="code-box">${renderTable(ch)}</div>`;
            const outdated = (state.outdatedIndex.get(f.fi) || []).filter((t) => t.chunk === ch.id && visibleThread(t));
            if (outdated.length) html += `<div class="outdated-box"><h4>Outdated threads</h4><p class="muted">The code changed, so these threads are not on a line now.</p>${outdated.map((t) => threadCard(t, "outdated")).join("")}</div>`;
            return html;
        }

        function topicHtml(plan) {
            const g = plan.g;
            const chunks = state.chunks.filter((ch) => ch.gid === g.id);
            const units = chunks.flatMap((ch) => ch.units);
            const viewed = units.length > 0 && units.every((u) => state.viewed.has(u));
            let adds = 0, dels = 0;
            for (const fi of plan.fis) for (const h of files[fi].hunks) if (h.group === g.id) {
                adds += h.adds;
                dels += h.dels;
            }
            const open = chunks.reduce((n, ch) => n + (state.openCount.get(ch.id) || 0), 0);
            const fresh = chunks.filter((ch) => ch.isNew).length;
            return `<header class="topic-head${viewed ? " is-viewed" : ""}" id="topic-${g.id}" data-gid="${g.id}"><div class="meta"><span class="idx">Topic ${g.gi + 1} of ${groups.length}</span><span class="chip">${plural(plan.fis.length, "file")}</span><span class="d"><b class="plus">+${adds}</b> <b class="minus">−${dels}</b></span>${open ? `<span class="pill open-th">${plural(open, "open thread")}</span>` : ""}${fresh ? `<span class="pill new">New</span>` : ""}<label class="viewed-box"><input type="checkbox" data-act="topic-viewed"${viewed ? " checked" : ""}> Viewed</label></div><h2>${esc(g.title)}</h2>${g.summary ? `<p class="sum">${g.summary}</p>` : ""}</header>`;
        }

        function renderContent() {
            const blocks = [];
            if (state.view === "topic") {
                for (const plan of topicPlan) {
                    const chunks = state.chunks.filter((ch) => ch.gid === plan.g.id && !chunkHidden(ch));
                    if (state.onlyNew && !chunks.length) continue;
                    blocks.push({id: `topic-${plan.g.id}`, html: topicHtml(plan)});
                    for (const ch of chunks) blocks.push({id: ch.id, html: chunkHtml(ch)});
                }
                const others = state.chunks.filter((ch) => ch.id.startsWith("ch-other-") && !chunkHidden(ch));
                if (others.length) {
                    blocks.push({id: "topic-other", html: `<header class="topic-head" id="topic-other"><div class="meta"><span class="idx">Other changes</span></div><h2>Files without a topic</h2></header>`});
                    for (const ch of others) blocks.push({id: ch.id, html: chunkHtml(ch)});
                }
            } else {
                for (const ch of state.chunks) if (!chunkHidden(ch)) blocks.push({id: ch.id, html: chunkHtml(ch)});
            }
            if (!blocks.length) blocks.push({id: "content-empty", html: `<p class="empty" id="content-empty">${state.onlyNew ? "No change is new since your last visit." : "This branch has no changes."}</p>`});
            reconcile($("content"), blocks);
        }

        // ---- header and walkthrough ----
        function renderHeader() {
            const parts = [DATA.ticket, DATA.branch, DATA.headSha ? `head ${short(DATA.headSha).slice(0, 7)}` : ""].filter(Boolean).map((p) => `<span>${esc(p)}</span>`);
            if (DATA.dirty) parts.push(`<span class="pill dirty">Uncommitted changes included</span>`);
            if (DATA.builtAt) parts.push(`<span title="${esc(fullDate(DATA.builtAt))}">built ${esc(fullDate(DATA.builtAt))}</span>`);
            $("eyebrow").innerHTML = parts.join(`<span class="sep" aria-hidden="true">·</span>`);
            $("heading").textContent = DATA.heading || DATA.title || "Review";
            const stats = DATA.stats || {files: files.length, adds: files.reduce((n, f) => n + (f.adds || 0), 0), dels: files.reduce((n, f) => n + (f.dels || 0), 0)};
            const pr = DATA.pr ? ` · <a href="${GH}/pull/${encodeURIComponent(DATA.pr)}" target="_blank" rel="noopener">PR #${esc(DATA.pr)}</a>` : "";
            $("lede").innerHTML = `${DATA.intro ? `${DATA.intro} ` : ""}<span class="d"><b class="plus">+${stats.adds}</b> <b class="minus">−${stats.dels}</b></span> in ${plural(stats.files, "file")}${pr} · Compared with <code>${esc(DATA.base || "")}</code> at <code>${esc(short(DATA.baseSha).slice(0, 7))}</code>.`;
            const note = $("newnote");
            if (newUnits.size) {
                note.hidden = false;
                note.innerHTML = `<span class="pill new">New</span><span>${newUnits.size === 1 ? "1 change is" : `${newUnits.size} changes are`} new since your last visit.</span><button type="button" class="mini" data-act="only-new" aria-pressed="false">Only new</button>`;
            }
            renderPrBox();
        }

        // ---- the PR on GitHub at build time: state, author, review status, reviewers and checks ----
        const ghPr = github && github.pr;
        const ICONS = {
            ok: `<path d="M3 8.5l3.2 3.2L13 4.8"/>`,
            bad: `<path d="M4 4l8 8M12 4l-8 8"/>`,
            wait: `<circle cx="8" cy="8" r="3.5" fill="currentColor" stroke="none"/>`,
            comment: `<path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/>`,
            skip: `<path d="M4 8h8"/>`,
            refresh: `<path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3"/>`,
        };
        const icon = (name) => `<svg class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
        const REVIEW_LOOK = {
            APPROVED: ["ok", "ok", "approved"],
            CHANGES_REQUESTED: ["bad", "bad", "requested changes"],
            COMMENTED: ["", "comment", "commented"],
            DISMISSED: ["", "skip", "review dismissed"],
        };
        const CHECK_LOOK = {failure: ["bad", "bad"], pending: ["wait", "wait"], success: ["ok", "ok"], skipped: ["", "skip"]};
        const CHECK_WORDS = {failure: "failing", pending: "pending", success: "successful", skipped: "skipped"};

        function prLineHtml(p) {
            const state = {open: "Open", draft: "Draft", merged: "Merged", closed: "Closed"}[p.state] || "Open";
            const author = `<b title="${esc(p.authorName || "")}">${esc(p.author)}</b>`;
            const commits = `${plural(p.commits, "commit")} into <code>${esc(p.baseRef)}</code> from <code>${esc(p.headRef)}</code>`;
            const when = (iso) => `<time class="ago" datetime="${esc(iso || "")}" title="${esc(fullDate(iso))}"></time>`;
            let what = `${author} wants to merge ${commits}`;
            if (p.state === "merged") what = `${p.mergedBy ? `<b>${esc(p.mergedBy)}</b>` : author} merged ${commits} ${when(p.closedAt)}${p.mergedBy && p.mergedBy !== p.author ? ` · author ${author}` : ""}`;
            else if (p.state === "closed") what = `${author} wanted to merge ${commits} · closed ${when(p.closedAt)}`;
            return `<div class="prline"><span class="prstate ${esc(p.state)}">${state}</span><span>${what}</span></div>`;
        }

        function reviewRowHtml(p) {
            const count = (s) => p.reviewers.filter((r) => r.state === s).length;
            const [cls, ic, title, sub] = {
                APPROVED: ["ok", "ok", "Changes approved", plural(count("APPROVED"), "approving review")],
                CHANGES_REQUESTED: ["bad", "bad", "Changes requested", `${plural(count("CHANGES_REQUESTED"), "review")} asking for changes`],
                REVIEW_REQUIRED: ["wait", "wait", "Review required", "An approving review is required."],
            }[p.reviewDecision] || ["", "comment", "No review required", count("APPROVED") ? plural(count("APPROVED"), "approving review") : "No approving review."];
            const list = p.reviewers.map((r) => {
                const [rcls, ric, word] = r.requested ? ["wait", "wait", "awaiting review"] : REVIEW_LOOK[r.state] || ["", "comment", String(r.state || "").toLowerCase().replace(/_/g, " ")];
                const name = r.team ? `@${r.login}` : r.login;
                const at = r.at && !r.requested ? `<time class="ago muted" datetime="${esc(r.at)}" title="${esc(fullDate(r.at))}"></time>` : "";
                // A review of an older commit than the PR head
                const older = r.sha && r.sha !== p.headSha && !r.requested ? `<span class="muted">on <code>${esc(r.sha.slice(0, 7))}</code></span>` : "";
                return `<li><span class="av gh-av" aria-hidden="true">${esc(String(r.login).slice(0, 1).toUpperCase())}</span><b>${esc(name)}</b>${r.bot ? `<span class="botmark">bot</span>` : ""}<span class="rst ${rcls}">${icon(ric)}${esc(word)}</span>${at}${older}</li>`;
            }).join("");
            return `<div class="prrow"><span class="pric ${cls}">${icon(ic)}</span><div class="prtext"><b>${title}</b><span class="muted">${esc(sub)}</span>${list ? `<ul class="revs" aria-label="Reviewers">${list}</ul>` : `<span class="muted">No reviewers.</span>`}</div></div>`;
        }

        function checksRowHtml(p) {
            const n = {failure: 0, pending: 0, success: 0, skipped: 0};
            for (const c of p.checks) n[c.result] = (n[c.result] || 0) + 1;
            const counts = [[n.failure, "failing"], [n.pending, "pending"], [n.success, "successful"], [n.skipped, "skipped"]].filter(([k]) => k).map(([k, word]) => `${k} ${word}`).join(", ");
            // As on GitHub: skipped checks do not stop "passed"
            const [cls, ic, title] = n.failure ? ["bad", "bad", "Some checks were not successful"] : n.pending ? ["wait", "wait", "Some checks have not completed"] : n.success || n.skipped ? ["ok", "ok", "All checks have passed"] : ["", "skip", "No checks"];
            const items = p.checks.map((c) => {
                const [ccls, cic] = CHECK_LOOK[c.result] || ["", "skip"];
                const link = /^https:\/\//.test(c.url) ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">Details</a>` : "";
                return `<li><span class="rst ${ccls}">${icon(cic)}<span class="sr-only">${CHECK_WORDS[c.result] || ""}</span></span>${c.workflow ? `<span class="wf">${esc(c.workflow)} /</span>` : ""}<b>${esc(c.name)}</b>${link}</li>`;
            }).join("");
            const open = state.details.has("pr-checks") ? " open" : "";
            return `<div class="prrow"><span class="pric ${cls}">${icon(ic)}</span><div class="prtext"><b>${title}</b>${counts ? `<span class="muted">${counts}</span>` : ""}${items ? `<details class="checks" data-dkey="pr-checks"${open}><summary>Show all checks (${p.checks.length})</summary><ul>${items}</ul></details>` : ""}</div></div>`;
        }

        function prFootHtml(p) {
            const link = GITHUB_URL.test(p.url) ? ` · <a href="${esc(p.url)}" target="_blank" rel="noopener">PR #${esc(p.number)} on GitHub</a>` : "";
            return `<div class="prfoot" id="prfoot"><span>GitHub data from ${esc(fullDate(p.fetchedAt))}${link}</span></div>`;
        }

        function renderPrBox() {
            if (!ghPr) return;
            $("prbox").hidden = false;
            $("prbox").innerHTML = `${prLineHtml(ghPr)}<div class="prbox">${reviewRowHtml(ghPr)}${checksRowHtml(ghPr)}${prFootHtml(ghPr)}</div>`;
            renderPrFoot();
        }

        // A check with no answer after this time does not block a new one: Claude may never get it (no sync)
        const GH_WAIT_MS = 10 * 60 * 1000;
        const ghWaitingNow = () => Boolean(state.ghWaiting) && Date.now() - state.ghWaiting.at < GH_WAIT_MS;

        // The button sends a check to Claude: the page cannot read GitHub itself. It changes in place, because a new
        // node loses the focus, and a render between mousedown and mouseup loses the click.
        function renderPrFoot() {
            const foot = ghPr && $("prfoot");
            if (!foot) return;
            let btn = $("gh-check-btn");
            if (!(state.dbState === "ready" && state.me && state.canWrite !== false)) {
                btn?.remove();
                return;
            }
            if (!btn) {
                foot.insertAdjacentHTML("beforeend", `<button type="button" id="gh-check-btn" data-act="gh-check" title="Ask Claude to compare the PR on GitHub with this page">${icon("refresh")}<span></span></button>`);
                btn = $("gh-check-btn");
            }
            const waiting = ghWaitingNow();
            const label = waiting ? "Claude checks GitHub…" : "Check GitHub";
            if (btn.lastElementChild.textContent !== label) btn.lastElementChild.textContent = label;
            btn.setAttribute("aria-disabled", String(waiting));
        }

        const typingNow = () => Boolean(document.activeElement?.closest?.("textarea, input, select, [contenteditable]"));
        // A render can replace the focused field, so the popup waits for any change of focus, not for one field's blur
        document.addEventListener("focusout", () => setTimeout(() => {
            if (state.ghNews && !typingNow()) showGithubNews(state.ghNews);
        }));

        function waitForCheck(id, at) {
            state.ghWaiting = {id, at};
            setTimeout(renderPrFoot, Math.max(0, at + GH_WAIT_MS - Date.now()) + 1000);
        }

        function showGithubNews(b) {
            if (b.status === "failed") return toast(typeof b.note === "string" && b.note ? b.note : "Claude could not check GitHub.", "error");
            const changes = Array.isArray(b.changes) ? b.changes.filter((c) => typeof c === "string" && c.trim()) : [];
            if (!changes.length) return toast(`Nothing new on GitHub since ${fullDate(ghPr.fetchedAt)}.`);
            // The popup takes the keys: while the reader types, it waits until the focus leaves the text fields
            if (typingNow()) {
                if (!state.ghNews) toast("There is something new on GitHub. The list opens when you leave the text field.");
                state.ghNews = b;
                return;
            }
            state.ghNews = null;
            const link = GITHUB_URL.test(ghPr.url) ? `<a href="${esc(ghPr.url)}" target="_blank" rel="noopener">Open the PR on GitHub</a>` : "";
            const dialog = $("gh-news");
            dialog.innerHTML = `<h2 id="gh-news-title">New on GitHub</h2><p class="muted">Since this page was built (${esc(fullDate(ghPr.fetchedAt))}):</p><ul>${changes.slice(0, 30).map((c) => `<li>${esc(cut(c, 300))}</li>`).join("")}</ul><p>This page still shows the PR as it was. Ask Claude to rebuild the page to see the changes.</p><div class="gh-news-btns">${link}<button type="button" class="primary" data-act="gh-news-close">Close</button></div>`;
            if (!dialog.open) dialog.showModal();
        }

        // Call from the click: the room send must happen before any await
        function startGithubCheck() {
            if (ghWaitingNow() || state.dbState !== "ready") return;
            const ref = state.db.collection("batches").doc();
            waitForCheck(ref.id, Date.now());
            renderPrFoot();
            startBatch({ref, target: "refresh", ids: [], items: []}).then((ok) => {
                if (!ok && state.ghWaiting?.id === ref.id) state.ghWaiting = null;
                renderPrFoot();
            });
        }

        // After a batches snapshot: the answer to the check this viewer waits for, or after a reload a recent check
        // of this viewer that has no answer yet
        function followGithubCheck() {
            const asked = state.ghWaiting && state.batches.find((b) => b.id === state.ghWaiting.id);
            if (asked && (asked.status === "done" || asked.status === "failed")) {
                state.ghWaiting = null;
                showGithubNews(asked);
            } else if (!state.ghWaiting && !state.ghRecovered && state.me) {
                state.ghRecovered = true;
                const open = state.batches.find((b) => b.target === "refresh" && b.author === state.me && (b.status === "pending" || b.status === "working"));
                const at = open ? Date.parse(open.createdAt) : NaN;
                if (Date.now() - at < GH_WAIT_MS) waitForCheck(open.id, at);
            }
        }

        function renderWalkStatic() {
            let html = "";
            if (DATA.effort && Number.isFinite(DATA.effort.level)) {
                const level = Math.max(1, Math.min(5, Math.round(DATA.effort.level)));
                html += `<div class="effort"><b>Review effort ${level} of 5</b><span class="meter" aria-hidden="true">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= level ? "on" : ""}"></i>`).join("")}</span>${Number.isFinite(DATA.effort.minutes) ? `<span class="muted">· about ${Math.round(DATA.effort.minutes)} min</span>` : ""}</div>`;
            }
            if (groups.length) {
                const rows = topicPlan.map((plan) => {
                    const g = plan.g;
                    const filesCol = plan.fis.map((fi) => {
                        const f = files[fi];
                        let a = 0, d = 0;
                        for (const h of f.hunks) if (h.group === g.id) {
                            a += h.adds;
                            d += h.dels;
                        }
                        const what = f.hunks.length ? `<span class="plus">+${a}</span> <span class="minus">−${d}</span>` : esc(f.status);
                        return `<span title="${esc(f.path)}">${esc(basename(f.path))} ${what}</span>`;
                    }).join("");
                    return `<tr><td class="num">${g.gi + 1}</td><td class="tt"><a href="#topic-${g.id}" data-act="goto-topic" data-gid="${g.id}">${esc(g.title)}</a></td><td><div class="tf">${filesCol}</div></td><td class="sum">${g.summary || ""}</td></tr>`;
                }).join("");
                html += `<section class="wsec"><h4>Topics</h4><table class="topics"><thead><tr><th>#</th><th>Topic</th><th>Files</th><th>Summary</th></tr></thead><tbody>${rows}</tbody></table></section>`;
            }
            if (DATA.diagram) html += `<details class="diagram" open><summary>Diagram</summary><div class="diagram-box" id="diagram-box"><p class="empty loading">Drawing the diagram</p></div></details>`;
            $("w-static").innerHTML = html;
        }

        // ---- diagram: Mermaid draws DATA.diagram in the page colors, and again when the theme changes ----
        const MERMAID_SRC = "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js";
        const MERMAID_SRI = "sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2";
        const MERMAID_SLOW = 8000;
        let mermaidLoad = null;
        let diagramQueue = Promise.resolve();
        let diagramDrawn = "";
        let diagramRuns = 0;

        // The same rule as the CSS: data-theme first, else the system setting
        const darkTheme = () => {
            const theme = document.documentElement.dataset.theme;
            return theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        };

        function diagramConfig() {
            const css = getComputedStyle(document.documentElement);
            const token = (name) => css.getPropertyValue(name).trim();
            return {
                startOnLoad: false,
                securityLevel: "strict",
                suppressErrorRendering: true,
                // Labels are SVG text: an HTML label can add a form, or an element with a page id such as "content".
                // Mermaid adds these keys to its secure keys, so a %%{init}%% line in the diagram cannot change them.
                htmlLabels: false,
                secure: ["htmlLabels", "theme", "themeVariables", "themeCSS", "fontFamily"],
                theme: "base",
                fontFamily: token("--font-body"),
                themeVariables: {
                    darkMode: darkTheme(),
                    background: token("--surface"),
                    fontFamily: token("--font-body"),
                    primaryColor: token("--note-bg"),
                    primaryTextColor: token("--fg"),
                    primaryBorderColor: token("--muted"),
                    secondaryColor: token("--accent-soft"),
                    tertiaryColor: token("--gap-bg"),
                    lineColor: token("--muted"),
                    edgeLabelBackground: token("--surface"),
                    textColor: token("--fg"),
                    noteBkgColor: token("--warn-bg"),
                    noteTextColor: token("--fg"),
                    noteBorderColor: token("--warn"),
                },
            };
        }

        const loadMermaid = () => (mermaidLoad ??= new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = MERMAID_SRC;
            script.integrity = MERMAID_SRI;
            script.crossOrigin = "anonymous";
            script.onload = () => (window.mermaid ? resolve(window.mermaid) : reject(new Error("no window.mermaid")));
            script.onerror = () => reject(new Error("the script did not load"));
            document.head.append(script);
        }));

        // The box changes height. The page sets overflow-anchor: none, so it keeps the reader's place itself.
        function fillDiagramBox(html) {
            const anchor = scrollAnchor();
            const box = $("diagram-box");
            box.innerHTML = html;
            // Mermaid fits the drawing to the box. Below 60 % of its size the text is too small: the box scrolls.
            const drawing = box.querySelector(":scope > svg");
            const full = parseFloat(drawing?.style.maxWidth);
            if (full) drawing.style.minWidth = `${Math.round(full * 0.6)}px`;
            restoreAnchor(anchor);
        }

        const showDiagramSource = (why) => fillDiagramBox(`<p class="empty">${esc(why)} This is the diagram source.</p><pre>${esc(DATA.diagram)}</pre>`);

        async function drawDiagramNow() {
            if (diagramDrawn === "failed") return;
            // On a slow network the reader gets the source first, and the drawing replaces it later
            const slow = setTimeout(() => showDiagramSource("Mermaid is still loading."), MERMAID_SLOW);
            let mermaid;
            try {
                [mermaid] = await Promise.all([loadMermaid(), document.fonts?.ready]);
            } catch {
                diagramDrawn = "failed";
                return showDiagramSource("Mermaid did not load.");
            } finally {
                clearTimeout(slow);
            }
            const config = diagramConfig();
            const key = JSON.stringify(config.themeVariables);
            if (key === diagramDrawn) return;
            mermaid.initialize(config);
            const id = `diagram-${++diagramRuns}`;
            try {
                fillDiagramBox((await mermaid.render(id, DATA.diagram)).svg);
                diagramDrawn = key;
            } catch (e) {
                // Mermaid keeps its temporary element when a style rule of the diagram is not valid CSS
                document.getElementById(`d${id}`)?.remove();
                // The source stays the same, so a new theme does not fix it
                diagramDrawn = "failed";
                const why = String(e?.message || e).split("\n")[0].replace(/\s+/g, " ").replace(/[\s.:]+$/, "");
                showDiagramSource(`Mermaid cannot draw this diagram: ${why}.`);
            }
        }

        // Mermaid draws one diagram at a time: it keeps one config, and the theme can change while it draws
        const drawDiagram = () => (diagramQueue = diagramQueue.then(drawDiagramNow));

        function noticeHtml() {
            if (state.dbState === "none") return `<div class="notice" id="w-notice">Comments need the claude.ai page. Open this review on claude.ai, signed in, to see Claude's findings and to comment.</div>`;
            if (state.dbState === "error") return `<div class="notice" id="w-notice">Comments are not available in this view now.</div>`;
            if (state.dbState === "ready" && !state.me) return `<div class="notice" id="w-notice">Sign in to claude.ai to comment.</div>`;
            if (state.dbState === "ready" && state.canWrite === false) return `<div class="notice" id="w-notice">You can read this review but not comment. Ask the owner for Contributor access.</div>`;
            return "";
        }

        function findingLink(t) {
            const loc = t.path ? `${basename(t.path)}:${t.place === "line" ? t.line : t.storedLine ?? ""}` : "";
            return `<li><span class="sev ${severityOf(t.doc)}">${SEVERITY_LABEL[severityOf(t.doc)]}</span><a href="#" data-act="goto-thread" data-key="${esc(t.key)}">${esc(t.doc.title || "Finding")}</a>${loc ? `<span class="loc">${esc(loc)}${t.place === "outdated" ? " · outdated" : ""}</span>` : ""}</li>`;
        }

        const openFindings = () => state.threads.filter((t) => t.kind === "finding" && !t.resolved)
            .sort((a, b) => SEVERITIES.indexOf(severityOf(a.doc)) - SEVERITIES.indexOf(severityOf(b.doc)) || (a.fi ?? 1e9) - (b.fi ?? 1e9) || (a.line ?? a.storedLine ?? 0) - (b.line ?? b.storedLine ?? 0));

        function findingsHtml() {
            let inner;
            if (state.dbState === "none" || state.dbState === "error") inner = `<p class="empty">Sign in to claude.ai to see findings and comments.</p>`;
            else if (!state.loaded.comments) inner = `<p class="empty loading">Loading findings</p>`;
            else {
                const all = state.threads.filter((t) => t.kind === "finding");
                if (!all.length) inner = `<p class="empty ok">Claude found no problems.</p>`;
                else {
                    const counts = SEVERITIES.map((s) => {
                        const of = all.filter((t) => severityOf(t.doc) === s);
                        if (!of.length) return "";
                        const open = of.filter((t) => !t.resolved).length;
                        return `<span class="cnt"><span class="sev ${s}">${SEVERITY_LABEL[s]}</span><span>${open} open · ${of.length - open} resolved</span></span>`;
                    }).join("");
                    const open = openFindings();
                    inner = `<div class="sevrow">${counts}</div>${open.length ? `<ul class="flist">${open.map(findingLink).join("")}</ul>` : `<p class="empty ok">Every finding is resolved.</p>`}`;
                }
            }
            return `<section class="wsec" id="w-findings"><h4>Findings</h4>${inner}</section>`;
        }

        function batchesHtml() {
            if (state.dbState !== "ready" || !state.batches.length) return "";
            // Only the newest GitHub check, so that the checks do not push the comment batches out of the list
            const newestCheck = state.batches.find((b) => b.target === "refresh");
            const items = state.batches.filter((b) => b.target !== "refresh" || b === newestCheck).slice(0, 5).map((b) => {
                const n = Array.isArray(b.ids) ? b.ids.length : 0;
                const status = ["pending", "working", "done", "failed"].includes(b.status) ? b.status : "pending";
                return `<li><b>${b.target === "github" ? "To GitHub" : b.target === "refresh" ? "GitHub check" : "To Claude"}</b>${b.target === "refresh" ? "" : `<span>${plural(n, "comment")}</span>`}<span class="bst ${status}">${status}</span><span class="muted">by ${esc(nameOf(b.author))} · <time class="ago" datetime="${esc(b.createdAt || "")}" title="${esc(fullDate(b.createdAt))}"></time></span>${typeof b.note === "string" && b.note ? `<span class="bnote">${esc(b.note)}</span>` : ""}</li>`;
            }).join("");
            return `<section class="wsec" id="w-batches"><h4>Recent batches</h4><ul class="batches">${items}</ul></section>`;
        }

        // Composer text that has no place on the page now: the line changed in a rebuild, or the thread or the draft is gone
        function unplacedHtml() {
            if (!state.unplaced.size) return "";
            const where = (s) => (s.type === "line" ? `${s.path}:${s.startLine ? `${s.startLine}–` : ""}${s.line}` : s.type === "file" ? s.path : {general: "General comment", reply: "Reply", edit: "Edit of a comment"}[s.type] || "Comment");
            const items = [...state.unplaced].map(([key, s]) => `<li data-draft="${esc(key)}"><div class="ud-head"><span class="what">${esc(where(s))}</span><span class="btns"><button type="button" class="mini" data-act="draft-copy">Copy</button><button type="button" class="mini" data-act="draft-discard">Discard</button></span></div><pre>${esc(s.text)}</pre></li>`).join("");
            return `<section class="wsec" id="w-drafts"><h4>Unsaved drafts</h4><p class="muted">The code or the thread changed after you wrote these, so they have no place on the page now. Copy a text to comment again, or discard it.</p><ul class="udrafts">${items}</ul></section>`;
        }

        function lostHtml() {
            const list = state.lost.filter(visibleThread);
            if (!list.length) return "";
            return `<section class="wsec" id="w-lost"><h4>Outdated comments</h4><p class="muted">These comments are on files that are not in this review now.</p>${list.map((t) => threadCard(t, "lost")).join("")}</section>`;
        }

        function conversationHtml() {
            const parts = [];
            if (state.dbState === "ready") {
                const general = state.general.filter(visibleThread).map((t) => threadCard(t, "general")).join("");
                const composer = state.composers.get("general");
                const start = state.canComment ? (composer ? composerHtml(composer) : `<button type="button" class="start-box" data-act="open-general">Add a general comment…</button>`) : "";
                parts.push(`<div class="stack">${general || (state.loaded.comments ? "" : `<p class="empty loading">Loading comments</p>`)}${start}</div>`);
            }
            if (github) {
                const conv = github.conversation || [];
                if (conv.length) {
                    const open = state.details.has("pr-conv") ? " open" : "";
                    parts.push(`<details class="dz" data-dkey="pr-conv"${open}><summary>PR conversation on GitHub (${conv.length})</summary><div class="thread">${conv.map(ghComment).join("")}</div></details>`);
                }
                const moved = state.ghconv.filter(visibleThread);
                if (moved.length) parts.push(`<div class="stack"><h4>GitHub threads not on the current code</h4>${moved.map((t) => threadCard(t, "ghconv")).join("")}</div>`);
            }
            if (!parts.length) return "";
            return `<section class="wsec" id="w-conv"><h4>Conversation</h4>${parts.join("")}</section>`;
        }

        function renderWalkDynamic() {
            const blocks = [];
            for (const html of [noticeHtml(), unplacedHtml(), findingsHtml(), batchesHtml(), lostHtml(), conversationHtml()]) {
                const id = /^<\w+[^>]*\sid="([^"]+)"/.exec(html)?.[1];
                if (id) blocks.push({id, html});
            }
            reconcile($("w-dyn"), blocks);
        }

        // ---- sidebar and toolbar ----
        function renderSidebar() {
            const units = allUnits.length;
            const done = allUnits.filter((u) => state.viewed.has(u)).length;
            const progress = `<div class="panel" id="s-progress"><h3>Progress</h3><div class="progress" aria-hidden="true"><i style="width:${units ? (100 * done) / units : 0}%"></i></div><p class="d">${done} of ${plural(units, "change")} viewed</p></div>`;
